window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(!s||JSON.stringify(s)===lastSaved)return;restore(s);render();});
function ds(){return state.states[state.active]??(state.states[state.active]={phase:0,tens:0,ones:34,ruler:0,cells:[],cut:false,slide:0,prediction:'',fold:0,yaw:.55,pitch:.8,seen:[],input:1,piles:[2,5,8],donor:null,draws:0,stars:0});}
function beep(){if(!state.sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const t=audioContext.currentTime;[440,660,880].forEach((freq,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=freq;o.connect(g);g.connect(audioContext.destination);g.gain.setValueAtTime(.0001,t+i*.06);g.gain.exponentialRampToValueAtTime(.065,t+i*.06+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.06+.15);o.start(t+i*.06);o.stop(t+i*.06+.16);});}catch{}}
function message(text,tone=''){state.feedback=text;state.tone=tone;}
function wrong(text){state.combo=0;message(text,'wrong');save();render();}
function award(key,text){if(!state.earned.includes(key)){state.earned.push(key);state.combo++;beep();}message(text,'good');}
function finishFirst(text){award(state.active+'-discover',text);ds().phase=1;save();render();}
function finishAll(text){award(state.active+'-transfer',text);ds().phase=2;save();render();}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function drawCube(){const o=svgSetup('eml-cube-svg',285);if(!o)return;const {svg,w}=o,s=ds(),frame=net.frames[s.phase===1?0:Math.round(s.fold/5)],yaw=s.yaw,pitch=s.pitch;

const polys=frame.map((f,i)=>({i,pts:f.map(project)})),pts=polys.flatMap(f=>f.pts),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),sc=Math.min((w-40)/(maxX-minX||1),235/(maxY-minY||1)),cx=(minX+maxX)/2,cy=(minY+maxY)/2;

svg.setAttribute('aria-label',`Blender에서 제작한 정육면체 ${s.fold}% 접힌 전개도. 면 A B C D E F. 보기 버튼으로 방향 변경.`);}
function drawDynamic(){if(state.mode!=='play')return;if(state.active==='ruler')drawRuler();if(state.active==='area')drawArea();if(state.active==='cube')drawCube();}
function review(){const grade=Number(state.grade),semester=Number(state.semester),list=curriculum.units.filter(u=>u.grade===grade&&u.semester===semester);let u=list.find(u=>u.id===state.unit)||list[0];state.unit=u.id;const source=curriculum.sources[u.source];body.innerHTML=`<section class="eml-review"><div class="eml-kicker">교사 검토 · 2022 개정 교육과정</div><h2>71개 주요 단원, 서로 다른 학습 조작</h2><p class="eml-intro">1~6학년 · 12학기. 각 단원의 학습 설계와 보완이 필요한 부분을 살펴보세요.</p><div class="eml-row"><label>학년 <select data-filter="grade" aria-label="학년">${[1,2,3,4,5,6].map(g=>`<option value="${g}" ${g===grade?'selected':''}>${g}학년</option>`).join('')}</select></label><label>학기 <select data-filter="semester" aria-label="학기">${[1,2].map(s=>`<option value="${s}" ${s===semester?'selected':''}>${s}학기</option>`).join('')}</select></label><span class="eml-tag">설계 검토 71단원 · 대표 체험 8개</span></div><div class="eml-review-grid"><nav class="eml-unit-list" aria-label="단원 선택">${list.map(v=>button(`${v.unit}. ${esc(v.title)}`,'unit',`data-value="${v.id}" aria-pressed="${v.id===u.id}"`)).join('')}</nav><article class="eml-unit-detail"><div class="eml-kicker">${u.grade}학년 ${u.semester}학기 · ${u.unit}단원</div><h3>${esc(u.title)}</h3><dl><dt>핵심 개념</dt><dd>${esc(u.concept)}</dd><dt>직접 할 일</dt><dd>${esc(u.action)}</dd><dt>이해 확인</dt><dd>${esc(u.evidence)}</dd><dt>보완할 부분</dt><dd>${esc(u.limit)}</dd><dt>Blender 활용</dt><dd>${esc(u.blender)}</dd><dt>현재 범위</dt><dd>${u.demos.length?'이 단원의 일부를 보여 주는 대표 활동이 있습니다. 단원 전체 수업은 미구현입니다.':'활동 설계안입니다. 이 단원 수업은 아직 구현하지 않았습니다.'}</dd></dl>${u.demos.length?`<div class="eml-row">${u.demos.map(id=>button(demos.find(d=>d.id===id).name+' 체험','open-demo',`data-value="${id}"`)).join('')}</div>`:''}<p class="eml-note">차례 확인: <a href="${source.url}" target="_blank" rel="noopener noreferrer">${esc(source.name)}</a></p></article></div><p class="eml-note">주요 단원 기준이며 도입·마무리 프로젝트는 개수에서 제외했습니다. 검정 교과서별 단원명·순서는 다를 수 있습니다. 화면 구현 가능성을 검토한 것으로, 전 성취기준 달성이나 20분 몰입 효과를 검증한 결과는 아닙니다.</p></section>`;}
function val(){const n=root.querySelector('#eml-answer')?.value;return n?.trim()===''?NaN:Number(n);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){state.mode=b.dataset.mode;save();render();return;}if(b.id==='eml-sound'){state.sound=!state.sound;headerUpdate();if(state.sound)beep();save();return;}if(b.dataset.demo){state.active=b.dataset.demo;message('');save();render();return;}const a=b.dataset.action,v=b.dataset.value,s=ds();if(!a)return;
switch(a){
 case'review-unit':state.unit=demos.find(d=>d.id===state.active).unit;[state.grade,state.semester]=state.unit.split('-').map(Number);state.mode='review';break;
 case'unit':state.unit=v;break;
 case'open-demo':case'next-demo':state.active=v;state.mode='play';message('');break;
 case'replay':delete state.states[state.active];message('한 번 더 살펴봐요. 이미 받은 XP는 중복으로 쌓이지 않아요.');break;
 case'bundle':if(s.ones>=10){s.ones-=10;s.tens++;message('낱개 10개가 십 묶음 1개로 바뀌었어요. 전체 개수는 그대로예요.');}break;
 case'unbundle':if(s.tens>0){s.ones+=10;s.tens--;}break;
 case'number-check':if(s.tens!==3||s.ones!==4)return wrong('아직 묶을 수 있는 낱개가 남아 있어요. 10개씩 묶어 보세요.');return finishFirst('발견! 34는 십 묶음 3개와 낱개 4개예요. +20 XP');
 case'number-transfer':return val()===42?finishAll('42! 묶음과 낱개를 새로운 수에도 연결했어요. +20 XP'):wrong('십 묶음 하나는 10개예요. 묶음과 낱개를 함께 세어 보세요.');
 case'ruler-check':if(s.ruler!==3)return wrong('먼저 자의 0을 막대의 왼쪽 끝에 맞춰 보세요.');return val()===7?finishFirst('0에서 7까지, 길이는 7cm예요. +20 XP'):wrong('0에서 오른쪽 끝까지의 눈금을 읽어 보세요.');
 case'ruler-transfer':return val()===6?finishAll('끝 눈금 8에서 시작 눈금 2를 빼면 6cm예요. +20 XP'):wrong('끝의 숫자만 읽으면 안 돼요. 시작에서 끝까지 몇 칸인지 보세요.');
 case'cell':case'cell-pick':{if(a==='cell-pick'){s.pickRow=Number(root.querySelector('#eml-pick-row').value);s.pickCol=Number(root.querySelector('#eml-pick-col').value);}const n=a==='cell-pick'?s.pickRow*8+s.pickCol:Number(v);s.cells=s.cells.includes(n)?s.cells.filter(x=>x!==n):[...s.cells,n];break;}
 case'symmetry-check':return s.cells.length===4&&[14,21,31,37].every(n=>s.cells.includes(n))?finishFirst('대칭축에서 같은 거리의 칸들이 서로 만나요. +20 XP'):wrong('각 칸과 축 사이의 거리를 비교해 보세요. 오른쪽에 4칸이 필요해요.');
 case'symmetry-transfer':return Number(v)===3?finishAll('같은 거리 3칸! 방향이 반대여도 축과의 거리는 같아요. +20 XP'):wrong('축을 기준으로 양쪽 거리는 같아야 해요.');
 case'cut':s.cut=true;message('조각을 잘랐어요. 오른쪽 끝까지 옮겨 빈 곳을 채워 보세요.');break;
 case'area-check':if(s.slide!==100)return wrong('조각을 끝까지 옮겨 직사각형을 먼저 만들어 보세요.');return v==='same'?finishFirst('맞아요. 같은 조각으로 밑변 6cm, 높이 3cm의 직사각형을 만들었어요. +20 XP'):wrong('모양이 달라도 조각을 버리거나 겹치지 않았는지 확인해요.');
 case'area-transfer':return val()===20?finishAll('5 × 4 = 20cm². 기울어진 변 대신 수직인 높이를 사용했어요. +20 XP'):wrong('밑변은 5cm, 수직인 높이는 4cm예요. 직사각형으로 바꾼 모습을 떠올려 보세요.');
 case'cube-predict':s.prediction=v;message(`${v}면을 예상했어요. 접기 손잡이를 움직이고 보는 방향도 바꿔 확인해 보세요.`);break;
 case'rotate':s.yaw+=Number(v);drawCube();save();return;
 case'top-view':s.pitch=s.pitch>.9?.35:1.2;drawCube();save();return;
 case'cube-check':if(s.fold!==100)return wrong('100%까지 접어서 정육면체를 완성해 보세요.');s.fold=0;return finishFirst((s.prediction==='F'?'예측 성공! ':'예측을 고쳐 볼까요? ')+'A의 맞은편은 F예요. 이번에는 다른 면을 살펴봐요. +20 XP');
 case'cube-transfer':return v==='C'?finishAll('B의 맞은편은 C! 펼친 모양에서 접힌 입체를 떠올렸어요. +20 XP'):wrong('B는 바닥 A의 한쪽에 있어요. 반대쪽 벽이 될 면을 찾아보세요.');
 case'machine':s.input=Number(v);if(!s.seen.includes(s.input))s.seen.push(s.input);break;
 case'pattern-check':if(s.seen.length<2)return wrong('입력을 두 개 이상 시험해 보세요. 한 가지 예만으로는 규칙이 여러 개일 수 있어요.');return v==='double'?finishFirst('입력의 2배에 1을 더하는 관계예요. +20 XP'):wrong('관찰한 모든 입력과 출력에 들어맞는지 확인해 보세요.');
 case'pattern-transfer':return Number(v)===11?finishAll('5의 2배에 1을 더하면 11! 새로운 입력에도 규칙이 맞아요. +20 XP'):wrong('입력을 두 배로 만든 다음 1을 더해 보세요.');
 case'pile':{const n=Number(v);if(s.donor===null){if(s.piles[n]>0)s.donor=n;}else if(s.donor===n){s.donor=null;}else{s.piles[s.donor]--;s.piles[n]++;s.donor=null;}break;}
 case'average-check':return s.piles.every(n=>n===5)?finishFirst('15개를 세 상자에 고르게 나누니 5개씩. 평균은 5예요. +20 XP'):wrong('전체 15개를 유지하면서 세 상자의 높이를 같게 만들어 보세요.');
 case'average-transfer':return val()===6?finishAll('합계 18개를 세 곳에 고르게 나누면 평균 6개예요. +20 XP'):wrong('세 상자의 개수를 모두 더한 뒤 상자 수로 나눠 보세요.');
 case'chance-predict':s.prediction=v;message('예측을 정했어요. 뽑은 공을 다시 넣고 여러 번 시험해 보세요.');break;
 case'draw':if(s.draws<200){for(let i=0;i<10;i++){s.draws++;if(Math.random()<.5)s.stars++;}}break;
 case'chance-check':if(s.draws<10)return wrong('먼저 10번 뽑아 결과를 관찰해 보세요.');return v==='no'?finishFirst('별과 달의 가능성은 반반이지만, 열 번의 결과가 꼭 5번씩 나오지는 않아요. +20 XP'):wrong('반반은 가능성을 나타내요. 실제 열 번의 결과를 5번씩 보장하지는 않아요.');
 case'chance-transfer':return Number(v)===1?finishAll('모두 별이니 별이 나오는 일은 확실해요. 가능성은 1이에요. +20 XP'):wrong('상자 안에 다른 종류의 공이 있는지 살펴보세요.');
}save();render();});
root.addEventListener('input',e=>{const key=e.target.dataset.range;if(!key)return;ds()[key]=Number(e.target.value);if(key==='ruler')drawRuler();if(key==='slide'){root.querySelector('#eml-slide-value').textContent=ds().slide+'%';drawArea();}if(key==='fold'){root.querySelector('#eml-fold-value').textContent=ds().fold+'%';drawCube();}});
root.addEventListener('change',e=>{if(e.target.dataset.filter){state[e.target.dataset.filter]=Number(e.target.value);state.unit='';render();save();}else if(e.target.dataset.range)save();});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='eml-answer'){e.preventDefault();e.target.parentElement.querySelector('button')?.click();}});
root.addEventListener('pointerdown',e=>{if(e.target.closest('#eml-cube-svg')){drag={x:e.clientX,y:e.clientY,yaw:ds().yaw,pitch:ds().pitch};root.querySelector('#eml-cube-svg').setPointerCapture?.(e.pointerId);}});
root.addEventListener('pointermove',e=>{if(!drag)return;ds().yaw=drag.yaw+(e.clientX-drag.x)*.01;ds().pitch=Math.max(.15,Math.min(1.45,drag.pitch+(e.clientY-drag.y)*.01));drawCube();});
root.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});root.addEventListener('pointercancel',()=>{drag=null;});
if(window.ResizeObserver)new ResizeObserver(drawDynamic).observe(body);render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'feedback',{label:'정답 타격감'});}
})();
</script>
</div>
