name: Typecheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      # The hosted runner's default ~2 GB heap is too small for this project.
      NODE_OPTIONS: "--max-old-space-size=4096"
      PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
      # Schema generation needs URL values, but never connects to a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/typecheck?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:1/typecheck?schema=public
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Generate types and typecheck
        run: node scripts/ci/typecheck.mjs
      - name: Verify invalid TypeScript fails
        run: node scripts/ci/verify-typecheck.mjs
