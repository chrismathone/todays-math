<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="three-parallels-title"><title id="three-parallels-title">세 평행선 l,m,n 사이 수직길이3와4, 사선길이x와6 및 y와8</title><defs><marker id="three-parallels-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs><rect width="800" height="330" fill="white"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="20" fill="#171717"><line x1="45" y1="65" x2="745" y2="65" stroke="#222" stroke-width="2" /><text x="760" y="72" >l</text><line x1="45" y1="155" x2="745" y2="155" stroke="#222" stroke-width="2" /><text x="760" y="162" >m</text><line x1="45" y1="275" x2="745" y2="275" stroke="#222" stroke-width="2" /><text x="760" y="282" >n</text><line x1="90" y1="40" x2="90" y2="300" stroke="#222" stroke-width="2" /><line x1="110.213" y1="65" x2="345" y2="275" stroke="#222" stroke-width="2" /><line x1="345" y1="275" x2="708.731" y2="65" stroke="#222" stroke-width="2" /><text x="22" y="117" >3 cm</text><text x="22" y="224" >4 cm</text><text x="165" y="100" >x cm</text><text x="205" y="245" >6 cm</text><text x="590" y="92" >y cm</text><text x="472" y="230" >8 cm</text></g></svg>