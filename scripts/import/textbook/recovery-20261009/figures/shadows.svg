<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-labelledby="shadows-title"><title id="shadows-title">수직 기둥과 높이4m 막대의 그림자가 공통 끝점에 도달하며 밑점간15m,막대그림자10m</title><defs><marker id="shadows-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs><rect width="660" height="420" fill="white"/><g font-family="Arial, Malgun Gothic, sans-serif" font-size="20" fill="#171717"><line x1="40" y1="310" x2="610" y2="310" stroke="#222" stroke-width="2" /><line x1="80" y1="310" x2="80" y2="110" stroke="#222" stroke-width="2" /><line x1="380" y1="310" x2="380" y2="230" stroke="#222" stroke-width="2" /><line x1="80" y1="110" x2="580" y2="310" stroke="#222" stroke-width="2" /><polyline points="80,294 96,294 96,310" fill="none" stroke="#222" stroke-width="1.2"/><polyline points="380,294 396,294 396,310" fill="none" stroke="#222" stroke-width="1.2"/><text x="27" y="100" >기둥</text><text x="359" y="219" >막대</text><text x="393" y="273" >4 m</text><text x="534" y="289" font-size="17">그림자 끝</text><line x1="80" y1="350" x2="380" y2="350" stroke="#222" stroke-width="2" /><line x1="80" y1="343" x2="80" y2="357" stroke="#222" stroke-width="2" /><line x1="380" y1="343" x2="380" y2="357" stroke="#222" stroke-width="2" /><text x="230" y="380" text-anchor="middle">15 m</text><line x1="380" y1="350" x2="580" y2="350" stroke="#222" stroke-width="2" /><line x1="380" y1="343" x2="380" y2="357" stroke="#222" stroke-width="2" /><line x1="580" y1="343" x2="580" y2="357" stroke="#222" stroke-width="2" /><text x="480" y="380" text-anchor="middle">10 m</text></g></svg>