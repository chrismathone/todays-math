<!doctype html><html lang="ko"><meta charset="utf-8"><title>연산대장 도형 전수 검토 · 2026-11-12</title>
<style>body{font:14px system-ui;margin:20px;color:#172b4d}header{position:sticky;top:0;background:white;padding:12px;border-bottom:1px solid #ccd;z-index:1}input,select,button{padding:8px;margin:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}article{border:1px solid #ccd;padding:12px;break-inside:avoid}h2{font-size:14px;overflow-wrap:anywhere}img{display:block;max-width:100%;width:280px;height:280px;object-fit:contain}small{overflow-wrap:anywhere}p{white-space:pre-wrap}details{font-size:12px}.warn{color:#b42318}.badge{background:#edf4fa;padding:4px}#error{color:#b42318}@media print{header{position:static}main{grid-template-columns:1fr 1fr}}</style>
<header><h1>연산대장 · 실제 최종 도형과 동결 원본 전수 목록</h1><p id="summary">불러오는 중</p><p>교사용 감사 자료입니다. 접기 안의 정답은 감사용이며 학생 도형에 추가되지 않습니다. SVG만 보는 접촉판과 달리 여기에는 실제로 남는 조건 문장을 함께 표시합니다.</p><p><a href="README.md">판정·한계·재현 방법</a> · <a href="production.html">실제 카탈로그·A4 컴포넌트</a> · <a href="production.pdf">실제 출력 PDF</a></p><input id="search" placeholder="유형·ID·발문 검색"><select id="family"><option value="">모든 유형</option></select><select id="scope"><option value="all">모든 후보</option><option value="display">실제 표시</option><option value="hidden">숨김·그림 없음</option><option value="flagged">예외·후보·동결 부채</option><option value="visual">개별 육안 검토</option><option value="unreviewed">개별 육안 미검토</option></select><select id="view"><option value="display">최종 표시 SVG</option><option value="canonical">동결 원본 SVG</option></select><button id="prev">이전 24개</button><button id="next">다음 24개</button><span id="count"></span><p id="error"></p></header><main></main>
<script>
let data,review,filtered=[],offset=0;const $=s=>document.querySelector(s);const text=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};
async function readGzip(file){const r=await fetch(file);if(!r.ok)throw Error(file+': '+r.status);return JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text())}
async function start(){[data,review]=await Promise.all([readGzip('manifest.json.gz'),readGzip('review-index.json.gz')]);$('#summary').textContent=`${data.summary.definitions}개 등록 유형 · ${data.summary.finiteFigureDomain.toLocaleString()}개 유한 후보 · ${data.summary.registeredAssets.toLocaleString()}개 불변 ID · ${data.summary.displayed.toLocaleString()}개 실제 표시 · 개별 육안 ${Object.keys(review.visuallyReviewed).length.toLocaleString()}개 ID (전체 육안 통과 선언 아님)`;for(const d of data.families.filter(d=>d.enumerated))$('#family').append(new Option(`${d.grade} · ${d.title} (${d.domainSize})`,d.id));const q=new URLSearchParams(location.search);$('#search').value=q.get('id')||'';render()}
function render(){const term=$('#search').value.toLowerCase(),family=$('#family').value,scope=$('#scope').value,mode=$('#view').value;filtered=data.rows.filter(r=>(!family||r.family===family)&&(!term||JSON.stringify(r).toLowerCase().includes(term))&&(scope==='all'||(scope==='display'?!!r.display:scope==='hidden'?!r.display:scope==='flagged'?!!review.flags[r.id]:scope==='visual'?!!review.visuallyReviewed[r.id]:!review.visuallyReviewed[r.id])));offset=Math.min(offset,Math.max(0,filtered.length-1));$('main').replaceChildren();for(const r of filtered.slice(offset,offset+24)){const a=document.createElement('article');a.id=r.id;const link=document.createElement('a');link.href='?id='+encodeURIComponent(r.id);link.append(text('h2',r.id));a.append(link);const hash=r[mode];if(hash){const img=document.createElement('img');img.src='/asset/'+hash;img.alt=r.prompt.text;img.onerror=()=>{$('#error').textContent='SVG 캐시가 없습니다. README의 census 명령을 실행한 뒤 serve.py로 열어 주세요.'};a.append(img)}else a.append(text('p',mode==='display'?'실제 정책: 그림 숨김 또는 그림 없는 후보':'동결 원본 ID 없는 인라인 후보'));a.append(text('small',`유형 ${r.family} · ${r.renderer} · domain index ${r.index}`));a.append(text('p',r.lines.join('\n')));const seen=review.visuallyReviewed[r.id];a.append(text('p',seen?`육안 검토: ${seen.image}`:'개별 육안 미검토 · 전수 자동 검사만 수행'));if(seen){const l=document.createElement('a');l.href=seen.image;l.textContent='해당 접촉판 열기';a.append(l)}for(const f of review.flags[r.id]||[]){const p=text('p',`${f.severity}: ${f.reason}${f.conditions?'\n'+f.conditions.join('\n'):''}`);p.className='warn';a.append(p)}const d=document.createElement('details');d.append(text('summary','원 발문·정답·해시 보기'));d.append(text('p',`${r.prompt.text}\n${r.prompt.instruction??''}\n정답(교사용 검토): ${r.answer.text}\ncanonical: ${r.canonical??'없음'}\ndisplay: ${r.display??'없음'}\n검산: ${r.verified}`));a.append(d);$('main').append(a)}$('#count').textContent=`${filtered.length?offset+1:0}–${Math.min(offset+24,filtered.length)} / ${filtered.length}`}
for(const s of ['#search','#family','#scope','#view'])$(s).oninput=()=>{offset=0;render()};$('#prev').onclick=()=>{offset=Math.max(0,offset-24);render()};$('#next').onclick=()=>{offset=Math.min(Math.max(0,filtered.length-1),offset+24);render()};start().catch(e=>$('#error').textContent=String(e));
</script></html>
