    '<div class="actions"><div class="tAccount"><span class="avatar" aria-hidden="true">강</span><span><strong>강선생</strong><small>내 수업 공간</small></span><button type="button" class="secondaryButton">로그아웃</button></div></div></header>' +
    '<div role="tablist" aria-label="수업 관리 메뉴" class="tabs">' + tabs + "</div>" +
    '<section role="tabpanel">' + panel + "</section></div></div></div></div>";
}

// ── 화면의 조각
const nameBtn = (s, expanded) => '<button type="button" class="studentButton x-name" data-act="toggle" data-student="' + s.n + '"' + (expanded === undefined ? "" : ' aria-expanded="' + expanded + '"') +
  '><span class="studentIdentity"><strong>' + s.n + '</strong><span class="subline">' + C[s.c].name + "</span></span></button>";
const tagOf = (f, withVal) => '<span class="status"' + (R[f.k].st ? ' data-status="' + R[f.k].st + '"' : "") + ">" + (withVal ? R[f.k].also(f) : R[f.k].tag) + "</span>";
const actBtn = (s, v, isOpen) => v.open === "inline"
  ? '<button type="button" class="rowButton" data-act="toggle" data-student="' + s.n + '" aria-expanded="' + isOpen + '">' + (isOpen ? "접기" : "펼치기") + icon(isOpen ? "up" : "down", 16) + "</button>"
  : '<button type="button" class="rowButton" data-act="toggle" data-student="' + s.n + '" aria-expanded="' + isOpen + '"><span class="x-wide">기록 보기' + icon("chevron", 15) + '</span><span class="x-narrow">' +
    (isOpen ? "접기" : "펼치기") + icon(isOpen ? "up" : "down", 16) + "</span></button>";

function lineOf(s, v, isOpen) {
  const fl = flagsOf(s), first = fl[0], rest = fl.slice(1), r = R[first.k];
  const also = rest.map((f) => R[f.k].also(f)).join(" · ");
  if (v.dens === 3) // 세 줄 — 이름 줄 · 문장 줄 · 곁 줄
    return '<div class="x-line stack">' + nameBtn(s, isOpen) + actBtn(s, v, isOpen) + '<p class="x-say"><b>' + r.lead(first) + "</b> " + r.rest(first) + "</p>" +
      '<p class="x-side">' + r.side(first) + (also ? " · 그 밖 " + also : "") + "</p></div>";
  if (v.shape === "say") {
    const text = v.grain === "heads" ? r.bare(first) : "<b>" + r.lead(first) + "</b> " + r.rest(first);
    return '<div class="x-line say">' + nameBtn(s, isOpen) + '<p class="x-say">' + text + (also ? ' <span class="x-also">' + also + "</span>" : "") + "</p>" + actBtn(s, v, isOpen) + "</div>";
  }
  if (v.grain === "heads") // 칸 + 사유 머리 — 값 | 곁 | 그 밖 딱지
    return '<div class="x-line colsH">' + nameBtn(s, isOpen) + '<span class="x-vc"><span class="x-val">' + r.val(first) + '</span> <span class="x-ctx">' + r.ctx(first) + "</span></span>" +
      '<span class="x-tags">' + rest.map((f) => tagOf(f, true)).join("") + "</span>" + actBtn(s, v, isOpen) + "</div>";
  return '<div class="x-line cols">' + nameBtn(s, isOpen) + '<div class="x-reasons">' +
    fl.map((f) => '<div class="x-rsn">' + tagOf(f) + ' <span class="x-val">' + R[f.k].val(f) + '</span> <span class="x-ctx">' + R[f.k].ctx(f) + "</span></div>").join("") + "</div>" + actBtn(s, v, isOpen) + "</div>";
}

// 펼친 자리 — 숫자 한 줄 · 사유 · 밀린/막힌 카드만 · 최근 세션
function openBody(s, v, forPanel) {
  const fl = flagsOf(s);
  const cards = [...s.cards].sort((a, b) => b[6] - a[6]);
  const stuck = cards.filter((c) => c[5] === "막힘").length;
  const nums = '<p class="x-nums"><span>모은 카드</span> <b>' + s.col + '</b> / 230 <span>· 밀린 카드</span> <b>' + (s.ov[0] ? s.ov[0] + "장" : "없음") + "</b>" +
    (s.ov[0] ? " <span>· 가장 오래</span> <b>" + s.ov[1] + "일</b>" : "") + ' <span>· 막힌 카드</span> <b>' + (stuck ? stuck + "장" : "없음") + "</b></p>";
  const flags = '<div class="x-flags">' + fl.map((f) => "<p><b>" + R[f.k].name + "</b> — " + R[f.k].full(f) + "</p>").join("") + "</div>";
  let list;
  if (!cards.length) list = '<p class="muted">밀린 카드 · 막힌 카드 없음</p>';
  else if (v.cards === "units") {
    const units = [...new Set(cards.map((c) => c[1]))];
    list = '<dl class="x-units">' + units.map((u) => { const cs = cards.filter((c) => c[1] === u);
      return "<dt>" + u + "<small>" + cs.length + "장</small></dt><dd>" + cs.map((c) => "<span>" + c[0] + " " + (c[5] === "막힘" ? '<b class="due">막힘</b>' : "<b>" + c[6] + "일</b>") + "</span>").join("") + "</dd>"; }).join("") + "</dl>";
  } else if (forPanel)
    list = '<div class="tableScroll"><table class="reportTable tight"><thead><tr><th>카드 · 단원</th><th>밀린 날</th><th>마지막 복습</th><th>복습 예정일</th></tr></thead><tbody>' +
      cards.map((c) => '<tr><th scope="row">' + c[0] + '<span class="subline">' + c[1] + "</span></th><td>" + (c[6] ? c[6] + "일" : "—") + "</td><td>" + (c[5] === "막힘" ? '<span class="due">막힘</span>' : c[5]) + "</td><td>" + md(c[4]) + "</td></tr>").join("") + "</tbody></table></div>";
  else
    list = '<div class="tableScroll"><table class="reportTable"><thead><tr><th>카드</th><th>단원</th><th>밀린 날</th><th>마지막 복습</th><th>복습 예정일</th><th>복습 간격</th></tr></thead><tbody>' +
      cards.map((c) => '<tr><th scope="row">' + c[0] + "</th><td>" + c[1] + "</td><td>" + (c[6] ? c[6] + "일" : "—") + "</td><td>" + (c[5] === "막힘" ? '<span class="due">막힘</span>' : c[5]) + "</td><td>" + md(c[4]) + "</td><td>" + c[3] + "일</td></tr>").join("") + "</tbody></table></div>";
  const sess = '<div class="x-sess">' + s.sess.map((x) => "<p>" + md(x[0]) + " " + x[1] + ' <span class="muted">· 첫 시도 15개 중 ' + x[2] + "개 맞힘 · 미해결 " + (x[3] ? x[3] + "개" : "없음") + "</span></p>").join("") + "</div>";
  const n = cards.length;
  return '<div class="' + (forPanel ? "detailBody " : "") + "x-open" + (!forPanel && v.open === "panel" ? " forNarrow" : "") + '">' + nums + flags +
    '<div><p class="x-sub">밀린 · 막힌 카드' + (n ? " " + n + "장" : "") + "<small>오래 밀린 차례</small></p>" + list + "</div>" +
    '<div><p class="x-sub">최근 세션<small>' + s.sess.length + "건</small></p>" + sess + "</div>" +
    (forPanel ? "" : '<p class="x-note">문항 글과 학생이 고른 답은 싣지 않습니다.</p>') + "</div>";
}

const CRIT = "<b>기준 v1.1 · 잠정</b> — 미해결 1개 이상 · 복습 막힘 2장 이상 · 복습 밀림 3일 3장 또는 7일 1장 · 날 넘김 2일 · 쉼 7일. 2주 써 본 뒤 다시 잽니다.";
const SLOT = '<span class="x-stage">2단계</span><span><b>상한에 닿아 선생님과 확인</b> · 자료 없음 — 상한이 들어온 뒤 이 자리에 섭니다.</span>';

function screen(key, st) {
  const v = V[key];
  const learners = st.empty ? [] : S.filter((s) => s.fl.length).sort((a, b) => { const x = flagsOf(a)[0], y = flagsOf(b)[0]; return R[x.k].o - R[y.k].o || R[y.k].key(y) - R[x.k].key(x); });
  const ops = S.filter((s) => s.op).sort((a, b) => OP[a.op.k].o - OP[b.op.k].o);
  const quiet = S.filter((s) => !s.op && (st.empty || !s.fl.length));
  const sel = st.open ? learners.find((s) => s.n === st.open) : null;
  const nL = learners.length, nO = ops.length, nQ = quiet.length;

  const refresh = '<button type="button" class="button">새로고침</button>';
  const scope = "담당 반 3 · 학생 29명 · 2026-10-01(목) 한국 시간 기준 · 개념 카드(탐험) 기록에서 읽습니다.";
  const head = v.sum === "line"
    ? '<div class="sectionHeading"><div><h2>도움이 필요한 학생</h2><p>학습 개입 <b>' + nL + "명</b> · 운영 확인 <b>" + nO + "명</b> · 기준 아래 <b>" + nQ + "명</b> — 담당 반 3 · 29명 · 10/1(목) 기준</p></div>" + refresh + "</div>"
    : '<div class="sectionHeading"><div><h2>도움이 필요한 학생</h2><p>' + scope + "</p></div>" + refresh + "</div>";
  const totals = v.sum === "cells" ? '<dl class="totals" aria-label="담당 반 요약"><div><dt>학생</dt><dd>29<small>명</small></dd></div><div><dt>학습 개입</dt><dd>' + nL +
    "<small>명</small></dd></div><div><dt>운영 확인</dt><dd>" + nO + "<small>명</small></dd></div><div><dt>기준 아래</dt><dd>" + nQ + "<small>명</small></dd></div></dl>" : "";
  const controls = '<div class="x-controls' + (v.sum === "cells" ? " controls boxed" : "") + '"><div class="filters" role="group" aria-label="학교급">' +
    '<button type="button" aria-pressed="true">전체 <span>29</span></button><button type="button" aria-pressed="false">초등 <span>9</span></button><button type="button" aria-pressed="false">중등 <span>20</span></button></div>' +
    '<label><span class="srOnly">범위</span><select aria-label="범위"><option>담당 반 전체 (3)</option><option>중1 심화 A(월수금)</option><option>초5 B</option><option>중2 C</option></select></label></div>';

  // 학습 개입
  let rows = "";
  if (!nL) rows = "";
  else if (v.grain === "heads") rows = LEARN.map((k) => { const g = learners.filter((s) => flagsOf(s)[0].k === k); // 0명인 사유는 숨긴다
    return g.length ? '<div class="x-ghead"><b>' + R[k].name + "</b><span>" + g.length + "명</span></div>" + g.map(rowOf).join("") : ""; }).join("");
  else rows = learners.map(rowOf).join("");
  function rowOf(s) { const isOpen = !!sel && sel === s;
    return '<div class="x-row" data-row="' + s.n + '" data-open="' + isOpen + '">' + lineOf(s, v, isOpen) + (isOpen ? openBody(s, v, false) : "") + "</div>"; }
  const colhead = v.shape === "cols" && v.grain === "flat" && nL ? '<div class="x-colhead"><span>학생 / 반</span><div class="x-reasons"><span>사유</span><span>값</span><span>단원 · 카드</span></div><span></span></div>' : "";
  const learnSec = '<section class="x-sec" data-sec="learn"><div class="x-sechead"><h3>학습 개입 ' + nL + "명</h3>" +
    (v.crit === "below" ? '<span class="x-stage">잠정 기준 v1.1</span>' : "") + "<p>" + (nL ? "사유의 차례대로 · 학생은 한 번씩" : "") + "</p></div>" +
    (v.crit === "above" ? '<p class="x-crit above">' + CRIT + "</p>" : "") +
    (nL ? '<div class="x-list"><div class="x-slot">' + SLOT + "</div>" + colhead + rows + (v.crit === "below" ? '<p class="x-crit below">' + CRIT + "</p>" : "") + "</div>"
      : '<div class="empty"><h3>학습 개입이 필요한 학생이 없습니다</h3><p>잠정 기준 v1.1 에 걸린 학생이 없습니다. 기준 아래 ' + nQ + "명의 이름은 아래에서 펼칩니다.</p></div>") + "</section>";

  // 운영 확인 — 계정 없는 학생의 기록 사유는 딱지로 같이
  const opRows = ops.map((s) => { const o = OP[s.op.k], rec = (s.rec || []).map((f) => tagOf(f, true)).join("");
    const act = s.op.k === "noAccount" ? '<a class="accountLink x-act" href="#">반 관리에서 계정 확인 →</a>' : '<span class="x-act"></span>';
    // 이름은 단추가 아니다 — 운영 확인 줄에서 할 일은 계정 확인 링크 하나다(D-30)
    const name = '<span class="x-staticName"><span class="studentIdentity"><strong>' + s.n + '</strong><span class="subline">' + C[s.c].name + "</span></span></span>";
    if (v.dens === 3) return '<div class="x-row"><div class="x-line stack">' + name + act + '<p class="x-say"><b>' + o.name + ".</b> " + o.rest(s.op) + "</p>" + (rec ? '<p class="x-side x-tags">' + rec + "</p>" : "") + "</div></div>";
    if (v.shape === "say") return '<div class="x-row"><div class="x-line say">' + name + '<p class="x-say"><b>' + o.name + ".</b> " + o.rest(s.op) + (rec ? ' <span class="x-tags" style="display:inline-flex;vertical-align:middle">' + rec + "</span>" : "") + "</p>" + act + "</div></div>";
    // 칸 — 학습 개입 줄과 같은 x-rsn 묶음(넓으면 칸마다, 좁으면 딱지 · 값 · 자리가 한 줄로 흐른다)
    return '<div class="x-row"><div class="x-line cols">' + name + '<div class="x-reasons"><div class="x-rsn"><span class="status" data-status="paused">' + o.name + '</span> <span class="x-val">' + o.val(s.op) + '</span> <span class="x-ctx">' +
      (o.ctx(s.op) || '<span class="x-tags" style="display:inline-flex;vertical-align:middle">' + rec + "</span>") + "</span></div></div>" + act + "</div></div>"; }).join("");
  const opSec = '<section class="x-sec" data-sec="ops"><div class="x-sechead"><h3>운영 확인 ' + nO + "명</h3><p>계정 · 시작 여부 — 학습 개입과 따로 셉니다</p></div><div class=\"x-list\">" + opRows + "</div></section>";

  // 기준 아래 — 접어 둔다
  const byClass = Object.keys(C).map((c) => { const g = quiet.filter((s) => s.c === c); return g.length ? "<p><b>" + C[c].name + "</b> " + g.length + "명 — " + g.map((s) => s.n).join(" · ") + "</p>" : ""; }).join("");
  const quietSec = '<section class="x-sec" data-sec="quiet"><div class="x-sechead"><h3>기준 아래 ' + nQ + "명</h3><p>기준에 걸리지 않은 학생 — 살필 일이 없다는 뜻은 아닙니다</p>" +
    '<button type="button" class="rowButton" data-act="quiet" aria-expanded="' + !!st.quiet + '">' + (st.quiet ? "이름 접기" : "이름 펼치기") + icon(st.quiet ? "up" : "down", 16) + "</button></div>" +
    (st.quiet ? '<div class="x-list"><div class="x-quiet">' + byClass + "</div></div>" : "") + "</section>";

  const detail = sel && v.open === "panel" ? '<aside class="detail" aria-label="' + sel.n + ' 개념 카드 기록"><header class="detailHeader"><div><h2>' + sel.n + '</h2><p class="muted">' + C[sel.c].name +
    ' · 학생 계정 있음</p></div><button type="button" class="button" data-act="close">닫기</button></header><p class="detailHint">문항 글과 학생이 고른 답은 싣지 않습니다.</p>' + openBody(sel, v, true) + "</aside>" : "";
  return head + '<div class="dashboard">' + totals + controls + '<div class="x-work" data-detail="' + !!detail + '"><div>' + learnSec + opSec + quietSec + "</div>" + detail + "</div></div>";
}

// ── 기존 화면에서 들어오는 한 줄 — 셋째 탭 · 반 카드 · 반 현황 머리
function entryPanel() {
  const names = S.filter((s) => s.c === "m1a").slice(0, 7).map((s) => "<li>" + s.n + "</li>").join("");
  return '<div class="sectionHeading"><div><h2>우리 반 관리</h2><p>반을 선택하면 학생 명단과 수업 진도를 함께 확인할 수 있습니다.</p></div></div>' +
    '<div class="cmGrid"><div style="display:grid;gap:24px;min-width:0"><section class="cmPanel"><table><thead><tr><th>반</th><th style="width:30%">학년</th></tr></thead><tbody>' +
    '<tr><td><button type="button" aria-current="true">중1 심화 A(월수금)</button></td><td>중1</td></tr><tr><td><button type="button">초5 B</button></td><td>초5</td></tr><tr><td><button type="button">중2 C</button></td><td>중2</td></tr></tbody></table></section>' +
    '<div><p class="x-cap">반 현황 화면의 머리 — 중등 «반 수학 복습» · 초등 «SRS 현황»에도 같은 한 줄. 목록은 여기서 되풀이하지 않는다.</p>' +
    '<div class="srsHead"><p class="eyebrow">CLASS PRACTICE</p><h1>중1 심화 A(월수금) · 수학 복습</h1><p class="m">등록된 학생들의 실제 풀이 기록과 현재 진도를 확인합니다.</p>' +
    '<p style="margin-top:10px"><span class="x-new" style="display:inline-block"><a class="cmLink" href="#">이 반에서 도움이 필요한 학생 4명 →</a> <span style="color:#596c86;font-size:12px;margin-left:8px">운영 확인 2명</span></span></p></div></div></div>' +
    '<section class="cmPanel"><a class="cmLink" href="#">중1 심화 A(월수금) 수학 복습 현황 →</a>' +
    '<p style="margin:6px 0 14px"><span class="x-new" style="display:inline-block"><a class="cmLink" href="#">도움이 필요한 학생 4명 →</a> <span style="color:#596c86;font-size:12px;margin-left:8px">운영 확인 2명</span></span></p>' +
    '<h2>학생</h2><p style="margin-bottom:8px;font-weight:700">중1 심화 A(월수금)</p><ul class="cmStudents">' + names + "</ul></section></div>";
}

// ── 화면 한 장(?view=) — 그림은 이 얼굴을 뜬다
function mountApp(view, stateName) {
  document.body.dataset.mode = "app";
  const st = { open: null, quiet: false, empty: view === "empty" };
  const key = V[view] ? view : "H1";
  const draw = () => {
    const y = window.scrollY;
    document.getElementById("root").innerHTML = view === "entry" ? shell(entryPanel(), "classes", 7) : shell(screen(key, st), "help", st.empty ? 0 : 7);
    window.scrollTo(0, y);
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (e.target.closest("a")) e.preventDefault(); if (!b) return;
    if (b.dataset.act === "toggle") st.open = st.open === b.dataset.student ? null : b.dataset.student;
    if (b.dataset.act === "close") st.open = null;
    if (b.dataset.act === "quiet") st.quiet = !st.quiet;
    draw();
  });
  draw();
  if (stateName === "open") { // 밀린 카드 14장인 학생을 펼치고 그 줄을 윗줄 바로 아래로
    st.open = "이예준"; draw();
    const place = () => { const row = document.querySelector('[data-row="이예준"]'), bar = document.querySelector(".topbar");
      if (row) window.scrollTo(0, row.getBoundingClientRect().top + window.scrollY - bar.getBoundingClientRect().height - 8); };
    place(); if (document.fonts) document.fonts.ready.then(place);
  }
}

// ── 안내 쪽
function mountDoc() {
  document.body.dataset.mode = "doc";
  const here = location.pathname.split("/").pop();
  const src = (v, s) => here + "?view=" + v + (s ? "&state=" + s : "");
  const NOTES = {
    H1: { thesis: "Wire B 를 <b>지금 초등 교사 화면(SRS 현황)의 틀</b>에 그대로 얹었다. 요약 칸 넷 → 거르개 상자 → 목록. 학생마다 한 줄 문장이고, 펼치면 그 줄 아래에 밀린 · 막힌 카드 표가 선다.",
      axes: [["사유의 모양", "(가) 한 줄 문장 — 앞 문장(굵게)이 사유와 핵심 수, 뒤가 언제 · 어디. 둘째 사유는 아래 작은 줄 «그 밖»"], ["위쪽 요약", "요약 칸 넷(학생 · 학습 개입 · 운영 확인 · 기준 아래)"], ["목록의 결", "차례대로 이어진 한 목록"], ["펼침", "줄 안 — 카드 표 6열(지금 상세 표와 같은 표)"], ["밀도", "두 줄(이름 · 반 | 문장 · 그 밖)"], ["기준", "목록 위 한 줄"]],
      good: "지금 교사 화면과 읽는 법이 같다. 문장이 사유를 직접 말해 딱지를 풀어 읽을 일이 없다.", bad: "요약 칸 넷과 기준 줄이 위를 먹어 1280 첫 화면에 다섯 명. 폰에서는 요약 칸이 2 × 2 로 서서 첫 화면에 이름이 하나도 없다. 14장 표가 길어 펼치면 다음 학생이 화면 밖으로 간다." },
    H2: { thesis: "grok 의 반대안을 가장 자연스러운 자리에 — <b>지금 초등 표의 결</b>. 줄마다 딱지 · 값 · 단원(카드) 세 칸이 서고, 사유가 둘이면 두 줄이 같은 칸에 맞춰 선다. 기록은 오른쪽 칸에서 연다.",
      axes: [["사유의 모양", "(나) 딱지 + 값 + 단원 · 카드를 칸으로 — 딱지 색은 지금 상태 딱지의 셋(임무 기록 · 복습 기록 · 쉼)"], ["위쪽 요약", "요약 칸 넷"], ["목록의 결", "이어진 한 목록 · 표 머리"], ["펼침", "PC 는 오른쪽 칸(목록이 남는다) · 폰은 줄 안"], ["밀도", "두 줄(사유가 둘이면 두 줄)"], ["기준", "목록 위 한 줄"]],
      good: "값이 세로로 줄을 서서 견주기 쉽다. 문장 틀 없이 자료의 칸을 그대로 보인다. PC 에서는 펼쳐도 다음 학생이 그대로 보인다.", bad: "딱지를 읽는 법을 배워야 한다. 표 머리까지 더해 1280 첫 화면에 네 명으로 가장 적다 · 폰은 H1 과 같이 첫 화면에 이름이 없다. 오른쪽 칸이 서면 목록이 좁아져 칸이 풀린다(1280 창). 폰에서는 세 칸이 꺾인다." },
    H3: { thesis: "폰에서 이름이 먼저 보이게. 요약은 <b>구역 머리의 한 줄</b>로 올리고, 가장 앞선 사유가 바뀌는 자리에 <b>얇은 머리</b>를 둔다. 머리가 사유를 말하므로 줄의 문장은 값과 자리만 남아 짧다.",
      axes: [["사유의 모양", "(가) 문장 — 머리 아래에서는 «언제 · 어디에서 · 얼마나»만"], ["위쪽 요약", "한 줄 요약(구역 머리 아래 한 줄)"], ["목록의 결", "사유가 바뀌는 자리에 얇은 머리 · 학생은 한 번씩 · 0명인 사유는 숨김"], ["펼침", "줄 안 — 카드를 단원별 한 줄로 묶는다(14장이 세 줄)"], ["밀도", "두 줄"], ["기준", "딱지 «잠정 기준 v1.1» + 목록 발치에 풀어 씀"]],
      good: "1280 첫 화면에 여섯 명이 다 선다(일곱째는 접힌 아래). 문장이 짧아 폰에서 덜 꺾인다. 1280 에서는 14장을 펼쳐도 다음 학생이 남는다(390 에서는 안 남는다).", bad: "머리가 다섯까지 늘면 줄이 그만큼 는다. 단원별 묶음은 복습 예정일 · 간격을 버린다(밀린 날과 막힘만)." },
    H4: { thesis: "H3 의 머리에 <b>칸</b>을 얹었다. 머리가 사유를 말하니 줄은 값 · 단원(카드) · 그 밖 딱지 셋이다. 기록은 오른쪽 칸.",
      axes: [["사유의 모양", "(나) 값 + 단원 · 카드를 칸으로 — 사유는 머리가, 둘째 사유만 딱지"], ["위쪽 요약", "한 줄 요약"], ["목록의 결", "얇은 머리"], ["펼침", "PC 오른쪽 칸 · 폰 줄 안 — 단원별 묶음"], ["밀도", "두 줄"], ["기준", "딱지 + 목록 발치"]],
      good: "가장 촘촘하다 — 딱지가 둘째 사유에만 쓰여 색이 적다. 값이 한 칸에 선다.", bad: "값의 단위가 머리마다 달라(개 · 장 · 일째) 머리를 놓치면 값이 뜻을 잃는다. 폰에서 값과 단원이 따로 꺾인다." },
    H5: { thesis: "줄을 <b>세 줄 블록</b>으로 — 이름 줄 · 문장 줄 · 곁 줄(남은 카드 · 첫 시도 · 둘째 사유). 펼치지 않아도 곁 정보가 보인다. 기록은 오른쪽 칸.",
      axes: [["사유의 모양", "(가) 문장 + 곁 줄"], ["위쪽 요약", "한 줄 요약"], ["목록의 결", "이어진 한 목록"], ["펼침", "PC 오른쪽 칸 · 폰 줄 안 — 카드 표 4열"], ["밀도", "세 줄"], ["기준", "딱지 + 목록 발치"]],
      good: "폰과 PC 의 모양이 같다(쌓인 블록). 오른쪽 칸이 서도 줄이 무너지지 않는다. 펼칠 일이 가장 적다.", bad: "블록이 가장 높다(105px). 폰에서 카드 이름이 긴 줄은 문장이 꺾여 네 줄이 된다(류하은 126px). codex 가 «곁 정보는 펼침으로»라고 한 것과 반대다." },
  };
  const tabs = ["H1", "H2", "H3", "H4", "H5", "공통"];
  const fig = (cap, v, s, w, h) => '<figure><figcaption>' + cap + ' · <a href="' + src(v, s) + '" target="_blank">새 창</a></figcaption>' +
    (w === 1280 ? '<div class="scale" data-w="1280" data-h="900"><iframe loading="lazy" width="1280" height="900" src="' + src(v, s) + '" title="' + v + " " + cap + '"></iframe></div>'
      : '<iframe loading="lazy" src="' + src(v, s) + '" title="' + v + " " + cap + '"></iframe>') + "</figure>";
  const panels = Object.keys(V).map((k) => { const n = NOTES[k];
    return '<section data-panel="' + k + '" hidden><h2>' + V[k].title + '</h2><p class="thesis">' + n.thesis + '</p><dl class="axes">' + n.axes.map(([a, b]) => "<dt>" + a + "</dt><dd>" + b + "</dd>").join("") + "</dl>" +
      '<ul class="list"><li><b>좋은 점</b> — ' + n.good + "</li><li><b>걸리는 점</b> — " + n.bad + "</li></ul>" +
      '<div class="frames">' + fig("1280 × 900 첫 화면", k, "", 1280) + fig("1280 × 900 · 밀린 카드 14장인 이예준을 연 상태", k, "open", 1280) +
      '<div class="phones">' + fig("390 × 844 첫 화면", k, "", 390) + fig("390 × 844 · 이예준을 연 상태", k, "open", 390) + "</div></div></section>"; }).join("") +
    '<section data-panel="공통" hidden><h2>공통 — 학습 개입 0명 · 기존 화면에서 들어오는 한 줄</h2><p class="thesis">빈 상태는 H1 의 틀에 그렸다(문구만 본다). 들어오는 줄은 셋 — 수업 관리의 셋째 탭 · 반 카드의 글 링크 · 반 현황의 머리. 점선 «새 줄»은 시안 표지다.</p>' +
    '<div class="frames">' + fig("학습 개입 0명 · 1280 × 900", "empty", "", 1280) + fig("기존 화면에서 들어오는 한 줄 · 1280 × 900", "entry", "", 1280) + "</div></section>";
  document.getElementById("root").innerHTML = '<main class="doc"><h1>«도움이 필요한 학생» 교사 화면 — Hi-fi 다섯 안</h1>' +
    '<p class="lede">Wire 는 3자 합의로 골랐다(새 화면 · 사유 목록이 주인 · 학생은 한 번씩 · 펼치면 밀린 · 막힌 카드만). 이 시안은 그 뼈대를 <b>제품의 실제 토큰과 지금 교사 화면의 CSS 값</b>으로 그린 다섯 안이다. ' +
    "고르는 것은 3자 눈검수 — 그림은 <code>hifi-explorers-teacher-shots/</code> 에 화면 한 장씩 있다. 아래 액자는 같은 화면을 그대로 띄운 것이라 단추가 눌린다.</p>" +
    '<ul class="facts"><li>표본 <b>담당 반 3 · 29명</b> · 학습 개입 7 · 운영 확인 3 · 기준 아래 19</li><li>오늘 = <b>2026-10-01(목)</b></li><li>이름은 전부 지어낸 것 · 단원 · 카드 이름은 제품 카탈로그 그대로</li><li>문항 글 · 학생 답 · 종합 점수 · 순위 없음</li></ul>' +
    '<h2>안을 가르는 축</h2><div class="tw"><table class="t"><thead><tr><th>안</th><th>① 사유의 모양</th><th>② 위쪽 요약</th><th>③ 목록의 결</th><th>④ 펼침</th><th>⑤ 밀도</th><th>펼친 카드</th><th>기준 v1.1 · 잠정</th></tr></thead><tbody>' +
    "<tr><th>H1</th><td>문장</td><td>요약 칸 넷</td><td>이어진 목록</td><td>줄 안</td><td>두 줄</td><td>표 6열</td><td>목록 위 한 줄</td></tr>" +
    "<tr><th>H2</th><td>칸(딱지 · 값 · 단원)</td><td>요약 칸 넷</td><td>이어진 목록</td><td>오른쪽 칸(폰은 줄 안)</td><td>두 줄</td><td>표 4열</td><td>목록 위 한 줄</td></tr>" +
    "<tr><th>H3</th><td>문장(머리 아래 짧게)</td><td>한 줄 요약</td><td>사유 머리</td><td>줄 안</td><td>두 줄</td><td>단원별 묶음</td><td>딱지 + 목록 발치</td></tr>" +
    "<tr><th>H4</th><td>칸(값 · 단원 · 그 밖 딱지)</td><td>한 줄 요약</td><td>사유 머리</td><td>오른쪽 칸(폰은 줄 안)</td><td>두 줄</td><td>단원별 묶음</td><td>딱지 + 목록 발치</td></tr>" +
    "<tr><th>H5</th><td>문장 + 곁 줄</td><td>한 줄 요약</td><td>이어진 목록</td><td>오른쪽 칸(폰은 줄 안)</td><td>세 줄</td><td>표 4열</td><td>딱지 + 목록 발치</td></tr></tbody></table></div>" +
    '<ul class="list"><li>어느 두 안도 <b>축 둘 이상</b>이 다르다. 색은 다섯 안이 같다(제품 토큰).</li><li>모든 안에 같이 있는 것 — 차례 0 «상한에 닿아 선생님과 확인» 2단계 빈 자리 · 0명인 사유 숨김 · 운영 확인은 따로 · 계정 없는 학생의 기록 사유는 딱지 · «기준 아래»는 접어 둠 · 갈래 거르개 없음(학교급과 반) · «봤음» 닫기 없음.</li>' +
    "<li>누르는 자리는 이름 · 펼치기(기록 보기) 단추 · 거르개 · 탭 · 링크뿐이다(D-30). 줄 · 딱지는 눌리지 않는다.</li></ul>" +
    '<nav role="tablist">' + tabs.map((t, i) => '<button type="button" role="tab" aria-selected="' + (i === 0) + '" data-tab="' + t + '">' + (V[t] ? t + " · " + V[t].short : t) + "</button>").join("") + "</nav>" + panels + "</main>";
  const show = (t) => { document.querySelectorAll("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== t; });
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t))); fit(); };
  const fit = () => document.querySelectorAll(".scale").forEach((box) => { const w = box.clientWidth; if (!w) return; const k = Math.min(1, w / 1280);
    box.firstElementChild.style.transform = "scale(" + k + ")"; box.style.height = 900 * k + "px"; });
  document.querySelector(".doc nav").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) show(b.dataset.tab); });
  window.addEventListener("resize", fit);
  show("H1");
}

const root = document.createElement("div"); root.id = "root"; document.body.appendChild(root);
const q = new URLSearchParams(location.search);
if (q.get("view")) mountApp(q.get("view"), q.get("state")); else mountDoc();
</script>
</body>
