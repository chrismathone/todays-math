    else { feedback = item.errors[index]; if (r.attempts.length >= 2) r.revealed = true; commit(r.revealed ? "이 단계의 풀이를 확인해 보세요." : feedback); }
  }
  function reveal() {
    feedback = "";
    if (session.phase === "guided") session.records[session.step].revealed = true;
    else if (session.phase === "blank") session.number.revealed = true;
    else if (session.phase === "independent") session.independent.revealed = true;
    else return;
    commit("풀이를 열었어요. 설명을 읽고 이해했어요를 누르세요.");
  }
  function finishNumber() {
    const independent = session.phase === "independent";
    session[independent ? "independent" : "number"].done = true;
    session.phase = independent ? "summary" : "independent";
    feedback = ""; inputValue = "";
    commit(independent ? "오늘의 학습 기록을 확인하세요." : "이번에는 보기 없이 새로운 문제를 풀어 보세요.", !independent);
  }
  root.addEventListener("click", function (event) {
    const b = event.target.closest("button");
    if (!b || !root.contains(b) || b.disabled) return;
    if (b.dataset.view) { session.view = b.dataset.view; feedback = ""; commit(session.view === "teacher" ? "선생님 보기로 전환했어요." : "학생 연습으로 돌아왔어요."); return; }
    if (b.hasAttribute("data-choice")) { choose(Number(b.dataset.choice)); return; }
    if (b.dataset.action === "submit-number") submitNumber();
    if (b.dataset.action === "reveal") reveal();
    if (b.dataset.action === "understood") nextStep();
    if (b.dataset.action === "numeric-understood") finishNumber();
    if (b.dataset.action === "restart") { session = fresh(); connected = ""; feedback = ""; inputValue = ""; lastAction = 0; commit("새 체험을 시작합니다."); }
  });
  root.addEventListener("input", function (event) { if (event.target.id === "ms-answer") inputValue = event.target.value; });
  function submitNumber() {
    if (session.view !== "student" || !["blank", "independent"].includes(session.phase)) return;
    if (Date.now() - lastAction < 280) return;
    const value = inputValue.trim().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); });
    if (!/^\d{1,4}$/.test(value)) { feedback = "숫자로 답을 입력해 주세요."; render(); const field = root.querySelector("#ms-answer"); if (field) field.focus({ preventScroll: true }); return; }
    lastAction = Date.now();
    const independent = session.phase === "independent", r = independent ? session.independent : session.number;
    if (r.done || r.revealed) return;
    r.attempts.push(value);
    if (Number(value) === (independent ? 10 : 7)) finishNumber();
    else {
      feedback = independent ? (Number(value) === 8 ? "8은 가장 작은 수예요. 이 문제에서 묻는 수를 다시 확인해 보세요." : "답이 달라요. 구한 세 수의 합과 문제에서 묻는 수를 다시 확인해 보세요.") : "3x는 x를 3번 더한 값이에요. 21을 똑같이 세 부분으로 나눠 보세요.";
      if (r.attempts.length >= 2) r.revealed = true;
      inputValue = "";
      commit(r.revealed ? "풀이를 함께 확인해요." : feedback, !r.revealed);
    }
  }
  document.addEventListener("keydown", function (event) {
    if (event.repeat || event.defaultPrevented || event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.target.id === "ms-answer" && event.key === "Enter") { event.preventDefault(); submitNumber(); return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    if (session.view === "student" && session.phase === "guided" && /^[1-4]$/.test(event.key)) { event.preventDefault(); choose(Number(event.key) - 1); }
  });
  window.addEventListener("openai:set_globals", function (event) {
    if (!event.detail || !event.detail.globals || !("widgetState" in event.detail.globals)) return;
    const restored = fromHost(event.detail.globals.widgetState);
    if (restored) { session = restored; restoreDesign(event.detail.globals.widgetState); feedback = ""; inputValue = ""; render(); }
  });
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: function () { render(); persist(); } });
    tweak.addSelect(design, "layout", { label: "풀이와 선택지 배치", options: [{ label: "나란히 보기", value: "split" }, { label: "해설을 위에 보기", value: "stacked" }] });
    tweak.addSlider(design, "textSize", { label: "본문 크기", min: 15, max: 19, step: 1, unit: "px" });
  }
})();
</script>
