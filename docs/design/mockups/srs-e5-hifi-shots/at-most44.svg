<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-labelledby="title desc" lang="ko" xml:lang="ko">
  <title id="title">44 이하인 수</title>
  <desc id="desc">35부터 46까지 모든 정수 눈금의 간격이 같은 수직선이에요. 36, 38, 42, 44, 45를 표시했어요. 44의 채운 점과 왼쪽 화살표는 44를 포함한 작은 수를 나타내요. 45는 범위 밖이에요.</desc>
  <rect width="420" height="240" fill="#ffffff"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif" fill="#172b4d" font-size="20">
    <text x="24" y="38" font-weight="700">44 이하인 수</text>
    <!-- Uniform scale: x(n) = 44 + 30 * (n - 35), y = 110. -->
    <path d="M 24 110 H 396 M 389 105 L 396 110 L 389 115" fill="none" stroke="#172b4d" stroke-width="2"/>
    <g id="ticks" stroke="#172b4d" stroke-width="1.5">
      <path data-value="35" d="M 44 102 V 120"/>
      <path data-value="36" d="M 74 102 V 120"/>
      <path data-value="37" d="M 104 102 V 120"/>
      <path data-value="38" d="M 134 102 V 120"/>
      <path data-value="39" d="M 164 102 V 120"/>
      <path data-value="40" d="M 194 102 V 120"/>
      <path data-value="41" d="M 224 102 V 120"/>
      <path data-value="42" d="M 254 102 V 120"/>
      <path data-value="43" d="M 284 102 V 120"/>
      <path data-value="44" d="M 314 102 V 120"/>
      <path data-value="45" d="M 344 102 V 120"/>
      <path data-value="46" d="M 374 102 V 120"/>
    </g>
    <path id="interval" d="M 314 110 H 24 M 34 102 L 24 110 L 34 118" fill="none" stroke="#3159df" stroke-width="5" stroke-linejoin="round"/>
    <circle id="included-endpoint" cx="314" cy="110" r="7" fill="#3159df"/>
    <text x="74" y="153" text-anchor="middle" font-size="18">36</text>
    <text x="134" y="153" text-anchor="middle" font-size="18">38</text>
    <text x="254" y="153" text-anchor="middle" font-size="18">42</text>
    <text x="314" y="153" text-anchor="middle" font-size="18" font-weight="700" fill="#3159df">44</text>
    <text x="344" y="153" text-anchor="middle" font-size="18">45</text>
    <text x="24" y="197" fill="#3159df" font-weight="700">44도 포함해요</text>
    <text x="24" y="226">45는 범위 밖이에요</text>
  </g>
</svg>
