<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" role="img" aria-labelledby="title desc" lang="ko" xml:lang="ko">
  <title id="title">0.2 × 0.3의 넓이 모형</title>
  <desc id="desc">한 변이 1인 정사각형을 가로 10칸, 세로 10칸으로 나눴어요. 왼쪽 위 가로 2칸, 세로 3칸을 칠했어요. 가로는 0.2, 세로는 0.3이에요. 한 칸의 넓이는 0.01이고, 색칠한 6칸의 넓이는 0.06이에요.</desc>
  <rect width="420" height="460" fill="#ffffff"/>
  <g font-family="Pretendard, 'Malgun Gothic', sans-serif" fill="#172b4d" font-size="20">
    <!-- Square: (90,90) to (330,330); each cell is 24 by 24. -->
    <rect x="90" y="90" width="240" height="240" fill="#f5f7fc"/>
    <rect id="highlight" x="90" y="90" width="48" height="72" fill="#3159df"/>
    <g id="grid" stroke="#aebbd1" stroke-width="1" fill="none">
      <path d="M 114 90 V 330 M 90 114 H 330"/>
      <path d="M 138 90 V 330 M 90 138 H 330"/>
      <path d="M 162 90 V 330 M 90 162 H 330"/>
      <path d="M 186 90 V 330 M 90 186 H 330"/>
      <path d="M 210 90 V 330 M 90 210 H 330"/>
      <path d="M 234 90 V 330 M 90 234 H 330"/>
      <path d="M 258 90 V 330 M 90 258 H 330"/>
      <path d="M 282 90 V 330 M 90 282 H 330"/>
      <path d="M 306 90 V 330 M 90 306 H 330"/>
    </g>
    <rect x="90" y="90" width="240" height="240" fill="none" stroke="#172b4d" stroke-width="2"/>
    <!-- Dimension labels sit outside every stroke, without white masks. -->
    <g stroke="#3159df" stroke-width="2" fill="none">
      <path d="M 90 70 V 62 H 138 V 70"/>
      <path d="M 76 90 H 68 V 162 H 76"/>
    </g>
    <text x="114" y="45" text-anchor="middle" fill="#3159df">0.2</text>
    <text x="52" y="134" text-anchor="end" fill="#3159df">0.3</text>
    <path d="M 90 346 V 354 H 330 V 346" fill="none" stroke="#172b4d" stroke-width="1.5"/>
    <text x="210" y="382" text-anchor="middle">한 변 1</text>
    <text x="210" y="415" text-anchor="middle">한 칸의 넓이 0.01</text>
    <text x="210" y="446" text-anchor="middle" font-weight="700" fill="#3159df">색칠한 6칸의 넓이 0.06</text>
  </g>
</svg>
