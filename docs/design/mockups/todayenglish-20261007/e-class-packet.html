function creator(){$('main').innerHTML=heading('원문에서 새로운 문제로','학습 목적에 맞는 유형을 고르고, 제작된 초안을 직접 검토하세요.','<button class="btn" id="backPacket">자료집으로 돌아가기</button>')+'<div class="builder"><section class="panel"><h2 style="margin-bottom:20px">어떤 문제를 만들까요?</h2><div class="modes"><button class="mode '+(mode==='original'?'active':'')+'" data-mode="original"><b>원문으로 만들기</b><small>원문을 유지하거나 변형</small></button><button class="mode '+(mode==='new'?'active':'')+'" data-mode="new"><b>새 지문으로 만들기</b><small>주제와 대상 학년 지정</small></button><button class="mode '+(mode==='cloze'?'active':'')+'" data-mode="cloze"><b>원문 복원 연습</b><small>규칙으로 만드는 빈칸</small></button></div><label class="field"><span>'+(mode==='new'?'지문 주제':'사용할 원문')+'</span>'+(mode==='new'?'<input id="topic" value="공동 정원이 바꾸는 이웃의 관계">':'<textarea id="passage">'+passage+'</textarea>')+'<small>이 시안에서는 ‘도시의 작은 정원’ 예시로 제작 흐름을 확인합니다.</small></label><div class="field"><span>문항 유형</span><div class="chips">'+(mode==='cloze'?['원문 복원']:['주제','내용 일치','서술형','어휘','해석','영영풀이','어법']).map(t=>'<button class="chip '+(types.includes(t)?'active':'')+'" aria-pressed="'+types.includes(t)+'" data-type="'+t+'">'+t+'</button>').join('')+'</div></div><div class="twofields"><label class="field"><span>대상 학년</span><select id="grade"><option>고1</option><option>중3</option><option>고2</option></select></label><label class="field"><span>문항 수</span><select id="count"><option value="3" '+(count===3?'selected':'')+'>3문항</option><option value="5" '+(count===5?'selected':'')+'>5문항</option><option value="8" '+(count===8?'selected':'')+'>8문항</option></select></label></div><div class="builderEnd"><p>제작한 문제는 초안으로 시작합니다.<br>정답과 근거를 확인한 뒤 보관하세요.</p><button class="btn primary" id="generate">'+icon('spark')+'초안 만들기</button></div></section><aside><section class="panel"><h3>이번 제작에 연결된 원문</h3><div class="previewExample"><span class="badge">자료은행</span><h3 style="margin-top:14px">도시의 작은 정원</h3><p>Small gardens,<br>big changes.</p><div style="font-size:10px;color:var(--muted);margin-top:15px">교사 입력 원문 · 고1</div></div><p style="font-size:11px;color:var(--muted);margin-top:16px">문제와 원문을 함께 보관하면 같은 자료로 다른 유형을 만들 수 있습니다.</p></section><p class="hint" style="margin-top:18px">AI 제작은 의미와 문맥을 다루는 초안을 만듭니다. 원문 복원은 입력한 단어를 규칙에 따라 빈칸으로 바꾸는 연습입니다.</p></aside></div>';$('backPacket').onclick=()=>show('packet');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;types=mode==='cloze'?['원문 복원']:['주제','내용 일치','서술형'];creator()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{let t=b.dataset.type;types=types.includes(t)?types.filter(x=>x!==t):[...types,t];b.classList.toggle('active',types.includes(t));b.setAttribute('aria-pressed',types.includes(t))});$('count').onchange=e=>count=+e.target.value;$('generate').onclick=generate}
function generate(){if(!types.length){toast('한 가지 이상 유형을 선택해 주세요.');return}if(types.length>count){toast('문항 수를 선택한 유형 수 이상으로 정해 주세요.');return}let eligible=questions.filter(q=>types.includes(q.type));generated=Array.from({length:count},(_,i)=>({...eligible[i%eligible.length],status:'초안',id:100+questions.length+i,title:eligible[i%eligible.length].title+(i>=eligible.length?' · 추가 연습':'')}));openDialog('제작된 초안을 검토하세요',count+'문항 · 예시 제작 결과', '<div class="notice">선택한 유형의 예시 문항입니다. 정답·근거와 표현을 확인한 뒤 문제은행에 보관하세요.</div>'+generated.map((q,i)=>questionHtml(q,i+1,true)).join(''),'<button class="btn" id="editConditions">조건 수정</button><button class="btn primary" id="saveDrafts">초안으로 은행에 보관</button>');$('editConditions').onclick=closeDialog;$('saveDrafts').onclick=()=>{generated.forEach(q=>questions.push(q));closeDialog();show('bank');toast('이 시안의 문제은행에 초안 '+generated.length+'문항을 보관했습니다.')};}

function optionsHtml(q){return q.options.length?'<ol class="choices">'+q.options.map((o,i)=>'<li>'+['①','②','③','④','⑤'][i]+' '+esc(o)+'</li>').join('')+'<\/ol>':''}

function filterBank(){const needle=$('search').value.toLowerCase(),type=$('typeFilter').value,status=$('statusFilter').value,filtered=questions.filter(q=>(q.title+' '+q.type).toLowerCase().includes(needle)&&(!type||q.type===type)&&(!status||q.status===status));$('bankRows').innerHTML=filtered.map(q=>'<tr><td><button class="qtitle" data-review="'+q.id+'">'+esc(q.title)+'</button><span class="qsub">고1 · 도시의 작은 정원</span></td><td><span class="badge '+(q.status==='검토 완료'?'done':'')+'">'+q.status+'</span></td><td>'+q.type+'</td><td><button class="btn '+(picked.includes(q.id)?'':'primary')+'" data-pick="'+q.id+'">'+(picked.includes(q.id)?'담음 · 빼기':'+ 담기')+'</button></td></tr>').join('');$('empty').hidden=filtered.length>0;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let id=+b.dataset.pick;picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id];filterBank();$('returnPacket').textContent='자료집 · '+picked.length+'문항'});bindReview()}
function bindReview(){document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(+b.dataset.review))}
function review(id){const q=getQ(id);openDialog('정답과 근거 검토',q.type+' · 도시의 작은 정원',questionHtml(q,1,true)+'<label class="field"><span>검토 메모</span><textarea id="reviewMemo" style="min-height:75px;font-family:var(--sans);font-size:12px" placeholder="수정할 표현이나 수업에서 설명할 내용을 적으세요.">'+esc(q.memo||'')+'</textarea></label>','<button class="btn" id="saveMemo">메모 저장</button><button class="btn primary" id="reviewDone">'+(q.status==='검토 완료'?'검토 내용 저장':'확인하고 검토 완료')+'</button>');$('saveMemo').onclick=()=>{q.memo=$('reviewMemo').value;q.status=q.status==='초안'?'검토 중':q.status;closeDialog();render();toast('검토 메모를 이 시안에 저장했습니다.')};$('reviewDone').onclick=()=>{q.memo=$('reviewMemo').value;q.status='검토 완료';closeDialog();render();toast('문제를 검토 완료로 표시했습니다.')};}
function sources(){$('main').innerHTML=heading('제작의 시작은 좋은 원문','원문과 출처를 보관하고, 필요한 문제를 여러 번 만들어 보세요.')+'<div class="resource"><section class="panel"><div class="filetype">Aa</div><span class="badge done">텍스트 원문</span><h2 style="margin-top:13px">도시의 작은 정원</h2><p>고1 · 교사 입력 원문<br>Small gardens, big changes.</p><button class="btn primary" id="sourceMake">이 원문으로 문제 제작</button><button class="btn" id="sourceRead" style="margin-top:10px">원문 읽기</button></section><section class="panel"><div class="filetype">＋</div><h2>원문 직접 입력</h2><p>자료 이름과 영어 본문을 입력하면<br>은행에서 다시 사용할 수 있습니다.</p><label class="field"><span>자료 이름</span><input id="newSourceTitle" placeholder="자료 이름"></label><label class="field"><span>영어 본문</span><textarea id="newSource" style="min-height:110px" placeholder="본문을 입력하세요."></textarea></label><button class="btn" id="saveSource">예시 자료로 보관</button></section></div>';$('sourceMake').onclick=()=>show('create');$('sourceRead').onclick=()=>openDialog('도시의 작은 정원','텍스트 원문 · 교사 입력','<p class="english">'+passage+'</p>','');$('saveSource').onclick=()=>{if(!$('newSourceTitle').value.trim()||!$('newSource').value.trim()){toast('자료 이름과 본문을 모두 입력해 주세요.');return}openDialog($('newSourceTitle').value,'시안에서 입력한 원문','<p class="english">'+esc($('newSource').value)+'</p><p class="hint" style="margin-top:20px">입력 결과를 확인하는 시안입니다. 제작 미리보기는 공통 예시 원문을 사용합니다.</p>','')};}
function listening(){$('main').innerHTML=heading('듣기도 하나의 수업으로','음원과 대본, 문항을 함께 확인하고 수업 자료에 연결하세요.')+'<section class="panel"><div style="display:flex;gap:12px;align-items:center"><span class="badge">초안</span><span style="font-size:11px;color:var(--muted)">고1 · 교사 제작 자료</span></div><h2 style="margin-top:15px">주말 정원 모임 안내</h2><p style="font-size:12px;color:var(--muted);margin-top:8px">음원을 연결한 뒤 대본과 문항을 함께 검토합니다.</p><div class="listenInfo"><div class="wave" aria-hidden="true">'+[12,20,35,17,28,40,23,32,15,28,20,35].map(h=>'<i style="height:'+h+'px"></i>').join('')+'</div><div><h3>음원 연결 필요</h3><p>시안에는 재생 가능한 음원이 연결되어 있지 않습니다.</p></div><button class="btn" id="selectAudio">음원 선택</button><input type="file" id="audioFile" accept="audio/*" hidden></div><div id="audioResult" style="margin-top:16px"></div><div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line)"><h3>대본 초안</h3><p class="english" style="max-width:700px;margin-top:14px">Hello, everyone. Our neighborhood garden meeting will take place this Saturday at ten in the morning. Please bring a pair of gloves. We will water the vegetables and exchange seeds. If it rains, we will meet in the community center instead.</p></div></section>';$('selectAudio').onclick=()=>$('audioFile').click();$('audioFile').onchange=e=>{let file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);$('audioResult').innerHTML='<p style="font-size:11px;margin-bottom:8px">'+esc(file.name)+'</p><audio controls style="width:100%" src="'+url+'"></audio>';};}
function openDialog(title,sub,html,footer){lastFocused=document.activeElement;$('dialogTitle').textContent=title;$('dialogSub').textContent=sub;$('dialogBody').innerHTML=html;$('dialogFooter').innerHTML=footer;$('dialogFooter').hidden=!footer;$('modal').showModal();$('dialogBody').scrollTop=0;}
function closeDialog(){$('modal').close();if(lastFocused&&lastFocused.isConnected)lastFocused.focus()}
function openPrint(){const unreviewed=picked.filter(id=>getQ(id).status!=='검토 완료').length;openDialog('资料집 지면 미리보기'.replace('资料','자료'),'A4 · '+(printTeacher?'교사용':'학생용')+' · '+picked.length+'문항',(unreviewed?'<div class="notice">검토가 끝나지 않은 문제 '+unreviewed+'문항이 포함된 미리보기입니다.</div>':'')+'<div class="printPage"><h2>도시의 작은 정원</h2><div class="printmeta"><span>한빛고 고1 · 2학기 중간고사</span><span>'+(printTeacher?'교사용':'이름 __________________')+'</span></div><p class="english">'+passage+'</p>'+picked.map((id,i)=>{let q=getQ(id);return '<div class="printQ"><h3>'+(i+1)+'. '+esc(q.stem)+'</h3>'+optionsHtml(q)+(q.options.length?'':'<div class="writing"></div>')+(printTeacher?'<div class="answer"><b>정답 '+esc(q.answer)+'</b>'+esc(q.evidence)+'</div>':'')+'</div>'}).join('')+'</div>','<button class="btn" id="togglePrint">'+(printTeacher?'학생용으로 보기':'교사용으로 보기')+'</button><button class="btn primary" id="printNow">'+icon('print')+'인쇄</button>');$('togglePrint').onclick=()=>{printTeacher=!printTeacher;closeDialog();openPrint()};$('printNow').onclick=()=>window.print();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('closeDialog').onclick=closeDialog;$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});$('modal').addEventListener('close',()=>{if(lastFocused&&lastFocused.isConnected)lastFocused.focus()});$('helpButton').onclick=()=>openDialog('E안 · 수업 자료집','예시 데이터 · 실제 서버 저장 없이 동작','<p>수업 자료집을 중심으로 문제은행과 제작 도구를 연결한 안입니다.</p><ul style="line-height:2"><li>은행에서 문제를 검색하고 담거나 뺄 수 있습니다.</li><li>AI 제작 조건을 고르면 예시 초안을 확인할 수 있습니다.</li><li>문제의 정답과 근거를 검토하고 상태를 바꿀 수 있습니다.</li><li>학생용·교사용 지면을 나누어 볼 수 있습니다.</li></ul><p class="hint">새로고침하면 초기 예시로 돌아갑니다. 자료집 저장·통합 문제은행은 제안 기능이며, 실제 AI 호출과 학생 배정은 하지 않습니다.</p>','');render();
</script></body></html>
