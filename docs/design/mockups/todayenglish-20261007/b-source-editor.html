<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>오늘의 영어 — B 원문 편집실</title>
    <style>
      :root {
        --ink: #243440;
        --nav: #22323f;
        --muted: #677780;
        --line: #dce1e2;
        --green: #356d5e;
        --wash: #e9f1ed;
        --gold: #8f6825;
        --paper: #fff;
        --surface: #f5f7f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font:
          14px/1.55 "Segoe UI",
          "Malgun Gothic",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #aa8c45;
        outline-offset: 3px;
      }
      svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        letter-spacing: -0.6px;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 20px;
      }
      h3 {
        font-size: 15px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .btn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        min-height: 40px;
        background: white;
        border: 1px solid #cdd5d7;
        border-radius: 5px;
        font-weight: 650;
        font-size: 13px;
      }
      .btn:hover {
        background: #f0f4f2;
      }
      .btn.primary {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .btn.primary:hover {
        background: #295648;
      }
      .btn.dark {
        background: var(--nav);
        color: #fff;
        border-color: var(--nav);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
      }
      .btn.icon {
        padding: 8px;
      }
      .text-button {
        background: none;
        border: 0;
        color: var(--green);
        padding: 4px 0;
        font-weight: 650;
        font-size: 12px;
      }
      .badge {
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: #edf0f1;
        border-radius: 3px;
        padding: 3px 7px;
        color: #53656e;
        white-space: nowrap;
      }
      .badge.green {
        color: #295d4e;
        background: #e7f0e9;
      }
      .badge.amber {
        color: #815d21;
        background: #faf0d9;
      }
      .topbar {
        height: 66px;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 0 28px;
        background: var(--nav);
        color: #fff;
      }
      .brand {
        font-size: 18px;
        letter-spacing: -0.7px;
        font-weight: 750;
        display: flex;
        align-items: center;
        gap: 11px;
        white-space: nowrap;
      }
      .brand-mark {
        border: 1px solid #8ba3aa;
        width: 29px;
        height: 29px;
        font:
          italic 23px Georgia,
          serif;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #dcebcf;
      }
      .mainnav {
        display: flex;
        align-items: stretch;
        height: 100%;
        gap: 7px;
      }
      .mainnav button {
        background: none;
        border: 0;
        color: #b7c4cd;
        padding: 0 15px;
        font-size: 13px;
        position: relative;
        white-space: nowrap;
      }
      .mainnav button.active {
        color: #fff;
      }
      .mainnav button.active:after {
        content: "";
        position: absolute;
        height: 3px;
        background: #b4cba4;
        bottom: 0;
        left: 14px;
        right: 14px;
      }
      .mainnav button:hover {
        color: white;
        background: #ffffff08;
      }
      .prototype {
        margin-left: auto;
        font-size: 11px;
        color: #bac7ce;
      }
      .workspace-name {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #e1e9ed;
        font-size: 12px;
        white-space: nowrap;
      }
      .user-dot {
        width: 27px;
        height: 27px;
        background: #3c505d;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .docbar {
        height: 83px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        border-bottom: 1px solid var(--line);
        padding: 0 30px;
        gap: 18px;
      }
      .doc-heading {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .doc-icon {
        width: 38px;
        height: 43px;
        border: 1px solid #cfd8d9;
        border-radius: 4px;
        display: grid;
        place-items: center;
        color: var(--green);
      }
      .doc-heading h1 {
        font-size: 19px;
      }
      .doc-heading p {
        color: var(--muted);
        font-size: 11px;
        margin-top: 5px;
      }
      .doc-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .doc-actions .small {
        margin-right: 8px;
      }
      .editor {
        display: grid;
        grid-template-columns: 193px minmax(0, 1.04fr) minmax(0, 1fr);
        min-height: calc(100vh - 149px);
      }
      .sources {
        border-right: 1px solid var(--line);
        background: #edf1ef;
        padding: 25px 14px;
        display: flex;
        flex-direction: column;
      }
      .source-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 8px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .source-card {
        background: white;
        border: 1px solid #b7c9bd;
        border-radius: 5px;
        padding: 16px 12px;
        text-align: left;
        box-shadow: 0 3px 5px #22323f04;
        position: relative;
      }
      .source-card:before {
        content: "";
        height: 26px;
        width: 3px;
        background: var(--green);
        position: absolute;
        left: -1px;
        top: 16px;
      }
      .source-card .source-index {
        font-size: 10px;
        color: var(--green);
        display: block;
        margin-bottom: 9px;
      }
      .source-card strong {
        display: block;
        font-size: 13px;
      }
      .source-card small {
        display: block;
        font:
          12px/1.5 Georgia,
          serif;
        color: var(--muted);
        margin: 7px 0 13px;
      }
      .source-card .badge {
        font-size: 10px;
      }
      .source-add {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: none;
        border: 1px dashed #b9c6c0;
        border-radius: 5px;
        margin-top: 12px;
        padding: 10px;
        font-size: 12px;
        color: #516c5e;
      }
      .source-notes {
        margin-top: 35px;
        padding: 0 8px;
      }
      .source-notes h3 {
        font-size: 11px;
        margin-bottom: 12px;
        color: var(--muted);
        font-weight: 400;
      }
      .source-notes p {
        border-left: 2px solid #bfd0c1;
        padding-left: 10px;
        font-size: 12px;
        line-height: 1.85;
        color: #55705e;
      }
      .source-bottom {
        margin-top: auto;
        padding: 30px 8px 0;
        font-size: 11px;
        color: var(--muted);
      }
      .source-bottom strong {
        display: block;
        font-size: 12px;
        color: #456052;
        margin-bottom: 5px;
      }
      .source-pane {
        background: #fff;
        border-right: 1px solid var(--line);
        min-width: 0;
      }
      .pane-toolbar {
        height: 57px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 0 27px;
        font-size: 12px;
        gap: 12px;
      }
      .pane-toolbar strong {
        font-size: 12px;
      }
      .toolbar-group {
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--muted);
      }
      .source-content {
        padding: 32px 32px 26px 27px;
      }
      .source-kicker {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }
      .source-content h2 {
        font:
          normal 33px/1.15 Georgia,
          serif;
        letter-spacing: -1px;
        max-width: 390px;
        margin-bottom: 12px;
      }
      .source-content .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 27px;
      }
      .manuscript {
        margin-left: -8px;
      }
      .sentence {
        display: grid;
        grid-template-columns: 25px minmax(0, 1fr);
        gap: 10px;
        align-items: baseline;
        background: none;
        border: 0;
        text-align: left;
        padding: 7px 8px;
        width: 100%;
        border-radius: 3px;
      }
      .sentence .line-no {
        font:
          10px/1.5 "Segoe UI",
          sans-serif;
        color: #93a09c;
        align-self: start;
        padding-top: 8px;
      }
      .sentence .sentence-text {
        font:
          17px/1.85 Georgia,
          serif;
        color: #36464b;
      }
      .sentence:hover {
        background: #f4f7f3;
      }
      .sentence.active {
        background: #eef3df;
        box-shadow: inset 2px 0 #a3b46e;
      }
      .sentence.active .sentence-text {
        color: #3f512d;
      }
      .source-annotation {
        margin: 27px 0 0 36px;
        padding: 12px 14px;
        border: 1px solid #d9e3d1;
        border-radius: 4px;
        background: #f8faf4;
        font-size: 11px;
        color: #5d714d;
      }
      .source-annotation strong {
        font-weight: 650;
        display: block;
        margin-bottom: 4px;
      }
      .source-footer {
        border-top: 1px solid var(--line);
        margin-top: 27px;
        padding: 15px 0 0 35px;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .editor-pane {
        min-width: 0;
        background: #f6f8f7;
        display: flex;
        flex-direction: column;
      }
      .editor-tabs {
        display: flex;
        height: 57px;
        align-items: stretch;
        gap: 25px;
        padding: 0 27px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .editor-tabs button {
        background: none;
        border: 0;
        position: relative;
        color: var(--muted);
        font-size: 12px;
        padding: 0 2px;
      }
      .editor-tabs button[aria-selected="true"] {
        color: var(--green);
        font-weight: 700;
      }
      .editor-tabs button[aria-selected="true"]:after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        background: var(--green);
        height: 2px;
      }
      .editor-tabs .badge {
        align-self: center;
        margin-left: auto;
      }
      .right-content {
        padding: 28px;
        flex: 1;
        min-width: 0;
      }
      .intro {
        margin-bottom: 25px;
      }
      .intro h2 {
        font-size: 21px;
        margin-bottom: 7px;
      }
      .intro p {
        color: var(--muted);
        font-size: 12px;
        max-width: 360px;
        line-height: 1.8;
      }
      .step-title {
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .step-title .num {
        font-size: 10px;
        background: #e4eae6;
        color: #50665b;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
      }
      .field {
        margin-bottom: 24px;
      }
      .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .mode {
        position: relative;
        padding: 13px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        text-align: left;
        background: white;
        font-size: 12px;
        line-height: 1.6;
      }
      .mode.active {
        border-color: var(--green);
        background: #f3f8f4;
        box-shadow: inset 0 0 0 1px var(--green);
      }
      .mode strong {
        display: block;
        margin-bottom: 5px;
      }
      .mode small {
        font-size: 10px;
        color: var(--muted);
        display: block;
      }
      .mode .radio {
        float: right;
        width: 12px;
        height: 12px;
        border: 1px solid #b4c1ba;
        border-radius: 50%;
        margin-top: 3px;
      }
      .mode.active .radio {
        border: 4px solid var(--green);
      }
      .type-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }
      .type {
        padding: 10px 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        font-size: 11px;
        text-align: center;
        cursor: pointer;
        position: relative;
      }
      .type:has(input:checked) {
        border-color: #719784;
        background: #eaf3ed;
        color: #295c45;
      }
      .type input {
        appearance: none;
        width: 0;
        margin: 0;
      }
      .type input:focus-visible {
        outline: none;
      }
      .type:focus-within {
        outline: 3px solid #aa8c45;
        outline-offset: 2px;
      }
      .type:has(input:checked):after {
        content: "✓";
        margin-left: 4px;
      }
      .type-summary {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .settings-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .settings-row label {
        font-size: 11px;
        color: var(--muted);
      }
      select {
        width: 100%;
        display: block;
        margin-top: 7px;
        border: 1px solid #d4ded7;
        border-radius: 4px;
        padding: 10px;
        background: #fff;
        font-size: 12px;
      }
      .creation-note {
        display: flex;
        gap: 9px;
        padding: 14px;
        background: #edf1ed;
        border-radius: 4px;
        font-size: 11px;
        color: #617266;
        line-height: 1.75;
      }
      .creation-note svg {
        width: 16px;
        height: 16px;
        margin-top: 2px;
      }
      .creator-footer {
        border-top: 1px solid var(--line);
        background: white;
        padding: 18px 28px;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
      }
      .creator-footer strong {
        display: block;
        font-size: 12px;
      }
      .creator-footer small {
        font-size: 10px;
        color: var(--muted);
      }
      .question-switch {
        display: flex;
        gap: 7px;
        margin: 0 0 22px;
        flex-wrap: wrap;
      }
      .question-switch button {
        height: 33px;
        min-width: 34px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: white;
        color: var(--muted);
        font-size: 11px;
      }
      .question-switch button.active {
        background: var(--nav);
        color: white;
        border-color: var(--nav);
      }
      .question-switch button.done {
        border-color: var(--green);
        color: var(--green);
      }
      .question-switch button.active.done {
        color: white;
      }
      .review-question {
        background: white;
        border: 1px solid var(--line);
        padding: 21px;
        border-radius: 5px;
      }
      .question-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .review-question h2 {
        font-size: 17px;
        line-height: 1.65;
        letter-spacing: -0.6px;
        margin-bottom: 16px;
      }
      .stem {
        font:
          16px/1.8 Georgia,
          serif;
        border-left: 2px solid #c7d4c8;
        padding: 10px 13px;
        background: #f7f9f7;
        margin-bottom: 14px;
      }
      .choice {
        display: flex;
        gap: 10px;
        width: 100%;
        align-items: baseline;
        text-align: left;
        background: white;
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 9px 10px;
        color: #4c5a60;
        font:
          14px/1.55 Georgia,
          serif;
      }
      .choice span {
        font:
          11px "Segoe UI",
          sans-serif;
        flex-shrink: 0;
      }
      .choice.selected {
        border-color: #98b69f;
        background: #eef5ef;
        color: #28563b;
      }
      .answer-input {
        width: 100%;
        min-height: 70px;
        resize: vertical;
        background: #fff;
        border: 1px solid #ccd7cf;
        border-radius: 4px;
        padding: 12px;
        font:
          14px/1.7 Georgia,
          serif;
      }
      .review-section {
        margin-top: 23px;
      }
      .review-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 650;
        margin-bottom: 10px;
      }
      .evidence {
        background: #f1f4e7;
        border-left: 3px solid #a2b375;
        padding: 12px 14px;
        font:
          14px/1.8 Georgia,
          serif;
        color: #4e6038;
        margin-bottom: 9px;
      }
      .evidence-label {
        font:
          10px/1.5 "Segoe UI",
          "Malgun Gothic",
          sans-serif;
        color: #7a895d;
        display: block;
        margin-bottom: 6px;
      }
      .explanation {
        width: 100%;
        min-height: 80px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.8;
        padding: 11px;
        resize: vertical;
      }
      .review-check {
        display: flex;
        gap: 8px;
        font-size: 11px;
        align-items: flex-start;
        line-height: 1.8;
        margin-top: 18px;
      }
      .review-check input {
        accent-color: var(--green);
        margin-top: 4px;
      }
      .source-pick-hint {
        color: #637449;
        font-size: 11px;
        margin-top: 7px;
      }
      .bottom-line {
        font-size: 10px;
        color: var(--muted);
        margin-top: 10px;
      }
      .mobile-tabs {
        display: none;
      }
      .bank-page {
        padding: 35px 40px;
        max-width: 1240px;
        margin: auto;
      }
      .bank-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      .bank-title h1 {
        font-size: 26px;
      }
      .bank-title p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 7px;
      }
      .bank-layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        gap: 30px;
      }
      .bank-aside {
        border-right: 1px solid var(--line);
        padding-right: 24px;
      }
      .bank-aside label {
        display: block;
        font-size: 12px;
        font-weight: 650;
        margin-bottom: 20px;
      }
      .bank-list {
        border-top: 1px solid var(--line);
      }
      .bank-item {
        display: grid;
        grid-template-columns: 35px minmax(0, 1fr) auto;
        gap: 15px;
        padding: 21px 2px;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .bank-number {
        font:
          italic 23px Georgia,
          serif;
        color: #8c9b92;
      }
      .bank-item h3 {
        font-size: 14px;
        margin: 8px 0 5px;
      }
      .bank-item p {
        font-size: 11px;
        color: var(--muted);
      }
      .bank-tools {
        margin-bottom: 20px;
        display: flex;
        gap: 12px;
      }
      .bank-search {
        flex: 1;
        border: 1px solid #cbd6ce;
        border-radius: 4px;
        background: white;
        padding: 11px 14px;
        font-size: 12px;
        min-width: 0;
      }
      .bank-empty {
        border: 1px dashed #b8c8bd;
        border-radius: 5px;
        padding: 36px;
        text-align: center;
        background: #fff;
      }
      .bank-empty p {
        margin: 10px 0 20px;
        font-size: 12px;
        color: var(--muted);
      }
      .bank-summary {
        background: #eaf0e9;
        padding: 16px;
        border-radius: 4px;
        color: #5b705a;
        font-size: 12px;
        margin-top: 20px;
      }
      .bank-summary strong {
        display: block;
        color: #2e583c;
        margin-bottom: 5px;
      }
      .saved-message {
        background: #e9f3ec;
        color: #2e6544;
        padding: 13px 18px;

        openModal(
          "자료은행 · 원문 선택",
          `<div class="dialog-body"><p class="small muted" style="margin-bottom:16px">사용할 원문을 선택해 편집실에서 열어 주세요.</p><button class="resource-choice" onclick="useSample()"><span class="resource-page">${icon("file")}</span><span><strong>도시의 작은 정원</strong><p>Small gardens, big changes</p><span class="badge green">자체 창작 예시</span> <span class="badge">고1</span></span><span style="margin-left:auto">↗</span></button><p class="helper">자료의 텍스트와 출처를 확인한 후 제작에 사용합니다. 기존 문항이 있으면 원문 변경 시 검토 초안이 초기화됩니다.</p></div><div class="dialog-foot"><span class="small muted">예시 원문 1개</span><button class="btn" onclick="closeModal();openSourceInput()">+ 원문 직접 입력</button></div>`,
        );
      }
      function useSample() {
        if (sourceText !== original) {
          draft = [];
          sourceText = original;
          sourceTitle = "도시의 작은 정원";
          panel = "create";
          mobile = "create";
        }
        closeModal();
        screen = "editor";
        render();
      }
      function openSourceInput() {
        openModal(
          "원문 본문 편집",
          `<form onsubmit="event.preventDefault();applySource()"><div class="dialog-body"><label class="input-label" for="sourceInput">영어 원문</label><textarea class="source-input" id="sourceInput" required maxlength="6000">${esc(sourceText)}</textarea><p class="helper">편집한 본문은 이 화면에서만 보관됩니다. 원문을 바꾸면 현재 검토 초안이 초기화됩니다. 직접 입력한 본문으로 AI 문항을 만드는 기능은 이 시안에 연결되지 않습니다.</p></div><div class="dialog-foot"><span class="small muted">새로고침 시 초기화</span><button class="btn primary" type="submit">본문 반영</button></div></form>`,
        );
      }
      function applySource() {
        const text = $("#sourceInput").value.trim();
        if (!text) return;
        if (text !== sourceText) {
          sourceText = text;
          sourceTitle =
            text === original ? "도시의 작은 정원" : "직접 입력한 원문";
          draft = [];
          selectedLine = 6;
          panel = "create";
          mobile = "source";
          pickEvidence = false;
        }
        closeModal();
        screen = "editor";
        render();
      }
      function openListening() {
        openModal(
          "듣기 자료",
          `<div class="dialog-body"><div class="listen-state">${icon("headphones")}<div><h3>음원 연결이 필요합니다</h3><p>현재 원문에는 연결된 음원이 없습니다.</p></div></div><div class="listening-rows"><p><span>읽기 원문</span><span>${esc(sourceTitle)}</span></p><p><span>듣기 음원</span><span class="muted">연결 안 됨</span></p><p><span>듣기 문항</span><span class="muted">제작 전</span></p></div><p class="helper">실제 음원과 대본을 연결해야 듣기 검토를 시작할 수 있습니다. 이 시안에서는 음원 재생과 업로드를 제공하지 않습니다.</p></div><div class="dialog-foot"><span class="small muted">읽기 자료는 확인할 수 있습니다.</span><button class="btn" onclick="closeModal();openResources()">자료은행 열기</button></div>`,
        );
      }
      $("#modal").addEventListener("click", (e) => {
        if (e.target === $("#modal")) {
          const r = e.target.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeModal();
        }
      });
      render();
    </script>
  </body>
</html>
