<title>오늘의 영어 전환 시안</title>
<style>
/* 배치: 위에 안 고르는 탭, 아래에 작업실 셸(옆 메뉴 + 본문)을 실제 색·크기로 그린다. 셸 안 색은 Workroom.module.css 값 그대로(제품 모습이라 테마를 안 탄다). */
:root {
  --bg: #f6f7f9; --fg: #172b4d; --muted: #5b6b84; --rule: #d8dee8; --card: #ffffff; --pick: #3159df; --soft: #edf2ff;
  --font-ui: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #10161f; --fg: #e6ebf3; --muted: #9aa8bd; --rule: #2a3442; --card: #171f2b; --pick: #7f9bff; --soft: #1e2a44; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #10161f; --fg: #e6ebf3; --muted: #9aa8bd; --rule: #2a3442; --card: #171f2b; --pick: #7f9bff; --soft: #1e2a44; color-scheme: dark; }
body { margin: 0; padding-block: 20px 48px; padding-inline: 16px; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.4px; text-wrap: balance; }
.lead { margin: 0 0 16px; color: var(--muted); max-width: 70ch; }
.lead b { color: var(--fg); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.tab { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
.tab .k { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }
.tab:hover { background: var(--card); }
.tab[aria-selected="true"] { background: var(--card); border-color: var(--rule); color: var(--fg); box-shadow: inset 0 -2px 0 var(--pick); }
.tab:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.panel[hidden] { display: none; }
.note { margin: 0 0 12px; padding: 10px 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 8px; color: var(--muted); }
.note b { color: var(--fg); }
.two { display: grid; grid-template-columns: 1fr; gap: 14px; }
.stateLabel { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; }

/* ── 작업실 셸 (실제 값) ─────────────────────────────── */
.shellBox { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: #f4f6fa; }
.shell { display: flex; min-width: 900px; min-height: 560px; font-family: var(--font-ui); color: #172b4d; }
.side { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; padding: 18px; background: #14243d; color: #c5d0e4; border-right: 1px solid #172e4f; box-sizing: border-box; }
.side.collapsed { width: 72px; padding-inline: 10px; }
.sideHead { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.brand { display: flex; gap: 11px; align-items: center; padding: 0 8px; color: #fff; min-width: 0; background: none; border: 0; font: inherit; text-align: left; cursor: pointer; }
.brand .name { font-size: 23px; font-weight: 780; letter-spacing: -1.1px; line-height: 1.4; white-space: nowrap; }
.mark { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
.mark svg { width: 36px; height: 36px; display: block; }
.toggle { width: 30px; height: 30px; display: grid; place-items: center; color: #9db0cf; background: none; border: 0; border-radius: 6px; flex-shrink: 0; }
.blueBtn { display: flex; justify-content: center; align-items: center; gap: 9px; height: 44px; margin: 16px 0 14px; border: 1px solid #5778ec; border-radius: 8px; background: #3b60df; color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px #0000000d; }
.collapsed .blueBtn span, .collapsed .navLabel, .collapsed .navCaption, .collapsed .brand .name { display: none; }
.collapsed .brand { justify-content: center; padding: 0; }
.collapsed .sideHead { justify-content: center; }
.collapsed .toggle { display: none; }
.navCaption { margin: 0 12px 11px; font-size: 12px; font-weight: 550; letter-spacing: 0.4px; color: #8495b1; }
.nav { display: flex; flex-direction: column; gap: 5px; }
.nav button { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: #b9c7dd; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.nav button svg { width: 18px; height: 18px; color: #8ca1c4; flex-shrink: 0; }
.nav button.on { background: #304362; color: #fff; font-weight: 600; }
.nav button.on svg { color: #a2b9ff; }
.collapsed .nav button { justify-content: center; padding: 0; }
.spacer { flex: 1; }
.account { display: flex; gap: 10px; align-items: center; padding-top: 14px; border-top: 1px solid #ffffff15; color: #dde5f2; font-size: 13px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #274e85; display: grid; place-items: center; color: #d2e4ff; font-weight: 700; flex-shrink: 0; }
.collapsed .account span { display: none; }

/* 전환 장치 — 안마다 다른 것 */
.dim { color: #8d9fbc; font-weight: 600; }
.wmStack { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.wmStack .name { font-size: 20px; }
.wmStack .other { font-size: 13px; letter-spacing: -0.3px; color: #8d9fbc; font-weight: 600; margin-top: 2px; }
.wmRow { display: flex; align-items: baseline; gap: 7px; margin: 8px 0 0 8px; font-size: 15.5px; letter-spacing: -0.5px; white-space: nowrap; }
.wmRow .bar { color: #4e6288; font-weight: 400; }
.wmRow .cur { color: #fff; font-weight: 780; }
.wmRow .oth { color: #8d9fbc; font-weight: 600; }
.chev { width: 16px; height: 16px; color: #9db0cf; flex-shrink: 0; }
.picker { margin: 8px 0 0; padding: 6px; background: #0f1b31; border: 1px solid #2a4066; border-radius: 8px; }
.picker button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: #b9c7dd; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.picker button.cur { background: #304362; color: #fff; font-weight: 600; }
.picker button.cur::after { content: "✓"; color: #a2b9ff; }
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 12px 0 0; padding: 3px; background: #0f1b31; border: 1px solid #2a4066; border-radius: 8px; }
.seg button { height: 32px; border: 0; border-radius: 6px; background: none; color: #8d9fbc; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button.cur { background: #fff; color: #14243d; }
.collapsed .seg { grid-template-columns: 1fr; }
.collapsed .seg button { height: 28px; }
.badge { position: absolute; right: -6px; bottom: -4px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 5px; background: #3b60df; color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid #14243d; box-sizing: content-box; line-height: 1; }
.collapsed .wmStack, .collapsed .wmRow, .collapsed .picker, .collapsed .chev { display: none; }

/* 본문 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 22px; height: 60px; padding: 0 28px; background: #ffffffed; border-bottom: 1px solid #dce3ed; font-size: 14px; }
.crumb { display: flex; gap: 10px; color: #596c86; white-space: nowrap; }
.crumb b { color: #172b4d; font-weight: 600; }
.acct { margin-left: auto; color: #596c86; font-size: 13px; }
.content { padding: 22px 28px 28px; display: flex; flex-direction: column; gap: 16px; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -0.6px; }
.ph p { margin: 4px 0 0; color: #596c86; }
.primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #3159df; color: #fff; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border: 1px solid #d4dce8; border-radius: 8px; background: #fff; color: #596c86; font: inherit; font-size: 14px; font-weight: 600; }
.chip.cur { background: #edf2ff; border-color: #3159df; color: #2447b8; }
.select { margin-left: auto; min-height: 36px; padding: 0 12px; border: 1px solid #d4dce8; border-radius: 8px; background: #fff; color: #172b4d; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; }
.card { background: #fff; border: 1px solid #d4dce8; border-radius: 12px; padding: 18px 20px; min-width: 0; }
.steps { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.steps .kick { font-size: 12px; letter-spacing: 0.6px; color: #8194b1; font-weight: 700; }
.steps h3 { margin: 4px 0 0; font-size: 18px; font-weight: 700; }
.stepRow { display: flex; gap: 10px; flex: 1; max-width: 560px; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #edf2f9; color: #8fa0b8; font-weight: 700; font-variant-numeric: tabular-nums; }
.step.done .dot { background: #3159df; color: #fff; }
.step b { font-size: 14px; font-weight: 650; }
.step small { font-size: 12px; color: #8c98ab; }
.grid { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.28fr); gap: 16px; }
.sec { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sec h3 { margin: 0; font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.num { font-size: 12px; background: #eef3fd; color: #6e87b0; border-radius: 5px; padding: 1px 7px; font-weight: 600; }
.quiet { background: none; border: 0; color: #667d9e; font: inherit; font-size: 13px; font-weight: 600; }
.desc { margin: 6px 0 0; color: #8793a7; font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eef1f7; }
.row:last-of-type { border-bottom: 0; }
.fileIco { width: 36px; height: 40px; border-radius: 8px; background: #edf3ff; color: #4b7cd6; display: grid; place-items: center; flex-shrink: 0; }
.row .t { font-weight: 600; font-size: 14px; }
.row small { display: block; color: #99a5b6; font-size: 12px; }
.tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
.tags span { font-size: 12px; background: #edf3ff; color: #4574c6; padding: 5px 10px; border-radius: 5px; font-weight: 600; }
.setCard { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #e5ebf5; border-radius: 10px; margin-top: 14px; }
.setIco { width: 46px; height: 46px; border-radius: 12px; background: #edf4ff; color: #4382ed; display: grid; place-items: center; flex-shrink: 0; }
.pill { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.draft { background: #fbf0d4; color: #86590a; }
.setCard h4 { margin: 6px 0 2px; font-size: 15px; font-weight: 650; }
.setCard p { margin: 0; color: #91a0b5; font-size: 12px; }
.count { margin-left: auto; text-align: right; color: #71829c; font-size: 12px; white-space: nowrap; }
.count b { display: block; font-size: 22px; color: #293c60; font-weight: 700; }
.wide { width: 100%; margin-top: 16px; }
.under { text-align: center; color: #98a4b6; font-size: 12px; margin-top: 10px; }

/* 세부 질문 */
.qs { display: grid; gap: 12px; }
.q { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
.q h3 { margin: 0 0 6px; font-size: 15px; }
.q p { margin: 0; color: var(--muted); }
.q ol { margin: 8px 0 0; padding-left: 20px; color: var(--fg); }
.q li + li { margin-top: 4px; }
.q .rec { color: var(--pick); font-weight: 700; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <h1>오늘의 영어 — 옆 메뉴 머리의 전환 장치</h1>
  <p class="lead">원장님 지시: <b>옆 메뉴 맨 위에서 오늘의 수학 ↔ 오늘의 영어를 오가고</b>, 오늘의 영어 아래 첫 탭이 «학교별 내신 대비». 셸·색·크기는 지금 작업실(<code>Workroom.module.css</code>) 그대로이고, 안마다 다른 것은 <b>머리의 전환 장치</b>뿐입니다. 본문은 ChatGPT 2안 «학교별 내신 대비»를 작업실 토큰으로 옮긴 모습입니다. 접힌 옆 메뉴(72px)도 같이 봐 주세요.</p>
  <nav class="tabs" role="tablist" aria-label="시안" id="tabs"></nav>
  <div id="panels"></div>
</div>

<script>
const MARK = (letter) => `<span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#fff" d="M6 10L23 14Q27 15 30 18V54L23 50L6 46Q4 45.5 4 43.5V12Q4 9.5 6 10Z"/><path fill="#fff" fill-rule="evenodd" d="M34 18Q37 15 41 14L58 10Q60 9.5 60 12V43.5Q60 45.5 58 46L41 50L34 54Z M44 22H50V28H56V34H50V40H44V34H38V28H44Z"/></svg>${letter ? `<span class="badge">${letter}</span>` : ""}</span>`;
const ICON = {
  school: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  file: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  set: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><path d="M9 3v5H4M8 13h8M8 17h5"/></svg>',
  toggle: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m19 6-6 6 6 6m-7-12-6 6 6 6"/></svg>',
};

/* 안마다: head(collapsed) → 머리 HTML */
const HIFI = [
  { k: "A", name: "두 줄 워드마크",
    why: "마크 옆에 제품 이름 두 줄. 지금 제품은 크고 희게, 다른 제품은 작고 옅게 — 옅은 줄을 누르면 넘어갑니다. 접히면 마크 귀퉁이 글자 딱지(«영»/«수»)가 제품을 말하고, 마크를 누르면 넘어갑니다.",
    head: (c) => `<div class="sideHead"><button class="brand" aria-label="오늘의 영어 — 누르면 오늘의 수학으로">${MARK(c ? "영" : "")}<span class="wmStack"><span class="name">오늘의영어</span><span class="other">오늘의수학 ›</span></span></button><button class="toggle" aria-label="왼쪽 메뉴 접기">${ICON.toggle}</button></div>` },
  { k: "B", name: "나란히 워드마크 (D-39 원문)",
    why: "마크 줄 아래에 «오늘의수학 │ 오늘의영어»를 나란히 — 05 §8.7 D-39 의 워드마크 분기를 옆 메뉴 폭(240px)에 맞춰 15.5px 로 놓았습니다. 고른 쪽 희고 굵게, 다른 쪽 옅게. 접히면 A 와 같이 글자 딱지.",
    head: (c) => `<div class="sideHead"><button class="brand" aria-label="오늘의 영어">${MARK(c ? "영" : "")}<span class="name">오늘의영어</span></button><button class="toggle" aria-label="왼쪽 메뉴 접기">${ICON.toggle}</button></div><div class="wmRow"><button class="brand oth" style="padding:0;font-size:inherit;letter-spacing:inherit"><span class="oth">오늘의수학</span></button><span class="bar">│</span><span class="cur" aria-current="page">오늘의영어</span></div>` },
  { k: "C", name: "고르기 단추",
    why: "브랜드 자리가 곧 고르기 단추 — 이름 옆 작은 ▾. 누르면 바로 아래 제품 목록(오늘의수학 · 오늘의영어 ✓)이 펼쳐집니다(시안은 펼친 채). 제품이 셋 이상으로 늘어도 같은 자리. 접히면 마크만 남고 누르면 목록이 옆으로 뜹니다.",
    head: (c) => `<div class="sideHead"><button class="brand" aria-haspopup="listbox" aria-expanded="true" aria-label="제품 고르기 — 오늘의 영어">${MARK(c ? "영" : "")}<span class="name">오늘의영어</span>${ICON.chev}</button><button class="toggle" aria-label="왼쪽 메뉴 접기">${ICON.toggle}</button></div><div class="picker" role="listbox" aria-label="제품"><button role="option">오늘의수학</button><button role="option" class="cur" aria-selected="true">오늘의영어</button></div>` },
  { k: "D", name: "과목 스위치",
    why: "브랜드는 지금 제품 이름만 보이고, 그 아래 두 칸 스위치 [수학 | 영어]가 항상 보입니다. 어디에 있는지 한눈에 읽히고 한 번 눌러 넘어갑니다. 접히면 스위치가 세로 두 칸으로 줄어듭니다(글자 딱지 없음).",
    head: (c) => `<div class="sideHead"><button class="brand" aria-label="오늘의 영어">${MARK("")}<span class="name">오늘의영어</span></button><button class="toggle" aria-label="왼쪽 메뉴 접기">${ICON.toggle}</button></div><div class="seg" role="group" aria-label="제품"><button>수학</button><button class="cur" aria-pressed="true">영어</button></div>` },
];

function sidebar(h, collapsed) {
  return `<aside class="side${collapsed ? " collapsed" : ""}" aria-label="옆 메뉴${collapsed ? " (접힘)" : ""}">
    ${h.head(collapsed)}
    <button class="blueBtn" aria-label="새 시험 등록">${ICON.plus}<span>새 시험 등록</span></button>
    <p class="navCaption">오늘의 영어</p>
    <nav class="nav" aria-label="오늘의 영어 메뉴">
      <button class="on" aria-current="page">${ICON.school}<span class="navLabel">학교별 내신 대비</span></button>
      <button>${ICON.pen}<span class="navLabel">문제 만들기</span></button>
      <button>${ICON.folder}<span class="navLabel">문제 보관함</span></button>
    </nav>
    <div class="spacer"></div>
    <div class="account"><span class="avatar">인</span><span>인재원 원장<br><small style="color:#8599b7">지점 관리</small></span></div>
  </aside>`;
}

const $ = (id) => document.getElementById(id);
$("tabs").innerHTML = HIFI.map((h, i) => `<button class="tab" role="tab" id="t-${h.k}" aria-controls="p-${h.k}" aria-selected="${i === 0}" type="button"><span class="k">${h.k}</span>${h.name}</button>`).join("") + `<button class="tab" role="tab" id="t-Q" aria-controls="p-Q" aria-selected="false" type="button"><span class="k">?</span>세부 질문</button>`;
$("panels").innerHTML = HIFI.map((h, i) => `<section class="panel" id="p-${h.k}" role="tabpanel" aria-labelledby="t-${h.k}" ${i ? "hidden" : ""}>
  <p class="note"><b>${h.k} ${h.name}</b> — ${h.why}</p>
  <div class="two">
    <div><p class="stateLabel">펼친 옆 메뉴 · 240px</p><div class="shellBox"><div class="shell">${sidebar(h, false)}${CONTENT}</div></div></div>
    <div><p class="stateLabel">접힌 옆 메뉴 · 72px</p><div class="shellBox"><div class="shell" style="min-height:420px">${sidebar(h, true)}${CONTENT}</div></div></div>
  </div>
</section>`).join("") + `<section class="panel" id="p-Q" role="tabpanel" aria-labelledby="t-Q" hidden>${QUESTIONS}</section>`;

function show(k) {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.id === "t-" + k)));
  document.querySelectorAll(".panel").forEach((p) => { p.hidden = p.id !== "p-" + k; });
  try { localStorage.setItem("d148-tab", k); } catch {}
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) show(b.id.slice(2)); });
try { const last = localStorage.getItem("d148-tab"); if (last && $("t-" + last)) show(last); } catch {}
</script>
