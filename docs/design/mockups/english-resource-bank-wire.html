*{box-sizing:border-box}body{margin:0;background:#f3f3f1;color:#20201f;font:15px/1.65 Pretendard,'Malgun Gothic',sans-serif}h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:23px}h3{font-size:17px}button,input,select{font:inherit}button,select{min-height:40px;border:1px solid #8e8e89;background:white;border-radius:4px;padding:7px 12px;color:inherit}button{cursor:pointer}button:hover{background:#edede9}button[aria-pressed=true],.primary{background:#252524;color:white;border-color:#252524}.primary:hover{background:#454543}button:disabled{cursor:default;color:#777;background:#efefec}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #383837;outline-offset:3px}.lab{background:white;padding:20px 28px;border-bottom:2px solid #292927}.muted{color:#62625d}.lab p{margin-top:5px;font-size:14px}.controls,.tabs,.tools,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.controls{margin-top:15px}.controls label{margin-left:auto;font-size:13px}.explain{margin-top:12px;padding-top:10px;border-top:1px solid #d1d1cc;font-size:14px}.frame{max-width:1450px;margin:24px auto;background:white;border:1px solid #c4c4bd;display:grid;grid-template-columns:185px minmax(0,1fr);min-height:670px}.sidebar{padding:25px 18px;background:#eaeae6;border-right:1px solid #bdbdb6}.sidebar strong{display:block;font-size:22px;margin-bottom:35px}.navitem{font-size:13px;padding:12px 6px}.selected{border-left:3px solid #333;font-weight:700;background:#deded7}.content{min-width:0;padding:28px}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.heading p{color:#656560;font-size:13px;margin-top:6px}.tabs{border-bottom:1px solid #b9b9b1;padding-bottom:14px;margin-bottom:20px}.tools{margin-bottom:20px}.tools input{border:1px solid #8e8e89;border-radius:4px;padding:9px 12px;min-width:180px;flex:1}.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px}.list{list-style:none;padding:0;margin:0}.row{border-bottom:1px solid #c9c9c2;padding:14px 2px}.row:first-child{border-top:2px solid #42423e}.row header{display:flex;gap:12px;align-items:center;justify-content:space-between}.row h3{font-size:15px}.row p{font-size:12px;color:#65655e;margin:7px 0}.row.current{border-left:3px solid #3b3b37;padding-left:12px;background:#f1f1ed}.badge{font-size:11px;display:inline-block;padding:1px 6px;border:1px solid #bdbdb7;margin-right:6px}.detail{border:1px solid #bdbdb6;padding:22px;min-width:0}.detail h2{font-size:21px;margin:9px 0}.detail p{margin:12px 0}.detail .meta{font-size:13px;color:#5f5f58}.passage{padding:20px;background:#f5f5f1;line-height:1.9;border-top:1px solid #d3d3cd;border-bottom:1px solid #d3d3cd;font-family:Georgia,serif;font-size:17px}.info{padding:12px;background:#f1f1ed;font-size:13px}.audio{display:flex;gap:16px;align-items:center;background:#ededE8;padding:18px;margin:18px 0}.line{height:4px;background:#a5a59b;flex:1}.actions{margin-top:20px}.relations{border-top:1px solid #bbb;margin-top:24px;padding-top:16px;font-size:13px}.relations p{margin:9px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #c6c6bd;padding:13px 10px;text-align:left;font-size:13px}th{background:#f0f0eb}.drawer{margin-top:20px;max-width:760px;margin-left:auto;border-left:3px solid #333}.folders{display:grid;grid-template-columns:145px minmax(0,1fr);gap:24px}.folders nav{border-right:1px solid #bbb;padding-right:14px}.folders nav button{width:100%;margin-bottom:10px;text-align:left}.stackdetail{margin-top:24px}.focussearch{max-width:840px;margin:auto}.focussearch .tools{padding:23px 0 12px}.focussearch .tools input{padding:15px}.picksummary{border-top:2px solid #333;padding:10px 0;font-size:13px;display:flex;justify-content:space-between}.dialognote{font-size:13px;margin-top:14px}.empty{padding:20px;border:1px solid #ccc}details{margin-top:16px}summary{cursor:pointer;padding:7px 0}.status{padding-top:12px;font-size:13px;min-height:34px}.status:empty{display:none}footer{max-width:1450px;margin:12px auto 32px;font-size:13px;color:#64645b;padding:0 16px}a{color:inherit;text-underline-offset:3px}[hidden]{display:none!important}
@media(max-width:1050px){.frame{margin:16px;grid-template-columns:145px minmax(0,1fr)}.content{padding:20px}.grid{grid-template-columns:240px minmax(0,1fr)}.folders .grid{grid-template-columns:1fr}.folders .detail{margin-top:16px}.controls label{margin-left:0}.folders{grid-template-columns:125px minmax(0,1fr)}}
@media(max-width:720px){.lab{padding:18px 14px}.frame{grid-template-columns:1fr;margin:12px}.sidebar{display:none}.content{padding:18px 14px}.grid,.folders{grid-template-columns:1fr}.folders nav{display:flex;gap:8px;border-right:0;overflow:auto;padding:0}.folders nav button{min-width:110px}.heading{align-items:flex-start}.heading button{white-space:nowrap}.detail{padding:16px}.controls button{font-size:12px;padding:8px}.tools input{min-width:120px}h1{font-size:21px}.heading h2{font-size:21px}.controls label select{max-width:185px}.passage{font-size:15px;padding:14px}.row header{align-items:flex-start}}

<header class="lab"><h1>지문은행 · 듣기은행 — 구조 비교</h1><p class="muted">Wire 시안입니다. 아래 원문·목록·사용 이력은 배치 비교용 예시이며 실제 저장이나 배정을 수행하지 않습니다.</p>
<div class="controls" aria-label="구조 선택"><button type="button" data-layout="A" aria-pressed="true">A 목록 + 상세</button><button type="button" data-layout="B" aria-pressed="false">B 표 + 상세 펼치기</button><button type="button" data-layout="C" aria-pressed="false">C 분류 + 작업대</button><button type="button" data-layout="D" aria-pressed="false">D 검색 중심</button><label>메뉴 배치 <select id="menu"><option value="combined">자료은행 안에 지문·듣기</option><option value="separate">지문은행·듣기은행 별도</option></select></label></div>
<p id="explain" class="explain"></p></header>
<div class="frame"><aside class="sidebar"><strong>오늘의 영어</strong><div class="navitem">학교별 내신 대비</div><div class="navitem">문제 만들기</div><div id="banknav"></div><div class="navitem">문제 보관함</div><div class="navitem">영어듣기 수업</div></aside>
<main class="content"><header class="heading"><div><h2 id="title">자료은행</h2><p>원문을 보관하고, 필요한 자료로 다시 만듭니다.</p></div><button type="button" id="register" class="primary">자료 등록</button></header><div class="tabs" role="group" aria-label="자료 종류"><button type="button" data-kind="passage" aria-pressed="true">지문은행</button><button type="button" data-kind="listening" aria-pressed="false">듣기은행</button></div><div id="body"></div><p id="status" class="status" role="status" aria-live="polite"></p></main></div>
<footer>추천 A: 기존에 선택한 교사 A 작업대의 목록·상세 흐름을 이어갑니다. 색과 타이포는 확정된 H1을 적용할 예정이며, 이 페이지는 정보 배치를 비교합니다. <a href="../../planning/english-resource-bank-plan-20261003.md">은행 계획 문서</a></footer>
<script>
const e=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const datasets={passage:[{id:'p1',title:'AI와 인간의 판단',grade:'중3',source:'직접 등록',meta:'원문 184단어 · 버전 2',text:'Technology can help people make decisions, but useful information is only one part of good judgment. When a computer suggests an answer, people still need to ask what matters in the situation and who will be affected by the choice.',relations:['주제·내용 일치 · 8문항','어법·빈칸 추론 · 6문항']},{id:'p2',title:'학교 텃밭에서 배우는 것',grade:'중2',source:'직접 등록',meta:'원문 156단어 · 버전 1',text:'A school garden gives students a place to observe small changes over time. The class learns to share work, record what happens, and understand why plants grow differently.',relations:['내용 일치 · 5문항']},{id:'p3',title:'도시의 새와 계절',grade:'고1',source:'자체 제작',meta:'원문 228단어 · 버전 1',text:'Some birds remain in cities during winter because food and shelter are easier to find. Yet these choices may change when the weather becomes unusually cold.',relations:[]}],listening:[{id:'l1',title:'학교에서 나눈 대화',grade:'중1',source:'자체 제작',meta:'40초 · 미국식 남녀 · 3문항',text:'A: Hi, Ben. Why are you outside the music room?\nB: I need to return this guitar, but the door is locked.',relations:['청취용 초안 · 검수 전']},{id:'l2',title:'학생들을 위한 교내 방송',grade:'고1',source:'자체 제작',meta:'44초 · 영국식 여성 · 3문항',text:'Good morning, students. The library is organizing a book repair workshop next Wednesday.',relations:['청취용 초안 · 검수 전']},{id:'l3',title:'2026년 2회 전국 영어듣기능력평가',grade:'중1',source:'EBS 중학',meta:'공식 자료 · MP3·문제지·정답·대본',text:'',relations:[],external:true}]};
let layout='A',kind='passage',selected='p1',query='',grade='',folder='all';
const explains={A:'A · 목록과 상세를 나란히 둡니다. 자료를 넘겨보면서 원문·대본을 확인하고 곧바로 제작에 연결합니다.',B:'B · 많은 자료를 표로 비교합니다. 학년·출처·길이를 훑은 뒤 필요한 자료의 상세를 아래에서 펼칩니다.',C:'C · 분류를 왼쪽에 둡니다. 출처와 자료 묶음으로 범위를 먼저 좁히고 목록·상세를 함께 봅니다.',D:'D · 검색부터 시작합니다. 목적에 맞는 지문·듣기를 찾고 선택한 자료를 확인하는 흐름입니다.'};
function filtered(){return datasets[kind].filter(r=>(!grade||r.grade===grade)&&(!query||(r.title+' '+r.text).toLowerCase().includes(query.toLowerCase()))&&(folder==='all'||(folder==='own'?!r.external:r.external)));}
function tools(){return `<div class="tools"><input id="query" type="search" placeholder="${kind==='passage'?'제목·원문으로 찾기':'제목으로 찾기'}" aria-label="자료 검색" value="${e(query)}"><select id="grade" aria-label="학년"><option value="">모든 학년</option>${['중1','중2','중3','고1','고2','고3'].map(v=>`<option ${grade===v?'selected':''}>${v}</option>`).join('')}</select></div>`;}
function list(rows){return `<ul class="list" aria-label="은행 자료 목록">${rows.map(r=>`<li class="row ${selected===r.id?'current':''}"><header><h3>${e(r.title)}</h3><button type="button" data-open="${r.id}" aria-label="${e(r.title)} 열기">열기</button></header><p><span class="badge">${r.grade}</span>${r.source}</p><p>${r.meta}</p></li>`).join('')||'<li class="empty">조건에 맞는 예시 자료가 없습니다.</li>'}</ul>`;}
function detail(r){if(!r)return '<section class="detail"><h3>자료를 선택하세요.</h3><p>선택한 원문과 사용 이력을 확인합니다.</p></section>';return `<section class="detail" aria-label="자료 상세"><span class="badge">${r.grade}</span><span class="badge">${r.source}</span><h2>${e(r.title)}</h2><p class="meta">${r.meta}</p>${r.external?'<p class="info">EBS에서 제공하는 자료입니다. 공식 페이지에서 음원과 문서를 확인할 수 있습니다.</p>':kind==='passage'?`<div class="passage">${e(r.text)}</div>`:`<div class="audio"><span>재생 영역</span><span class="line"></span><span>0:00</span></div><details open><summary>대본과 해석</summary><p>${e(r.text).replace(/\n/g,'<br>')}</p></details>`}<div class="actions">${r.external?'<a href="https://mid.ebs.co.kr/english/engGrade?clsfnSystId=22000010" target="_blank" rel="noopener noreferrer">EBS 공식 자료 열기 ↗</a>':`<button type="button" class="primary" data-action="${kind==='passage'?'make':'review'}">${kind==='passage'?'이 지문으로 문제 만들기':'자료 열고 검수하기'}</button><button type="button" data-action="edit">원문 편집</button>`}</div>${!r.external?`<div class="relations"><h3>${kind==='passage'?'이 지문으로 만든 문제':'자료 상태'}</h3>${r.relations.length?r.relations.map(t=>`<p>${t}</p>`).join(''):'<p>아직 만든 문제 세트가 없습니다.</p>'}</div>`:''}</section>`;}
function table(rows){return `<div class="tablewrap"><table><thead><tr><th>자료</th><th>학년</th><th>출처</th><th>정보</th><th>확인</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${e(r.title)}</td><td>${r.grade}</td><td>${r.source}</td><td>${r.meta}</td><td><button type="button" data-open="${r.id}">열기</button></td></tr>`).join('')}</tbody></table></div>`;}
function render(){document.querySelector('#explain').textContent=explains[layout];document.querySelector('#title').textContent=document.querySelector('#menu').value==='combined'?'자료은행':kind==='passage'?'지문은행':'듣기은행';document.querySelector('#banknav').innerHTML=document.querySelector('#menu').value==='combined'?'<div class="navitem selected">자료은행</div>':`<div class="navitem ${kind==='passage'?'selected':''}">지문은행</div><div class="navitem ${kind==='listening'?'selected':''}">듣기은행</div>`;const rows=filtered(),r=rows.find(x=>x.id===selected);let content='';if(layout==='A')content=tools()+`<div class="grid">${list(rows)}${detail(r)}</div>`;if(layout==='B')content=tools()+table(rows)+`<div class="drawer">${detail(r)}</div>`;if(layout==='C')content=`<div class="folders"><nav aria-label="자료 분류"><button type="button" data-folder="all" aria-pressed="${folder==='all'}">전체 자료</button><button type="button" data-folder="own" aria-pressed="${folder==='own'}">직접 보관한 자료</button><button type="button" data-folder="external" aria-pressed="${folder==='external'}">공식 자료</button></nav><div>${tools()}<div class="grid">${list(rows)}${detail(r)}</div></div></div>`;if(layout==='D')content=`<div class="focussearch">${tools()}<div class="picksummary"><span>검색 결과 ${rows.length}개</span><span>원문·출처를 확인한 뒤 선택</span></div>${list(rows)}<div class="stackdetail">${detail(r)}</div></div>`;document.querySelector('#body').innerHTML=content;document.querySelector('#query').addEventListener('input',ev=>{const pos=ev.target.selectionStart;query=ev.target.value;render();const field=document.querySelector('#query');field.focus();field.setSelectionRange(pos,pos);});document.querySelector('#grade').addEventListener('change',ev=>{grade=ev.target.value;render();});}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;folder='all';document.querySelectorAll('[data-layout]').forEach(el=>el.setAttribute('aria-pressed',el===b));render();}else if(b.dataset.kind){kind=b.dataset.kind;selected=kind==='passage'?'p1':'l1';query='';grade='';folder='all';document.querySelectorAll('[data-kind]').forEach(el=>el.setAttribute('aria-pressed',el===b));render();}else if(b.dataset.open){selected=b.dataset.open;render();}else if(b.dataset.folder){folder=b.dataset.folder;render();}else if(b.dataset.action){document.querySelector('#status').textContent=b.dataset.action==='make'?'구현 예정: 선택한 원문 버전을 보관하고, 대상 시험을 골라 문제 만들기로 이동합니다.':b.dataset.action==='review'?'구현 예정: 기존 영어듣기 작업대에서 음원·대본·문항을 검수합니다.':'구현 예정: 새 원문 버전으로 저장합니다. 기존 문제 세트는 바뀌지 않습니다.';}});
document.querySelector('#menu').addEventListener('change',render);document.querySelector('#register').addEventListener('click',()=>{document.querySelector('#status').textContent='구현 예정: 직접 입력, 파일 올리기, 기존 자료에서 가져오기 중 등록 경로를 고릅니다.';});render();
</script></html>
