<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 B · 작업대형 시험지 만들기</title>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("../../../../public/fonts/PretendardVariable.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --learn-ink: #172b4d;
        --learn-muted: #596c86;
        --learn-accent: #3159df;
        --learn-accent-hover: #2448bd;
        --learn-bg: #f4f6fa;
        --learn-surface: #fff;
        --learn-nav: #14243d;
        --learn-soft: #edf2ff;
        --learn-track: #dde3ec;
        --learn-control: #b8c4d6;
        --learn-danger: #b42318;
        --learn-warning: #8a5a06;
        --learn-warning-bg: #fff4df;
        --text-title: 24px;
        --text-section: 18px;
        --text-body: 14px;
        --text-caption: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--learn-bg);
        color: var(--learn-ink);
        font:
          400 14px/1.55 Pretendard,
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button,
      .btn {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--learn-control);
        border-radius: 8px;
        background: white;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        line-height: 1.4;
      }
      button:hover,
      .btn:hover {
        background: var(--learn-bg);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--learn-accent);
        border-color: var(--learn-accent);
        color: white;
      }
      button.primary:hover {
        background: var(--learn-accent-hover);
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
      }
      button.ghost:hover {
        background: var(--learn-soft);
      }
      button.danger {
        color: var(--learn-danger);
      }
      :focus-visible {
        outline: 3px solid var(--learn-accent);
        outline-offset: 3px;
      }
      input,
      select {
        min-height: 44px;
        width: 100%;
        min-width: 0;
        border: 1px solid var(--learn-control);
        border-radius: 8px;
        background: white;
        padding: 10px 12px;
      }
      input[type="checkbox"] {
        width: 18px;
        min-height: 18px;
        height: 18px;
        accent-color: var(--learn-accent);
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        font-weight: 750;
        line-height: 1.3;
        letter-spacing: -0.035em;
      }
      h2 {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.45;
      }
      h3 {
        font-size: 14px;
        font-weight: 700;
      }
      p + p {
        margin-top: 8px;
      }
      a {
        color: var(--learn-accent);
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      legend,
      .label {
        font-weight: 650;
        margin-bottom: 8px;
        display: block;
      }
      .caption {
        font-size: 12px;
        color: var(--learn-muted);
      }
      .muted {
        color: var(--learn-muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .badge {
        display: inline-flex;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        background: var(--learn-soft);
        color: var(--learn-accent);
        font-weight: 600;
      }
      .skip {
        position: absolute;
        left: 16px;
        top: -100px;
        z-index: 10;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 8px;
      }
      .topbar {
        min-height: 56px;
        background: var(--learn-nav);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 700;
      }
      .brandmark {
        height: 28px;
        width: 28px;
        display: grid;
        place-items: center;
        border: 1px solid #65728a;
        border-radius: 6px;
      }
      .topbar a {
        color: white;
        text-decoration: none;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .topbar .caption {
        color: #c4cddd;
      }
      .wrap {
        max-width: 1160px;
        margin: 0 auto;
        padding: 24px 28px 40px;
      }
      .workbench.wrap {
        max-width: 1440px;
      }
      .pagehead {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }
      .eyebrow {
        font-size: 12px;
        color: var(--learn-muted);
        margin-bottom: 8px;
      }
      .pagehead p {
        margin-top: 8px;
        color: var(--learn-muted);
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        list-style: none;
        margin: 0 0 24px;
        padding: 0;
      }
      .step {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 2px solid var(--learn-track);
        color: var(--learn-muted);
      }
      .step.current {
        border-color: var(--learn-accent);
        color: var(--learn-ink);
      }
      .stepnum {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid var(--learn-control);
        font-size: 12px;
        flex-shrink: 0;
      }
      .current .stepnum {
        background: var(--learn-accent);
        color: white;
        border-color: var(--learn-accent);
      }
      .past .stepnum {
        background: var(--learn-soft);
        border-color: var(--learn-soft);
        color: var(--learn-accent);
      }
      .step strong {
        display: block;
        font-size: 14px;
      }
      .step small {
        font-size: 12px;
      }
      .panel {
        border: 1px solid var(--learn-track);
        background: var(--learn-surface);
        border-radius: 12px;
        min-width: 0;
      }
      .panelhead {
        padding: 20px 24px;
        border-bottom: 1px solid var(--learn-track);
      }
      .panelbody {
        padding: 24px;
      }
      .subject-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .subject-group button {
        min-width: 76px;
        flex: 1;
      }
      .subject-group button[aria-pressed="true"],
      .count-group button[aria-pressed="true"] {
        border-color: var(--learn-accent);
        color: var(--learn-accent);
        background: var(--learn-soft);
        box-shadow: inset 0 0 0 1px var(--learn-accent);
      }
      .scope-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        gap: 32px;
        margin-top: 28px;
      }
      .unit-list {
        display: grid;
        gap: 8px;
      }
      .unit {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--learn-track);
        border-radius: 8px;
        cursor: pointer;
        min-height: 74px;
      }
      .unit:has(input:checked) {
        border-color: var(--learn-accent);
        background: var(--learn-soft);
      }
      .unit strong,
      .unit small {
        display: block;
      }
      .unit small {
        font-size: 12px;
        color: var(--learn-muted);
        font-weight: 400;
      }
      .unit .qty {
        font-size: 12px;
        color: var(--learn-muted);
        white-space: nowrap;
      }
      .count-group {
        display: flex;
        gap: 8px;
      }
      .count-group button {
        flex: 1;
        padding: 10px 8px;
      }
      .context-line {
        padding-top: 16px;
        margin-top: 16px;
        border-top: 1px solid var(--learn-track);
      }
      .selection-note {
        background: var(--learn-bg);
        padding: 16px;
        border-radius: 8px;
        margin-top: 20px;
      }
      .selection-note strong {
        display: block;
        margin: 4px 0;
        font-size: 18px;
      }
      .error {
        color: var(--learn-danger);
        font-size: 12px;
        margin-top: 8px;
      }
      .actionbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px;
        border-top: 1px solid var(--learn-track);
      }
      .review-head {
        margin-bottom: 16px;
      }
      .review-head p {
        margin-top: 4px;
      }
      .question-list {
        display: grid;
        gap: 16px;
      }
      .question {
        padding: 24px;
        position: relative;
        border: 1px solid var(--learn-track);
        border-radius: 12px;
        background: white;
        min-width: 0;
      }
      .q-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .q-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .q-num {
        font-size: 18px;
        font-weight: 750;
        min-width: 28px;
        font-variant-numeric: tabular-nums;
      }
      .q-copy {
        font-size: 14px;
        line-height: 1.8;
        font-weight: 600;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .options {
        display: grid;
        gap: 6px;
        margin-top: 14px;
        font-weight: 400;
      }
      .option {
        display: flex;
        gap: 10px;
        line-height: 1.65;
      }
      .option span:first-child {
        color: var(--learn-muted);
        font-variant-numeric: tabular-nums;
      }
      .q-tools {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        border-top: 1px solid var(--learn-track);
        margin-top: 20px;
        padding-top: 12px;
        flex-wrap: wrap;
      }
      .q-tools .iconbtn {
        padding: 10px;
        min-width: 44px;
      }
      .q-tools details {
        min-width: 0;
      }
      .q-tools summary {
        min-height: 44px;
        cursor: pointer;
        display: flex;
        align-items: center;
        color: var(--learn-muted);
        font-size: 12px;
        font-weight: 600;
      }
      .q-tools details[open] {
        flex-basis: 100%;
        order: 3;
      }
      .answer {
        padding: 12px;
        background: var(--learn-bg);
        border-radius: 6px;
        color: var(--learn-muted);
        font-size: 12px;
      }
      .passage {
        background: var(--learn-bg);
        border: 1px solid var(--learn-track);
        border-radius: 8px;
        padding: 20px;
        line-height: 1.85;
      }
      .passage h3 {
        margin-bottom: 8px;
      }
      .passage p {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .question-group {
        display: grid;
        gap: 12px;
      }
      .group-panel {
        border: 1px solid var(--learn-track);
        border-radius: 12px;
        background: white;
        padding: 20px;
      }
      .group-panel .question {
        border-radius: 0;
        border-width: 0 0 1px;
        padding: 20px 0;
      }
      .group-panel .question:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .list-tail {
        display: flex;
        justify-content: center;
        margin: 20px 0;
      }
      .bottom-actions {
        position: sticky;
        bottom: 16px;
        padding: 16px 20px;
        margin-top: 24px;
        background: white;
        border: 1px solid var(--learn-track);
        box-shadow: 0 5px 20px #172b4d12;
        border-radius: 12px;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        z-index: 2;
      }
      .workbench-grid {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .workbench .config .panelhead {
        padding: 20px;
      }
      .workbench .config .panelbody {
        padding: 20px;
      }
      .workbench .subject-group {
        gap: 4px;
      }
      .workbench .subject-group button {
        padding: 8px;
        min-width: 44px;
      }
      .workbench .scope-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        margin-top: 20px;
      }
      .workbench .unit {
        padding: 12px;
        gap: 8px;
      }
      .workbench .unit .qty {
        font-size: 12px;
      }
      .workbench .actionbar {
        padding: 16px 20px;
        display: block;
      }
      .workbench .actionbar button {
        width: 100%;
        margin-top: 8px;
      }
      .workbench .selection-note {
        margin-top: 12px;
      }
      .workbench .config-note {
        font-size: 12px;
        color: var(--learn-muted);
        padding: 16px 20px;
        border-top: 1px solid var(--learn-track);
      }
      .empty-composition {
        padding: 32px;
      }
      .empty-composition h2 {
        margin-bottom: 8px;
      }
      .empty-flow {
        list-style: none;
        padding: 0;
        margin: 28px 0 0;
        display: grid;
        gap: 0;
      }
      .empty-flow li {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 20px 0;
        border-top: 1px solid var(--learn-track);
      }
      .empty-flow .flow-num {
        font-size: 12px;
        color: var(--learn-accent);
        background: var(--learn-soft);
        padding: 4px 8px;
        border-radius: 4px;
      }
      .empty-flow strong {
        display: block;
        margin-bottom: 4px;
      }
      .empty-flow p {
        font-size: 12px;
        color: var(--learn-muted);
      }
      .pending {
        padding: 12px 16px;
        background: var(--learn-warning-bg);
        color: var(--learn-warning);
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .workbench .review-head {
        background: white;
        padding: 20px;
        border: 1px solid var(--learn-track);
        border-radius: 12px;
      }
      .workbench .question {
        padding: 20px;
      }
      .workbench .q-copy {
        max-width: 76ch;
      }
      .preview-toolbar {
        display: flex;
        gap: 24px;
        align-items: flex-end;
        padding: 20px;
        margin-bottom: 24px;
      }
      .preview-toolbar .field {
        flex: 1;
        min-width: 0;
      }
      .preview-toolbar label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .paper {
        max-width: 860px;
        margin: auto;
        background: white;
        border: 1px solid var(--learn-track);
        box-shadow: 0 8px 24px #172b4d09;
        padding: 48px;
      }
      .paper-head {
        border-top: 3px solid var(--learn-ink);
        padding-top: 24px;
        text-align: center;
        margin-bottom: 28px;
      }
      .paper-head h2 {
        font-size: 24px;
        margin: 8px 0 20px;
        overflow-wrap: anywhere;
      }
      .paper-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--learn-track);
        border-bottom: 1px solid var(--learn-track);
        padding: 12px 0;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .paper .question-list {
        gap: 24px;
      }
      .paper .question {
        border: 0;
        padding: 0 0 20px;
        border-radius: 0;
        break-inside: avoid;
      }
      .paper .q-head {
        margin-bottom: 8px;
      }
      .paper .group-panel {
        border: 0;
        padding: 0;
      }
      .paper .passage {
        background: white;
      }
      .paper .q-meta .caption,
      .paper .q-meta .badge {
        display: none;
      }
      .paper .question-group {
        gap: 20px;
      }
      .paper .q-copy {
        font-weight: 500;
      }
      .paper-foot {
        border-top: 1px solid var(--learn-track);
        margin-top: 24px;
        padding-top: 12px;
        text-align: center;
        font-size: 12px;
        color: var(--learn-muted);
      }
      dialog {
        border: 0;
        border-radius: 18px;
        padding: 0;
        width: min(700px, calc(100% - 32px));
        max-height: calc(100dvh - 40px);
        color: var(--learn-ink);
        box-shadow: 0 25px 100px #10203f33;
      }
      dialog::backdrop {
        background: #14243d70;
        backdrop-filter: blur(3px);
      }
      .dialoghead {
        padding: 20px 24px;
        border-bottom: 1px solid var(--learn-track);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      .dialogbody {
        padding: 24px;
      }
      .dialogfoot {
        padding: 16px 24px;
        border-top: 1px solid var(--learn-track);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .candidate {
        padding: 20px 0;
        border-bottom: 1px solid var(--learn-track);
      }
      .candidate:last-child {
        border-bottom: 0;
      }
      .candidate .q-copy {
        margin: 12px 0;
      }
      .candidate .passage {
        margin-top: 12px;
        padding: 12px;
        font-size: 12px;
      }
      .candidate .row {
        margin-top: 16px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--learn-nav);
        color: white;
        border-radius: 8px;
        padding: 12px 20px;
        max-width: calc(100% - 32px);
        font-size: 12px;
        z-index: 5;
        pointer-events: none;
        box-shadow: 0 4px 16px #172b4d22;
      }
      .toast:empty {
        display: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .step strong {
        word-break: keep-all;
      }
      .workbench .config .panelhead {
        padding: 16px 20px;
      }
      .workbench .scope-layout {
        gap: 16px;
      }
      .workbench .unit {
        min-height: 58px;
      }
      .workbench .unit small {
        display: none;
      }
      .workbench .selection-note {
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .workbench .selection-note strong {
        font-size: 14px;
        margin: 0;
      }
      .workbench .selection-note p,
      .workbench .context-line {
        display: none;
      }
      .workbench .config-note {
        padding: 12px 20px;
      }
      .workbench .empty-composition {
        padding: 24px;
      }
      .workbench .empty-flow {
        margin-top: 20px;
      }
      .paper .passage {
        break-after: avoid;
      }
      @media (min-width: 1000px) {
        .guided-review {
          max-width: 900px;
          margin: auto;
        }
        .workbench .question-list {
          gap: 12px;
        }
      }
      @media (min-width: 1000px) and (min-height: 900px) {
        .workbench .config {
          position: sticky;
          top: 16px;
        }
      }
      @media (max-width: 860px) {
        .workbench-grid {
          grid-template-columns: 270px minmax(0, 1fr);
          gap: 16px;
        }
        .workbench .subject-group button {
          flex-basis: 28%;
        }
        .workbench .q-tools {
          align-items: flex-start;
        }
        .workbench .q-tools > .row {
          gap: 4px;
        }
        .wrap {
          padding: 20px;
        }
        .scope-layout {
          grid-template-columns: minmax(0, 1fr) 240px;
          gap: 24px;
        }
      }
      @media (max-width: 700px) {
        .topbar {
          padding: 6px 16px;
          gap: 8px;
        }
        .topbar .caption {
          display: none;
        }
        .wrap {
          padding: 20px 16px 28px;
        }
        .pagehead {
          margin-bottom: 20px;
          display: block;
        }
        .pagehead > .row {
          margin-top: 12px;
        }
        .scope-layout,
        .workbench-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .scope-layout {
          gap: 24px;
          margin-top: 24px;
        }
        .workbench .subject-group button {
          flex-basis: auto;
        }
        .panelbody,
        .panelhead {
          padding: 20px;
        }
        .step {
          gap: 8px;
          align-items: flex-start;
        }
        .step small {
          display: none;
        }
        .steps {
          gap: 12px;
        }

          icon("undo") +
          "실행 취소</button></div>" +
          (!state.questions.length
            ? '<div class="panel panelbody"><h3>구성한 문항이 없습니다.</h3><p class="muted" style="margin-top:8px">문항을 추가하거나 마지막 삭제를 취소해 주세요.</p></div>'
            : questionsHTML(false)) +
          '<div class="list-tail"><button id="add" data-action="add" ' +
          (!candidates().length ? "disabled" : "") +
          ">" +
          icon("plus") +
          '문항 추가 <span class="caption">후보 ' +
          candidates().length +
          "</span></button></div>" +
          (!candidates().length
            ? '<p class="caption" style="text-align:center">선택한 범위의 문항을 모두 담았습니다. 조건에서 범위를 넓힐 수 있습니다.</p>'
            : "") +
          '<div class="bottom-actions"><div><strong>총 ' +
          state.questions.length +
          '문항</strong><p class="caption">본문을 확인한 뒤 출력 화면으로 이동하세요.</p></div><div class="row">' +
          (IS_A ? '<button data-action="back-config">범위 수정</button>' : "") +
          '<button id="preview" class="primary" data-action="preview" ' +
          (!state.questions.length ? "disabled" : "") +
          ">출력 미리보기" +
          icon("arrow") +
          "</button></div></div></div>"
        );
      }
      function questionsHTML(print) {
        let blocks = [],
          current = null;
        state.questions.forEach((q, i) => {
          if (q.passage) {
            if (current && current.key === q.subject + "-" + q.unit) {
              current.items.push({ q, i });
            } else {
              current = {
                key: q.subject + "-" + q.unit,
                items: [{ q, i }],
                passage: q.passage,
              };
              blocks.push(current);
            }
          } else {
            blocks.push({ items: [{ q, i }] });
            current = null;
          }
        });
        return (
          '<div class="question-list">' +
          blocks
            .map((b) =>
              b.passage
                ? '<section class="group-panel" aria-label="공통 지문 문항"><div class="passage"><h3>[' +
                  (b.items.length === 1
                    ? b.items[0].i + 1
                    : b.items[0].i + 1 + "–" + (b.items.at(-1).i + 1)) +
                  "] 다음 글을 읽고 물음에 답하시오.</h3><p" +
                  (b.items[0].q.subject === "영어" ? ' lang="en"' : "") +
                  ">" +
                  esc(b.passage) +
                  '</p></div><div class="question-group">' +
                  b.items.map(({ q, i }) => question(q, i, print)).join("") +
                  "</div></section>"
                : question(b.items[0].q, b.items[0].i, print),
            )
            .join("") +
          "</div>"
        );
      }
      function question(q, i, print) {
        return (
          '<article class="question" data-qid="' +
          q.id +
          '" aria-label="' +
          (i + 1) +
          '번 문항"><div class="q-head"><div class="q-meta"><span class="q-num">' +
          String(i + 1).padStart(2, "0") +
          '</span><span class="caption">' +
          esc(q.unitName) +
          '</span><span class="badge">' +
          q.level +
          "</span></div>" +
          (!print ? '<span class="caption">객관식</span>' : "") +
          '</div><div class="q-copy">' +
          esc(q.prompt) +
          '</div><div class="options">' +
          q.options
            .map(
              (o, j) =>
                '<div class="option"><span>' +
                ["①", "②", "③", "④"][j] +
                "</span><span>" +
                esc(o) +
                "</span></div>",
            )
            .join("") +
          "</div>" +
          (!print
            ? '<div class="q-tools"><details><summary>정답·해설 보기</summary><p class="answer">' +
              esc(q.answer) +
              '</p></details><div class="row"><button id="up-' +
              i +
              '" class="ghost iconbtn" data-action="up" data-index="' +
              i +
              '" aria-label="' +
              (i + 1) +
              '번 문항 위로" ' +
              (i === 0 ? "disabled" : "") +
              ">" +
              icon("up") +
              '</button><button id="down-' +
              i +
              '" class="ghost iconbtn" data-action="down" data-index="' +
              i +
              '" aria-label="' +
              (i + 1) +
              '번 문항 아래로" ' +
              (i === state.questions.length - 1 ? "disabled" : "") +
              ">" +
              icon("down") +
              '</button><button id="replace-' +
              i +
              '" data-action="replace" data-index="' +
              i +
              '">' +
              icon("swap") +
              '교체</button><button id="remove-' +
              i +
              '" class="ghost danger" data-action="remove" data-index="' +
              i +
              '" aria-label="' +
              (i + 1) +
              '번 문항 삭제">삭제</button></div></div>'
            : "") +
          "</article>"
        );
      }
      function preview() {
        return (
          '<section class="panel preview-toolbar" aria-label="출력 설정"><div class="field"><label for="exam-title">시험지 제목</label><input id="exam-title" maxlength="80" value="' +
          esc(state.title) +
          '" placeholder="시험지 제목을 입력하세요"></div><div><span class="caption">학생용 · 정답 제외</span><div class="row" style="margin-top:8px"><button data-action="back-review">문항으로 돌아가기</button><button class="primary" data-action="print">' +
          icon("print") +
          '인쇄</button></div></div></section><section class="paper" aria-label="학생용 시험지 미리보기"><header class="paper-head"><span class="caption">중학교 1학년 · ' +
          esc(state.applied.subject) +
          ' · 예시 시험지</span><h2 id="paper-title">' +
          esc(state.title || "제목 없는 시험지") +
          '</h2><div class="paper-meta"><span>총 ' +
          state.questions.length +
          "문항</span><span>반 __________ 이름 ______________</span></div></header>" +
          questionsHTML(true) +
          '<footer class="paper-foot">예시 문항으로 구성한 시험지 · 정답은 출력되지 않습니다.</footer></section>'
        );
      }
      function closeDialog() {
        const el = $("#dialog");
        el.close();
        if (dialogReturn) focusId(dialogReturn);
        dialogMode = null;
      }
      function openDialog(kind, index, trigger) {
        dialogMode = { kind, index };
        dialogReturn = trigger;
        let content = "";
        if (kind === "compose") {
          content =
            "<p>새로 선택한 범위로 " +
            state.draft.count +
            "문항을 구성합니다. 현재 문항 편집은 실행 취소로 되돌릴 수 있습니다.</p>";
        } else {
          const list = candidates();
          content =
            '<p class="caption">' +
            esc(state.applied.subject) +
            " · 현재 출제 범위 · 담지 않은 후보 " +
            list.length +
            "문항</p>" +
            (!list.length
              ? '<p style="margin-top:16px">교체할 후보가 없습니다. 문항을 삭제해 후보로 돌리거나 범위를 넓혀 다시 구성해 주세요.</p>'
              : list
                  .map(
                    (q) =>
                      '<article class="candidate"><div class="row between"><span class="caption">' +
                      esc(q.unitName) +
                      " · " +
                      q.level +
                      "</span></div>" +
                      (q.passage
                        ? '<details><summary style="min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:12px">연결된 지문 보기</summary><p class="passage">' +
                          esc(q.passage) +
                          "</p></details>"
                        : "") +
                      '<p class="q-copy">' +
                      esc(q.prompt) +
                      '</p><div class="options">' +
                      q.options
                        .map(
                          (o, i) =>
                            '<div class="option"><span>' +
                            ["①", "②", "③", "④"][i] +
                            "</span><span>" +
                            esc(o) +
                            "</span></div>",
                        )
                        .join("") +
                      '</div><div class="row between"><span class="caption">자체 작성 예시</span><button class="primary" data-action="choose" data-id="' +
                      q.id +
                      '">' +
                      (kind === "replace"
                        ? "이 문항으로 교체"
                        : "이 문항 추가") +
                      "</button></div></article>",
                  )
                  .join(""));
        }
        $("#dialog").innerHTML =
          '<div class="dialoghead"><h2 id="dialog-title">' +
          (kind === "compose"
            ? "문항을 다시 구성할까요?"
            : kind === "replace"
              ? index + 1 + "번 문항 교체"
              : "문항 추가") +
          '</h2><button class="ghost" data-action="close" aria-label="닫기" autofocus>' +
          icon("close") +
          '</button></div><div class="dialogbody">' +
          content +
          "</div>" +
          (kind === "compose"
            ? '<div class="dialogfoot"><button data-action="close">취소</button><button class="primary" data-action="confirm-compose">다시 구성</button></div>'
            : "");
        $("#dialog").showModal();
        $("#dialog").scrollTop = 0;
      }
      function compose() {
        remember();
        state.applied = structuredClone(state.draft);
        const units = state.applied.units;
        let picked = [];
        let n = 0;
        while (picked.length < state.applied.count) {
          for (const u of units) {
            const q = BANK[state.applied.subject].units[u].questions[n];
            if (q && picked.length < state.applied.count) picked.push(q);
          }
          n++;
        }
        state.questions = picked.sort((a, b) => a.unit - b.unit);
        state.stage = 2;
        state.title = state.applied.subject + " 단원 확인 평가";
        render("review-heading");
        reviewPosition();
        announce(state.questions.length + "문항을 구성했습니다.");
      }
      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-unit]")) {
          let u = Number(event.target.dataset.unit);
          state.draft.units = event.target.checked
            ? [...state.draft.units, u].sort()
            : state.draft.units.filter((x) => x !== u);
          render("unit-" + u);
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "exam-title") {
          state.title = event.target.value;
          $("#paper-title").textContent = state.title || "제목 없는 시험지";
        }
      });
      document.addEventListener("click", (event) => {
        const b = event.target.closest("[data-action]");
        if (!b || b.disabled) return;
        const action = b.dataset.action,
          i = Number(b.dataset.index);
        if (action === "subject") {
          state.draft.subject = b.dataset.value;
          state.draft.units = [0, 1];
          render("subject-" + b.dataset.value);
        } else if (action === "count") {
          state.draft.count = Number(b.dataset.value);
          render("count-" + b.dataset.value);
        } else if (action === "all-units") {
          state.draft.units =
            state.draft.units.length === BANK[state.draft.subject].units.length
              ? []
              : BANK[state.draft.subject].units.map((_, i) => i);
          render("config-heading");
        } else if (action === "compose") {
          if (state.applied) openDialog("compose", null, "compose");
          else compose();
        } else if (action === "confirm-compose") {
          closeDialog();
          compose();
        } else if (action === "undo") {
          if (history.length) {
            state = JSON.parse(history.pop());
            state.stage = state.applied ? 2 : 1;
            render(state.applied ? "review-heading" : "config-heading");
            announce("이전 구성으로 되돌렸습니다.");
          }
        } else if (action === "back-config") {
          state.stage = 1;
          render("config-heading");
          window.scrollTo(0, 0);
        } else if (action === "preview") {
          state.stage = 3;
          render("exam-title");
          window.scrollTo(0, 0);
        } else if (action === "back-review") {
          state.stage = 2;
          render("review-heading");
          reviewPosition();
        } else if (action === "replace" || action === "add") {
          openDialog(action, i, b.id);
        } else if (action === "close") {
          closeDialog();
        } else if (action === "choose") {
          const q = candidates().find((x) => x.id === b.dataset.id);
          if (!q) return;
          remember();
          const mode = dialogMode,
            focus = mode.kind === "replace" ? "replace-" + mode.index : "add";
          if (mode.kind === "replace") state.questions[mode.index] = q;
          else state.questions.push(q);
          closeDialog();
          render(focus);
          announce(
            mode.kind === "replace"
              ? "문항을 교체했습니다."
              : "문항을 추가했습니다.",
          );
        } else if (action === "remove") {
          remember();
          state.questions.splice(i, 1);
          render(
            state.questions.length
              ? "remove-" + Math.min(i, state.questions.length - 1)
              : "add",
          );
          announce("문항을 삭제했습니다. 실행 취소로 복원할 수 있습니다.");
        } else if (action === "up" || action === "down") {
          const to = action === "up" ? i - 1 : i + 1;
          if (to < 0 || to >= state.questions.length) return;
          remember();
          [state.questions[i], state.questions[to]] = [
            state.questions[to],
            state.questions[i],
          ];
          render("replace-" + to);
          announce(i + 1 + "번 문항을 " + (to + 1) + "번으로 옮겼습니다.");
        } else if (action === "print") {
          window.print();
        }
      });
      $("#dialog").addEventListener("cancel", (event) => {
        event.preventDefault();
        closeDialog();
      });
      $("#dialog").addEventListener("keydown", (event) => {
        if (event.key !== "Tab") return;
        const items = [
          ...$("#dialog").querySelectorAll(
            'button:not(:disabled),summary,input,select,textarea,a[href],[tabindex="0"]',
          ),
        ].filter((el) => el.getClientRects().length);
        const first = items[0],
          last = items.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.isComposing ||
          event.target.closest("input,textarea,select,[contenteditable]") ||
          $("#dialog").open
        )
          return;
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "z" &&
          history.length &&
          state.stage !== 3
        ) {
          event.preventDefault();
          const btn = $("#undo");
          if (btn) btn.click();
        }
      });
      render();
    </script>
  </body>
</html>
