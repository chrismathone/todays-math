<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 B · 작업대형 시험지 만들기</title>
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("../../../../public/fonts/PretendardVariable.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --learn-ink: #172b4d;
        --learn-muted: #596c86;
        --learn-accent: #3159df;
        --learn-accent-hover: #2448bd;
        --learn-bg: #f4f6fa;
        --learn-surface: #fff;
        --learn-nav: #14243d;
        --learn-soft: #edf2ff;
        --learn-track: #dde3ec;
        --learn-control: #b8c4d6;
        --learn-danger: #b42318;
        --learn-warning: #8a5a06;
        --learn-warning-bg: #fff4df;
        --text-title: 24px;
        --text-section: 18px;
        --text-body: 14px;
        --text-caption: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--learn-bg);
        color: var(--learn-ink);
        font:
          400 14px/1.55 Pretendard,
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button,
      .btn {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--learn-control);
        border-radius: 8px;
        background: white;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        line-height: 1.4;
      }
      button:hover,
      .btn:hover {
        background: var(--learn-bg);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--learn-accent);
        border-color: var(--learn-accent);
        color: white;
      }
      button.primary:hover {
        background: var(--learn-accent-hover);
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
      }
      button.ghost:hover {
        background: var(--learn-soft);
      }
      button.danger {
        color: var(--learn-danger);
      }
      :focus-visible {
        outline: 3px solid var(--learn-accent);
        outline-offset: 3px;
      }
      input,
      select {
        min-height: 44px;
        width: 100%;
        min-width: 0;
        border: 1px solid var(--learn-control);
        border-radius: 8px;
        background: white;
        padding: 10px 12px;
      }
      input[type="checkbox"] {
        width: 18px;
        min-height: 18px;
        height: 18px;
        accent-color: var(--learn-accent);
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        font-weight: 750;
        line-height: 1.3;
        letter-spacing: -0.035em;
      }
      h2 {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.45;
      }
      h3 {
        font-size: 14px;
        font-weight: 700;
      }
      p + p {
        margin-top: 8px;
      }
      a {
        color: var(--learn-accent);
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      legend,
      .label {
        font-weight: 650;
        margin-bottom: 8px;
        display: block;
      }
      .caption {
        font-size: 12px;
        color: var(--learn-muted);
      }
      .muted {
        color: var(--learn-muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .badge {
        display: inline-flex;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        background: var(--learn-soft);
        color: var(--learn-accent);
        font-weight: 600;
      }
      .skip {
        position: absolute;
        left: 16px;
        top: -100px;
        z-index: 10;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 8px;
      }
      .topbar {
        min-height: 56px;
        background: var(--learn-nav);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 700;
      }
      .brandmark {
        height: 28px;
        width: 28px;
        display: grid;
        place-items: center;
        border: 1px solid #65728a;
        border-radius: 6px;
      }
      .topbar a {
        color: white;
        text-decoration: none;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .topbar .caption {
        color: #c4cddd;
      }
      .wrap {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 16px 20px;
      }
      .workbench.wrap {
        max-width: none;
      }
      .pagehead {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }
      .eyebrow {
        font-size: 12px;
        color: var(--learn-muted);
        margin-bottom: 8px;
      }
      .pagehead p {
        margin-top: 8px;
        color: var(--learn-muted);
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        list-style: none;
        margin: 0 0 24px;
        padding: 0;
      }
      .step {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 2px solid var(--learn-track);
        color: var(--learn-muted);
      }
      .step.current {
        border-color: var(--learn-accent);
        color: var(--learn-ink);
      }
      .stepnum {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid var(--learn-control);
        font-size: 12px;
        flex-shrink: 0;
      }
      .current .stepnum {
        background: var(--learn-accent);
        color: white;
        border-color: var(--learn-accent);
      }
      .past .stepnum {
        background: var(--learn-soft);
        border-color: var(--learn-soft);
        color: var(--learn-accent);
      }
      .step strong {
        display: block;
        font-size: 14px;
      }
      .step small {
        font-size: 12px;
      }
      .panel {
        border: 1px solid var(--learn-track);
        background: var(--learn-surface);
        border-radius: 12px;
        min-width: 0;
      }
      .panelhead {
        padding: 20px 24px;
        border-bottom: 1px solid var(--learn-track);
      }
      .panelbody {
        padding: 24px;
      }
      .count-group button[aria-pressed="true"] {
        border-color: var(--learn-accent);
        color: var(--learn-accent);
        background: var(--learn-soft);
        box-shadow: inset 0 0 0 1px var(--learn-accent);
      }
      .scope-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(280px, 24vw, 360px);
        gap: 24px;
        margin-top: 0;
      }
      .scope-layout > *,
      .review-head > div {
        min-width: 0;
      }
      .sample-coverage {
        margin-top: 12px;
      }
      .applied-scopes {
        margin-bottom: 8px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .applied-scopes summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
        color: var(--learn-accent);
      }
      .applied-scopes ul {
        margin: 0;
        padding-left: 20px;
      }
      .review-coverage {
        margin-bottom: 16px;
      }
      .review-head .caption {
        overflow-wrap: anywhere;
      }
      .count-group {
        display: flex;
        gap: 8px;
      }
      .count-group button {
        flex: 1;
        padding: 10px 8px;
      }
      .selection-note {
        background: var(--learn-bg);
        padding: 16px;
        border-radius: 8px;
        margin-top: 20px;
      }
      .selection-note strong {
        display: block;
        margin: 4px 0;
        font-size: 18px;
      }
      .error {
        color: var(--learn-danger);
        font-size: 12px;
        margin-top: 8px;
      }
      .actionbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px;
        border-top: 1px solid var(--learn-track);
      }
      .review-head {
        margin-bottom: 16px;
      }
      .review-head p {
        margin-top: 4px;
      }
      .question-list {
        display: grid;
        gap: 16px;
      }
      .question {
        padding: 24px;
        position: relative;
        border: 1px solid var(--learn-track);
        border-radius: 12px;
        background: white;
        min-width: 0;
      }
      .q-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .q-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .q-num {
        font-size: 18px;
        font-weight: 750;
        min-width: 28px;
        font-variant-numeric: tabular-nums;
      }
      .q-copy {
        font-size: 14px;
        line-height: 1.8;
        font-weight: 600;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .guided-review .q-copy,
      .guided-review .passage {
        max-width: 78ch;
      }
      .options {
        display: grid;
        gap: 6px;
        margin-top: 14px;
        font-weight: 400;
      }
      .option {
        display: flex;
        gap: 10px;
        line-height: 1.65;
      }
      .option span:first-child {
        color: var(--learn-muted);
        font-variant-numeric: tabular-nums;
      }
      .q-tools {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        border-top: 1px solid var(--learn-track);
        margin-top: 20px;
        padding-top: 12px;
        flex-wrap: wrap;
      }
      .q-tools .iconbtn {
        padding: 10px;
        min-width: 44px;
      }
      .q-tools details {
        min-width: 0;
      }
      .q-tools summary {
        min-height: 44px;
        cursor: pointer;
        display: flex;
        align-items: center;
        color: var(--learn-muted);
        font-size: 12px;
        font-weight: 600;
      }
      .q-tools details[open] {
        flex-basis: 100%;
        order: 3;
      }
      .answer {
        padding: 12px;
        background: var(--learn-bg);
        border-radius: 6px;
        color: var(--learn-muted);
        font-size: 12px;
      }
      .passage {
        background: var(--learn-bg);
        border: 1px solid var(--learn-track);
        border-radius: 8px;
        padding: 20px;
        line-height: 1.85;
      }
      .passage h3 {
        margin-bottom: 8px;
      }
      .passage p {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .question-group {
        display: grid;
        gap: 12px;
      }
      .group-panel {
        border: 1px solid var(--learn-track);
        border-radius: 12px;
        background: white;
        padding: 20px;
      }
      .group-panel .question {
        border-radius: 0;
        border-width: 0 0 1px;
        padding: 20px 0;
      }
      .group-panel .question:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .list-tail {
        display: flex;
        justify-content: center;
        margin: 20px 0;
      }
      .bottom-actions {
        position: sticky;
        bottom: 16px;
        padding: 16px 20px;
        margin-top: 24px;
        background: white;
        border: 1px solid var(--learn-track);
        box-shadow: 0 5px 20px #172b4d12;
        border-radius: 12px;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        z-index: 2;
      }
      .workbench-grid {
        display: grid;
        grid-template-columns: clamp(300px, 26vw, 400px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .workbench .config .panelhead {
        padding: 20px;
      }
      .workbench .config .panelbody {
        padding: 20px;
      }
      .workbench .scope-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        margin-top: 0;
      }
      .workbench .actionbar {
        padding: 16px 20px;
        display: block;
      }
      .workbench .actionbar button {
        width: 100%;
        margin-top: 8px;
      }
      .workbench .selection-note {
        margin-top: 12px;
      }
      .workbench .config-note {
        font-size: 12px;
        color: var(--learn-muted);
        padding: 16px 20px;
        border-top: 1px solid var(--learn-track);
      }
      .empty-composition {
        padding: 32px;
      }
      .empty-composition h2 {
        margin-bottom: 8px;
      }
      .empty-flow {
        list-style: none;
        padding: 0;
        margin: 28px 0 0;
        display: grid;
        gap: 0;
      }
      .empty-flow li {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 20px 0;
        border-top: 1px solid var(--learn-track);
      }
      .empty-flow .flow-num {
        font-size: 12px;
        color: var(--learn-accent);
        background: var(--learn-soft);
        padding: 4px 8px;
        border-radius: 4px;
      }
      .empty-flow strong {
        display: block;
        margin-bottom: 4px;
      }
      .empty-flow p {
        font-size: 12px;
        color: var(--learn-muted);
      }
      .pending {
        padding: 12px 16px;
        background: var(--learn-warning-bg);
        color: var(--learn-warning);
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .workbench .review-head {
        background: white;
        padding: 20px;
        border: 1px solid var(--learn-track);
        border-radius: 12px;
      }
      .workbench .question {
        padding: 20px;
      }
      .workbench .q-copy {
        max-width: 76ch;
      }
      .preview-toolbar {
        display: flex;
        gap: 24px;
        align-items: flex-end;
        padding: 20px;
        margin-bottom: 24px;
      }
      .preview-toolbar .field {
        flex: 1;
        min-width: 0;
      }
      .preview-toolbar label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .paper {
        max-width: 860px;
        margin: auto;
        background: white;
        border: 1px solid var(--learn-track);
        box-shadow: 0 8px 24px #172b4d09;
        padding: 48px;
      }
      .paper-head {
        border-top: 3px solid var(--learn-ink);
        padding-top: 24px;
        text-align: center;
        margin-bottom: 28px;
      }
      .paper-head h2 {
        font-size: 24px;
        margin: 8px 0 20px;
        overflow-wrap: anywhere;
      }
      .paper-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--learn-track);
        border-bottom: 1px solid var(--learn-track);
        padding: 12px 0;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .paper .question-list {
        gap: 24px;
      }
      .paper .question {
        border: 0;
        padding: 0 0 20px;
        border-radius: 0;
        break-inside: avoid;
      }
      .paper .q-head {
        margin-bottom: 8px;
      }
      .paper .group-panel {
        border: 0;
        padding: 0;
      }
      .paper .passage {
        background: white;
      }
      .paper .q-meta .caption,
      .paper .q-meta .badge {
        display: none;
      }
      .paper .question-group {
        gap: 20px;
      }
      .paper .q-copy {
        font-weight: 500;
      }
      .paper-foot {
        border-top: 1px solid var(--learn-track);
        margin-top: 24px;
        padding-top: 12px;
        text-align: center;
        font-size: 12px;
        color: var(--learn-muted);
      }
      dialog {
        border: 0;
        border-radius: 18px;
        padding: 0;
        width: min(700px, calc(100% - 32px));
        max-height: calc(100dvh - 40px);
        color: var(--learn-ink);
        box-shadow: 0 25px 100px #10203f33;
      }
      dialog::backdrop {
        background: #14243d70;
        backdrop-filter: blur(3px);
      }
      .dialoghead {
        padding: 20px 24px;
        border-bottom: 1px solid var(--learn-track);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      .dialogbody {
        padding: 24px;
      }
      .dialogfoot {
        padding: 16px 24px;
        border-top: 1px solid var(--learn-track);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .candidate {
        padding: 20px 0;
        border-bottom: 1px solid var(--learn-track);
      }
      .candidate:last-child {
        border-bottom: 0;
      }
      .candidate .q-copy {
        margin: 12px 0;
      }
      .candidate .passage {
        margin-top: 12px;
        padding: 12px;
        font-size: 12px;
      }
      .candidate .row {
        margin-top: 16px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--learn-nav);
        color: white;
        border-radius: 8px;
        padding: 12px 20px;
        max-width: calc(100% - 32px);
        font-size: 12px;
        z-index: 5;
        pointer-events: none;
        box-shadow: 0 4px 16px #172b4d22;
      }
      .toast:empty {
        display: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .step strong {
        word-break: keep-all;
      }
      .workbench .config .panelhead {
        padding: 16px 20px;
      }
      .workbench .scope-layout {
        gap: 16px;
      }
      .workbench .selection-note {
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .workbench .selection-note strong {
        font-size: 14px;
        margin: 0;
      }
      .workbench .selection-note p {
        display: none;
      }
      .workbench .config-note {
        padding: 12px 20px;
      }
      .workbench .empty-composition {
        padding: 24px;
      }
      .workbench .empty-flow {
        margin-top: 20px;
      }
      .paper .passage {
        break-after: avoid;
      }
      @media (min-width: 1000px) {
        .workbench .question-list {
          gap: 12px;
        }
      }
      @media (min-width: 1000px) and (min-height: 900px) {
        .workbench .config {
          position: sticky;
          top: 16px;
        }
      }
      @media (max-width: 860px) {
        .workbench-grid {
          grid-template-columns: 270px minmax(0, 1fr);
          gap: 16px;
        }
        .workbench .q-tools {
          align-items: flex-start;
        }
        .workbench .q-tools > .row {
          gap: 4px;
        }
      }
      @media (max-width: 860px) {
        .topbar {
          padding: 6px 16px;
          gap: 8px;
        }
        .topbar .caption {
          display: none;
        }
        .wrap {
          padding: 14px 16px;
        }
        .pagehead {
          margin-bottom: 20px;
          display: block;
        }
        .pagehead > .row {
          margin-top: 12px;
        }
        .scope-layout,
        .workbench-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .scope-layout {
          gap: 20px;
          margin-top: 0;
        }
        .panelbody,
        .panelhead {
          padding: 16px;
        }
        .step {
          gap: 8px;
          align-items: flex-start;
        }
        .step small {
          display: none;
        }
        .steps {
          gap: 12px;
        }
        .step strong {
          font-size: 12px;
        }
        .stepnum {
          width: 24px;
          height: 24px;
        }
        .actionbar {
          padding: 16px 20px;
          align-items: stretch;
          flex-direction: column;
          gap: 12px;
        }
        .actionbar button {
          width: 100%;
        }
        .question {
          padding: 20px;
        }
        .bottom-actions {
          position: static;
          padding: 16px;
          flex-wrap: wrap;
        }
        .bottom-actions > .row {
          flex: 1;
        }
        .bottom-actions .primary {
          flex: 1;
        }
        .preview-toolbar {
          display: grid;
          gap: 16px;
        }
        .paper {
          padding: 24px;
        }
        .paper-head h2 {
          font-size: 24px;
        }
        .review-head {
          align-items: flex-start;
        }
        .group-panel {
          padding: 16px;
        }
        .empty-composition {
          padding: 24px;
        }
        .dialogbody {
          padding: 16px;
        }
        .dialoghead {
          padding: 16px;
        }
        .dialogfoot {
          padding: 16px;
        }
        .q-tools {
          gap: 4px;
        }

    <script>
      "use strict";
      // All questions below are authored samples. This prototype never reads or writes application data.
      const MODE = document.body.dataset.mode,
        IS_A = MODE === "guided";
      const make = (prompt, options, answer, level = "기본") => ({
        prompt,
        options,
        answer,
        level,
      });
      const BANK = {
        수학: {
          scope: "출제 단원",
          type: "개념 · 계산",
          units: [
            {
              name: "소인수분해",
              desc: "소수와 합성수 · 거듭제곱",
              questions: [
                make(
                  "다음 중 소수인 수를 고르시오.",
                  ["1", "9", "13", "21"],
                  "③ 13은 약수가 1과 자기 자신뿐입니다.",
                ),
                make(
                  "60을 소인수분해한 것으로 알맞은 것을 고르시오.",
                  ["2 × 3 × 10", "2² × 3 × 5", "2 × 3² × 5", "2² × 3²"],
                  "② 60 = 2² × 3 × 5입니다.",
                ),
                make(
                  "두 수 18과 24의 최대공약수를 구하시오.",
                  ["3", "6", "9", "12"],
                  "② 공약수 1, 2, 3, 6 중 가장 큰 수는 6입니다.",
                ),
                make(
                  "12와 18의 최소공배수를 구하시오.",
                  ["24", "30", "36", "72"],
                  "③ 12 = 2² × 3, 18 = 2 × 3²이므로 최소공배수는 36입니다.",
                  "응용",
                ),
              ],
            },
            {
              name: "정수와 유리수",
              desc: "수의 대소 · 사칙계산",
              questions: [
                make(
                  "다음 수 중 가장 작은 수를 고르시오.",
                  ["−3", "−1", "0", "2"],
                  "① 수직선에서 가장 왼쪽에 있는 −3입니다.",
                ),
                make(
                  "(−4) + (+7)의 값을 구하시오.",
                  ["−11", "−3", "3", "11"],
                  "③ 부호가 다른 두 정수를 더하면 7 − 4 = 3입니다.",
                ),
                make(
                  "(−3) × (−5)의 값을 구하시오.",
                  ["−15", "−8", "8", "15"],
                  "④ 음수끼리의 곱은 양수이므로 15입니다.",
                ),
                make(
                  "어떤 수에 4를 더했더니 −2가 되었다. 어떤 수를 구하시오.",
                  ["−6", "−2", "2", "6"],
                  "① −2 − 4 = −6입니다.",
                  "응용",
                ),
              ],
            },
            {
              name: "문자와 식",
              desc: "문자의 사용 · 식의 값",
              questions: [
                make(
                  "한 개에 a원인 공책 3권의 가격을 식으로 나타내시오.",
                  ["a + 3", "3a", "a ÷ 3", "3 − a"],
                  "② a원을 세 번 더하면 3a원입니다.",
                ),
                make(
                  "x = 4일 때, 2x + 1의 값을 구하시오.",
                  ["5", "8", "9", "10"],
                  "③ 2 × 4 + 1 = 9입니다.",
                ),
                make(
                  "3a + 2a를 간단히 하시오.",
                  ["5", "5a", "6a", "5a²"],
                  "② 동류항의 계수를 더하면 5a입니다.",
                ),
                make(
                  "가로가 x, 세로가 x + 2인 직사각형의 둘레를 나타내시오.",
                  ["2x + 2", "2x + 4", "4x + 2", "4x + 4"],
                  "④ 2 × {x + (x + 2)} = 4x + 4입니다.",
                  "응용",
                ),
              ],
            },
          ],
        },
        영어: {
          scope: "출제 지문",
          type: "독해 · 어휘",
          units: [
            {
              name: "A small garden",
              desc: "일상 · 중심 내용과 세부 정보",
              passage:
                "Last spring, our class made a small garden behind the library. We planted tomatoes and carrots. Every Friday, we took turns watering the plants. At first, I thought gardening was boring. But when I saw the first tomato, I felt proud. Now I look forward to Fridays.",
              questions: [
                make(
                  "윗글의 중심 내용으로 가장 알맞은 것은?",
                  [
                    "A visit to a new library",
                    "A class gardening experience",
                    "How to cook carrots",
                    "A plan for a sports day",
                  ],
                  "② 학급에서 정원을 가꾸며 느낀 경험을 설명합니다.",
                ),
                make(
                  "학생들이 식물에 물을 준 요일은?",
                  ["Monday", "Wednesday", "Friday", "Sunday"],
                  "③ Every Friday라고 명시되어 있습니다.",
                ),
                make(
                  "윗글의 “look forward to”의 의미로 가장 알맞은 것은?",
                  ["기대하다", "미루다", "기억하다", "돌아보다"],
                  "① look forward to는 기대하다는 뜻입니다.",
                ),
                make(
                  "글쓴이의 감정 변화로 알맞은 것은?",
                  [
                    "proud → worried",
                    "excited → angry",
                    "bored → proud",
                    "sad → bored",
                  ],
                  "③ 처음에는 지루하다고 생각했지만 첫 토마토를 보고 자랑스러워했습니다.",
                  "응용",
                ),
              ],
            },
            {
              name: "A useful repair",
              desc: "환경 · 내용 이해와 추론",
              passage:
                "Mina found an old lamp in her house. It did not work, so she wanted to throw it away. Her grandfather suggested fixing it together. They changed one small part, and the lamp worked again. Mina learned that repairing things can reduce waste.",
              questions: [
                make(
                  "Mina와 할아버지가 고친 물건은?",
                  ["A clock", "A lamp", "A bicycle", "A radio"],
                  "② 오래된 램프를 고쳤습니다.",
                ),
                make(
                  "할아버지가 제안한 일로 알맞은 것은?",
                  [
                    "Buying a new lamp",
                    "Giving the lamp away",
                    "Fixing the lamp together",
                    "Painting the room",
                  ],
                  "③ 함께 고치자고 제안했습니다.",
                ),
                make(
                  "윗글에서 “reduce”와 가장 가까운 뜻을 가진 말은?",
                  ["make less", "bring back", "look for", "turn on"],
                  "① reduce는 양을 줄인다는 뜻입니다.",
                ),
                make(
                  "윗글이 전하는 메시지로 가장 알맞은 것은?",
                  [
                    "Old things are always dangerous.",
                    "Repairing can help the environment.",
                    "New products cost less.",
                    "A lamp is difficult to use.",
                  ],
                  "② 수리를 통해 쓰레기를 줄일 수 있다는 메시지입니다.",
                  "응용",
                ),
              ],
            },
            {
              name: "A quiet morning",
              desc: "생활 · 세부 내용과 표현",
              passage:
                "Joon usually takes the bus to school. Yesterday, he left home early and walked instead. He heard birds and noticed flowers along the road. The walk took twenty minutes. He arrived at school feeling calm and decided to walk again next week.",
              questions: [
                make(
                  "Joon이 평소 학교에 가는 방법은?",
                  ["By bus", "By train", "On foot", "By bicycle"],
                  "① usually takes the bus라고 설명합니다.",
                ),
                make(
                  "어제 학교까지 걸린 시간은?",
                  [
                    "Ten minutes",
                    "Fifteen minutes",
                    "Twenty minutes",
                    "Thirty minutes",
                  ],
                  "③ 걸어서 20분이 걸렸습니다.",
                ),
                make(
                  "Joon이 길에서 발견한 것은?",
                  ["A new shop", "Flowers", "A lost dog", "His teacher"],
                  "② 길을 따라 핀 꽃을 보았습니다.",
                ),
                make(
                  "Joon이 다음 주에 하려는 일은?",
                  [
                    "Take a different bus",
                    "Leave school early",
                    "Walk to school again",
                    "Buy some flowers",
                  ],
                  "③ 다시 걸어서 등교하기로 했습니다.",
                  "응용",
                ),
              ],
            },
          ],
        },
      };
      for (const [subject, data] of Object.entries(BANK))
        data.units.forEach((unit, u) =>
          unit.questions.forEach((q, i) =>
            Object.assign(q, {
              id: subject + "-" + u + "-" + i,
              subject,
              unit: u,
              unitName: unit.name,
              passage: unit.passage || "",
            }),
          ),
        );
      const subject = window.ExamScope.subject;
      const scopeController = window.ExamScope.create({
        sampleUnits: BANK[subject].units.map((unit) => ({
          name: unit.name,
          count: unit.questions.length,
        })),
        onApply: ({ ids, sampleIndices }) => {
          state.draft.scopeIds = [...ids];
          state.draft.units = [...sampleIndices];
          render("config-heading");
        },
      });
      document.getElementById("product-name").textContent =
        window.ExamScope.productName;
      document.getElementById("gallery-link").href =
        "index.html?subject=" + (subject === "영어" ? "english" : "math");
      document.title = window.ExamScope.productName + " · " + document.title;
      let state = {
        draft: {
          subject,
          scopeIds: [...scopeController.defaultIds],
          units: scopeController.sampleIndices(scopeController.defaultIds),
          count: 6,
        },
        applied: null,
        questions: [],
        stage: 1,
        title: "",
      };
      let history = [],
        dialogMode = null,
        dialogReturn = null,
        toastTimer;
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const icon = (name) =>
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        ({
          arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
          up: '<path d="m6 14 6-6 6 6"/>',
          down: '<path d="m6 10 6 6 6-6"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          undo: '<path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12" transform="translate(0 -2)"/>',
          close: '<path d="m6 6 12 12M6 18 18 6"/>',
          print: '<path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/>',
          swap: '<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',
        }[name] || "") +
        "</svg>";
      const pool = (criteria) =>
        criteria
          ? BANK[criteria.subject].units.flatMap((u, i) =>
              scopeController.sampleIndices(criteria.scopeIds).includes(i)
                ? u.questions
                : [],
            )
          : [];
      const candidates = () =>
        pool(state.applied).filter(
          (q) => !state.questions.some((x) => x.id === q.id),
        );
      const pending = () =>
        state.applied &&
        JSON.stringify(state.draft) !== JSON.stringify(state.applied);
      const announce = (msg) => {
        clearTimeout(toastTimer);
        $(".toast").textContent = msg;
        toastTimer = setTimeout(() => ($(".toast").textContent = ""), 3200);
      };
      const remember = () => history.push(JSON.stringify(state));
      const focusId = (id) =>
        requestAnimationFrame(() => {
          const node = document.getElementById(id);
          if (node) node.focus({ preventScroll: true });
        });
      const reviewPosition = () =>
        requestAnimationFrame(() => {
          if (!IS_A && window.matchMedia("(max-width:860px)").matches)
            $("#review-heading").scrollIntoView({ block: "start" });
          else window.scrollTo(0, 0);
        });
      function render(focus) {
        $("#main").className = "wrap " + (IS_A ? "guided" : "workbench");
        const letter = IS_A ? "A" : "B";
        $("#main").innerHTML =
          '<div class="pagehead"><div><div class="eyebrow">시안 ' +
          letter +
          " · 예시 문항 · 실제 저장 없음</div><h1>시험지 만들기</h1><p>" +
          (IS_A
            ? "범위를 정하고, 문항을 다듬어 시험지로 확인하세요."
            : "조건을 곁에 두고, 시험지를 구성하고 다듬으세요.") +
          '</p></div><div class="row"><span class="badge">' +
          (IS_A ? "단계형" : "작업대형") +
          "</span></div></div>" +
          (IS_A ? steps() : "") +
          (IS_A
            ? state.stage === 1
              ? config()
              : review()
            : '<div class="workbench-grid">' +
              config() +
              '<section aria-label="시험지 구성">' +
              (state.questions.length || state.applied ? review() : empty()) +
              "</section></div>");
        if (focus) focusId(focus);
      }
      function steps() {
        return (
          '<ol class="steps" aria-label="시험지 제작 단계">' +
          ["범위 설정", "문항 검토", "양식 구성 · 출력"]
            .map(
              (s, i) =>
                '<li class="step ' +
                (state.stage === i + 1
                  ? "current"
                  : state.stage > i + 1
                    ? "past"
                    : "") +
                '" ' +
                (state.stage === i + 1 ? 'aria-current="step"' : "") +
                '><span class="stepnum">' +
                (i + 1) +
                "</span><div><strong>" +
                s +
                "</strong><small>" +
                [
                  "출제 범위 · 문항 수",
                  "교체 · 추가 · 순서 조정",
                  "양식 선택 · 인쇄 설정",
                ][i] +
                "</small></div></li>",
            )
            .join("") +
          "</ol>"
        );
      }
      function config() {
        const d = state.draft,
          available = pool(d).length,
          valid = available >= d.count;

          '<section class="panel config" aria-labelledby="config-heading"><div class="panelhead"><div class="row between"><h2 id="config-heading" tabindex="-1">' +
          (IS_A ? "어떤 범위로 출제할까요?" : "출제 조건") +
          "</h2>" +
          (IS_A ? '<span class="caption">01 / 03</span>' : "") +
          '</div></div><div class="panelbody"><div class="scope-layout"><section aria-label="출제 범위">' +
          scopeController.summaryHTML(d.scopeIds) +
          '<p class="caption sample-coverage">' +
          esc(coverageText(d)) +
          '</p></section><div><fieldset><legend>구성할 문항 수</legend><div class="count-group">' +
          [4, 6, 8]
            .map(
              (n) =>
                '<button id="count-' +
                n +
                '" data-action="count" data-value="' +
                n +
                '" aria-pressed="' +
                (d.count === n) +
                '">' +
                n +
                "문항</button>",
            )
            .join("") +
          '</div></fieldset><div class="selection-note"><span class="caption">선택 범위의 예시 문항</span><strong>' +
          available +
          '문항</strong><p class="caption">' +
          (valid
            ? "이 중 " + d.count + "문항을 먼저 구성합니다."
            : "구성할 수량보다 예시 문항이 적습니다.") +
          "</p></div>" +
          (!valid
            ? '<p class="error" role="status">' +
              (!d.scopeIds.length
                ? "출제 범위를 선택해 주세요."
                : available === 0
                  ? "선택한 범위에는 연결된 예시 문항이 없습니다. 범위 선택에서 자체 작성 예시를 선택해 주세요."
                  : "연결된 예시 범위를 더 선택하거나 문항 수를 줄여 주세요.") +
              "</p>"
            : "") +
          '</div></div></div><div class="actionbar"><div class="caption">' +
          (state.applied
            ? "다시 구성하면 현재 문항을 바꿉니다."
            : "구성한 뒤 문항을 검토하고 수정할 수 있습니다.") +
          '</div><button id="compose" class="primary" data-action="compose" ' +
          (!valid ? "disabled" : "") +
          ">" +
          d.count +
          "문항 " +
          (state.applied ? "다시 구성" : "구성하기") +
          icon("arrow") +
          "</button></div>" +
          (!IS_A
            ? '<div class="config-note">조건은 구성하기를 누를 때 적용됩니다. 편집한 문항은 실행 취소로 되돌릴 수 있습니다.</div>'
            : "") +
          "</section>"
        );
      }
      function empty() {
        return '<div class="panel empty-composition"><span class="badge">구성 전</span><h2 style="margin-top:16px">이곳에서 문항을 검토합니다</h2><p class="muted">왼쪽에서 출제 범위와 수량을 정한 뒤<br>문항을 구성해 주세요.</p><ol class="empty-flow"><li><span class="flow-num">01</span><div><strong>범위에 맞춰 구성</strong><p>선택한 단원의 예시 문항으로 시작합니다.</p></div></li><li><span class="flow-num">02</span><div><strong>본문을 보며 문항 편집</strong><p>교체 후보를 비교하고, 문항과 순서를 조정합니다.</p></div></li><li><span class="flow-num">03</span><div><strong>학생용 시험지 확인</strong><p>제목을 정하고 출력 화면에서 읽어 봅니다.</p></div></li></ol></div>';
      }
      function coverageText(criteria) {
        const available = pool(criteria).length;
        const connected = scopeController.sampleIndices(
          criteria.scopeIds,
        ).length;
        const unsupported = criteria.scopeIds.length - connected;
        if (!criteria.scopeIds.length)
          return "출제 범위를 검색하거나 학년·단원에서 선택하세요.";
        if (!available)
          return "범위 탐색용 목록입니다. 선택한 범위에 연결된 예시 문항은 0개입니다.";
        return (
          "선택 " +
          criteria.scopeIds.length +
          "개 중 예시 연결 " +
          connected +
          "개 · " +
          available +
          "문항." +
          (unsupported > 0
            ? " 나머지 " +
              unsupported +
              "개 범위는 문항이 연결되지 않아 구성에 포함되지 않습니다."
            : " 예시 문항만 연결되어 있으며 전체 범위의 문제은행이 아닙니다.")
        );
      }
      function scopeText() {
        return state.applied
          ? scopeController.describe(state.applied.scopeIds)
          : "";
      }
      function appliedScopeHTML() {
        const selected = state.applied.scopeIds
          .map((id) => scopeController.catalog.find((item) => item.id === id))
          .filter(Boolean);
        return (
          '<details class="applied-scopes"><summary>선택한 범위 ' +
          selected.length +
          "개 확인</summary><ul>" +
          selected
            .map(
              (item) =>
                "<li>" +
                esc(
                  [item.grade, item.source, item.chapter, item.section]
                    .filter(Boolean)
                    .join(" › "),
                ) +
                (Number.isInteger(item.sampleIndex)
                  ? " · 예시 문항 연결"
                  : " · 연결된 문항 없음") +
                "</li>",
            )
            .join("") +
          '</ul></details><p class="caption review-coverage">' +
          esc(coverageText(state.applied)) +
          "</p>"
        );
      }
      function review() {
        return (
          '<div class="' +
          (IS_A ? "guided-review" : "") +
          '">' +
          (pending()
            ? '<div class="pending">조건을 바꿨습니다. 아래 문항은 이전 구성입니다. 구성하기를 누르면 새 조건을 적용합니다.</div>'
            : "") +
          '<div class="row between review-head"><div><h2 id="review-heading" tabindex="-1">구성한 문항 <span style="color:var(--learn-accent)">' +
          state.questions.length +
          '</span></h2><p class="caption">' +
          esc(state.applied.subject) +
          " · " +
          esc(scopeText()) +
          '</p></div><button id="undo" data-action="undo" ' +
          (!history.length ? "disabled" : "") +
          ">" +
          icon("undo") +
          "실행 취소</button></div>" +
          appliedScopeHTML() +
          (!state.questions.length
            ? '<div class="panel panelbody"><h3>구성한 문항이 없습니다.</h3><p class="muted" style="margin-top:8px">문항을 추가하거나 마지막 삭제를 취소해 주세요.</p></div>'
            : questionsHTML(false)) +
          '<div class="list-tail"><button id="add" data-action="add" ' +
          "" +
          ">" +
          icon("plus") +
          '문항 추가 <span class="caption">후보 ' +
          candidates().length +
          "</span></button></div>" +
          (!candidates().length
            ? '<p class="caption" style="text-align:center">선택한 범위에 연결된 예시 문항을 모두 담았습니다. 예시 범위를 추가할 수 있습니다.</p>'
            : "") +
          '<div class="bottom-actions"><div><strong>총 ' +
          state.questions.length +
          '문항</strong><p class="caption">본문을 확인한 뒤 양식과 인쇄 설정을 구성하세요.</p></div><div class="row">' +
          (IS_A ? '<button data-action="back-config">범위 수정</button>' : "") +
          '<button id="preview" class="primary" data-action="preview" ' +
          (!state.questions.length ? "disabled" : "") +
          ">양식 구성 · 출력" +
          icon("arrow") +
          "</button></div></div></div>"
        );
      }
      function questionsHTML(print) {
        let blocks = [],
          current = null;
        state.questions.forEach((q, i) => {
          if (q.passage) {
            if (current && current.key === q.subject + "-" + q.unit) {
              current.items.push({ q, i });
            } else {
              current = {
                key: q.subject + "-" + q.unit,
                items: [{ q, i }],
                passage: q.passage,
              };
              blocks.push(current);
            }
          } else {
            blocks.push({ items: [{ q, i }] });
            current = null;
          }
        });
        return (
          '<div class="question-list">' +
          blocks
            .map((b) =>
              b.passage
                ? '<section class="group-panel" aria-label="공통 지문 문항"><div class="passage"><h3>[' +
                  (b.items.length === 1
                    ? b.items[0].i + 1
                    : b.items[0].i + 1 + "–" + (b.items.at(-1).i + 1)) +
                  "] 다음 글을 읽고 물음에 답하시오.</h3><p" +
                  (b.items[0].q.subject === "영어" ? ' lang="en"' : "") +
                  ">" +
                  esc(b.passage) +
                  '</p></div><div class="question-group">' +
                  b.items.map(({ q, i }) => question(q, i, print)).join("") +
                  "</div></section>"
                : question(b.items[0].q, b.items[0].i, print),
            )
            .join("") +
          "</div>"
        );
      }
      function question(q, i, print) {
        return (
          '<article class="question" data-qid="' +
          q.id +
          '" data-reorder-id="' +
          q.id +
          '" aria-label="' +
          (i + 1) +
          '번 문항"><div class="q-head"><div class="q-meta">' +
          (!print
            ? '<button type="button" class="reorder-handle" data-reorder-handle aria-label="' +
              (i + 1) +
              '번 문항 순서 이동"><span aria-hidden="true">⠿</span></button>'
            : "") +
          '<span class="q-num">' +
          String(i + 1).padStart(2, "0") +
          '</span><span class="caption">' +
          esc(q.unitName) +
          '</span><span class="badge">' +
          q.level +
          "</span></div>" +
          (!print ? '<span class="caption">객관식</span>' : "") +
          '</div><div class="q-copy">' +
          esc(q.prompt) +
          '</div><div class="options">' +
          q.options
            .map(
              (o, j) =>
                '<div class="option"><span>' +
                ["①", "②", "③", "④"][j] +
                "</span><span>" +
                esc(o) +
                "</span></div>",
            )
            .join("") +
          "</div>" +
          (!print
            ? '<div class="q-tools"><details><summary>정답·해설 보기</summary><p class="answer">' +
              esc(q.answer) +
              '</p></details><div class="row"><button id="up-' +
              i +
              '" class="ghost iconbtn" data-action="up" data-index="' +
              i +
              '" aria-label="' +
              (i + 1) +
              '번 문항 위로" ' +
              (i === 0 ? "disabled" : "") +
              ">" +
              icon("up") +
              '</button><button id="down-' +
              i +
              '" class="ghost iconbtn" data-action="down" data-index="' +
              i +
              '" aria-label="' +
              (i + 1) +
              '번 문항 아래로" ' +
              (i === state.questions.length - 1 ? "disabled" : "") +
              ">" +
              icon("down") +
              '</button><button id="replace-' +
              i +
              '" data-action="replace" data-index="' +
              i +
              '">' +
              icon("swap") +
              '교체</button><button id="remove-' +
              i +
              '" class="ghost danger" data-action="remove" data-index="' +
              i +
              '" aria-label="' +
              (i + 1) +
              '번 문항 삭제">삭제</button></div></div>'
            : "") +
          "</article>"
        );
      }
      function openOutput() {
        ExamOutput.open(
          {
            subject: state.applied.subject === "영어" ? "english" : "math",
            title: state.title,
            questions: state.questions.map((q) => ({
              id: q.id,
              prompt: q.prompt,
              choices: q.options,
              passage: q.passage || "",
              answer: q.answer,
              grade: "중1",
              unit: q.unitName,
              level: q.level,
            })),
          },
          ({ title, questionIds }) => {
            if (
              title !== state.title ||
              questionIds.join() !== state.questions.map((q) => q.id).join()
            )
              remember();
            const byId = new Map(state.questions.map((q) => [q.id, q]));
            state.questions = questionIds.map((id) => byId.get(id));
            state.title = title;
            state.stage = 2;
            render("preview");
          },
        );
      }
      function closeDialog() {
        const el = $("#dialog");
        el.close();
        if (dialogReturn) focusId(dialogReturn);
        dialogMode = null;
      }
      function openDialog(kind, index, trigger) {
        if (kind !== "compose") {
          let chosenId;
          ExamQuestionPicker.open({
            mode: kind,
            levels: pool(state.applied).map((q) => q.level),
            scopeLabel: state.applied.subject + " · " + scopeText(),
            units: state.applied.units.map((u) => ({
              value: u,
              label: BANK[state.applied.subject].units[u].name,
            })),
            getCandidates: () =>
              candidates().map((q) => ({ ...q, choices: q.options })),
            getCount: () => state.questions.length,
            onChoose: (id) => {
              const q = candidates().find((q) => q.id === id);
              if (!q) return false;
              remember();
              if (kind === "replace") state.questions[index] = q;
              else state.questions.push(q);
              chosenId = id;
              render();
              announce(
                kind === "replace"
                  ? "문항을 교체했습니다."
                  : "문항을 추가했습니다.",
              );
            },
            onClose: () => {
              if (kind === "replace" && chosenId) focusId("replace-" + index);
              else focusId(trigger || "add");
            },
          });
          return;
        }
        dialogMode = { kind, index };
        dialogReturn = trigger;
        $("#dialog").innerHTML =
          '<div class="dialoghead"><h2 id="dialog-title">문항을 다시 구성할까요?</h2><button class="ghost" data-action="close" aria-label="닫기" autofocus>' +
          icon("close") +
          '</button></div><div class="dialogbody"><p>새로 선택한 범위로 ' +
          state.draft.count +
          '문항을 구성합니다. 현재 문항 편집은 실행 취소로 되돌릴 수 있습니다.</p></div><div class="dialogfoot"><button data-action="close">취소</button><button class="primary" data-action="confirm-compose">다시 구성</button></div>';
        $("#dialog").showModal();
      }
      function compose() {
        // An empty or unsupported scope must never fall back to unrelated questions.
        if (
          !state.draft.scopeIds.length ||
          pool(state.draft).length < state.draft.count
        ) {
          render("config-heading");
          announce("선택한 범위에 연결된 예시 문항 수를 확인해 주세요.");
          return;
        }
        state.draft.units = scopeController.sampleIndices(state.draft.scopeIds);
        remember();
        state.applied = structuredClone(state.draft);
        const units = state.applied.units;
        let picked = [];
        let n = 0;
        while (
          picked.length < state.applied.count &&
          n <
            Math.max(
              ...units.map((u) => BANK[subject].units[u].questions.length),
            )
        ) {
          for (const u of units) {
            const q = BANK[state.applied.subject].units[u].questions[n];
            if (q && picked.length < state.applied.count) picked.push(q);
          }
          n++;
        }
        state.questions = picked.sort((a, b) => a.unit - b.unit);
        state.stage = 2;
        state.title = state.applied.subject + " 단원 확인 평가";
        render("review-heading");
        reviewPosition();
        announce(state.questions.length + "문항을 구성했습니다.");
      }
      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-scope-open]")) {
          scopeController.open(state.draft.scopeIds);
          return;
        }
        const b = event.target.closest("[data-action]");
        if (!b || b.disabled) return;
        const action = b.dataset.action,
          i = Number(b.dataset.index);
        if (action === "count") {
          state.draft.count = Number(b.dataset.value);
          render("count-" + b.dataset.value);
        } else if (action === "compose") {
          if (state.applied) openDialog("compose", null, "compose");
          else compose();
        } else if (action === "confirm-compose") {
          closeDialog();
          compose();
        } else if (action === "undo") {
          if (history.length) {
            state = JSON.parse(history.pop());
            state.stage = state.applied ? 2 : 1;
            render(state.applied ? "review-heading" : "config-heading");
            announce("이전 구성으로 되돌렸습니다.");
          }
        } else if (action === "back-config") {
          state.stage = 1;
          render("config-heading");
          window.scrollTo(0, 0);
        } else if (action === "preview") {
          openOutput();
        } else if (action === "back-review") {
          state.stage = 2;
          render("review-heading");
          reviewPosition();
        } else if (action === "replace" || action === "add") {
          openDialog(action, i, b.id);
        } else if (action === "close") {
          closeDialog();
        } else if (action === "remove") {
          remember();
          state.questions.splice(i, 1);
          render(
            state.questions.length
              ? "remove-" + Math.min(i, state.questions.length - 1)
              : "add",
          );
          announce("문항을 삭제했습니다. 실행 취소로 복원할 수 있습니다.");
        } else if (action === "up" || action === "down") {
          const to = action === "up" ? i - 1 : i + 1;
          if (to < 0 || to >= state.questions.length) return;
          remember();
          [state.questions[i], state.questions[to]] = [
            state.questions[to],
            state.questions[i],
          ];
          render("replace-" + to);
          announce(i + 1 + "번 문항을 " + (to + 1) + "번으로 옮겼습니다.");
        } else if (action === "print") {
          window.print();
        }
      });
      $("#dialog").addEventListener("cancel", (event) => {
        event.preventDefault();
        closeDialog();
      });
      $("#dialog").addEventListener("keydown", (event) => {
        if (event.key !== "Tab") return;
        const items = [
          ...$("#dialog").querySelectorAll(
            'button:not(:disabled),summary,input,select,textarea,a[href],[tabindex="0"]',
          ),
        ].filter((el) => el.getClientRects().length);
        const first = items[0],
          last = items.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.isComposing ||
          event.target.closest("input,textarea,select,[contenteditable]") ||
          document.querySelector("dialog[open]")
        )
          return;
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "z" &&
          history.length &&
          state.stage !== 3
        ) {
          event.preventDefault();
          const btn = $("#undo");
          if (btn) btn.click();
        }
      });
      render();
      ExamReorder.create({
        container: $("#main"),
        itemSelector: ".question[data-reorder-id]",
        getIds: () => state.questions.map((q) => q.id),
        onReorder: (ids) => {
          remember();
          const byId = new Map(state.questions.map((q) => [q.id, q]));
          state.questions = ids.map((id) => byId.get(id));
          render();
        },
        announce,
      });
    </script>
  </body>
</html>
