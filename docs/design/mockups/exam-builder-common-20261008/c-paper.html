<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 C · 지면에서 만드는 시험지</title>
    <link rel="stylesheet" href="scope-picker.css" />
    <style>
      @font-face {
        font-family: Pretendard;
        src: url("../../../../public/fonts/PretendardVariable.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --learn-ink: #172b4d;
        --ink: var(--learn-ink);
        --learn-muted: #596c86;
        --muted: var(--learn-muted);
        --learn-accent: #3159df;
        --accent: var(--learn-accent);
        --hover: #2448bd;
        --learn-bg: #f4f6fa;
        --bg: var(--learn-bg);
        --learn-nav: #14243d;
        --nav: var(--learn-nav);
        --learn-soft: #edf2ff;
        --soft: var(--learn-soft);
        --line: #dde3ec;
        --control: #b8c4d6;
        --danger: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 24px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 Pretendard,
          system-ui,
          sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button,
      select,
      input:not([type="checkbox"]) {
        min-height: 44px;
        border: 1px solid var(--control);
        border-radius: 8px;
        background: #fff;
        padding: 10px 14px;
      }
      button {
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      button:hover {
        background: var(--soft);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.primary:hover {
        background: var(--hover);
      }
      button.text {
        border-color: transparent;
        background: transparent;
        color: var(--accent);
      }
      button.danger {
        color: var(--danger);
      }
      button.icon {
        width: 44px;
        padding: 0;
        flex-shrink: 0;
      }
      input,
      select {
        max-width: 100%;
        min-width: 0;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 1.3;
        font-weight: 750;
        letter-spacing: -0.035em;
      }
      h2 {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
      }
      h3 {
        font-size: 14px;
      }
      .caption,
      .eyebrow {
        font-size: 12px;
        color: var(--muted);
      }
      .eyebrow {
        letter-spacing: 0.08em;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .spread {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        background: var(--soft);
        color: var(--accent);
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }
      .field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .field > span,
      .field > label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .field input:not([type="checkbox"]),
      .field select {
        width: 100%;
      }
      .rule {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .panel {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        min-width: 0;
      }
      .top-note {
        min-height: 44px;
        padding: 8px 20px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }
      .top-note a {
        min-height: 44px;
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      .brand {
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.025em;
      }
      .mark {
        display: inline-flex;
        width: 28px;
        height: 28px;
        border: 2px solid currentColor;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        margin-right: 8px;
        font-size: 18px;
      }
      .heading {
        margin-bottom: 20px;
      }
      .heading p {
        margin-top: 6px;
        color: var(--muted);
      }
      .check {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .selected-scope {
        min-width: 0;
      }
      .coverage-note {
        margin-top: 12px;
      }
      .blueprint-mode .selected-scope {
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }
      .setup {
        margin-bottom: 24px;
      }
      .setup-main {
        display: grid;
        grid-template-columns: 160px auto;
        justify-content: end;
        margin-top: 16px;
        gap: 20px;
        align-items: end;
      }
      .setup-head {
        margin-bottom: 16px;
      }
      .setup-footer {
        margin-top: 12px;
        min-height: 18px;
      }
      .error {
        color: var(--danger);
      }
      .toolbar {
        margin-bottom: 16px;
      }
      .total {
        font-variant-numeric: tabular-nums;
      }
      .question {
        position: relative;
        min-width: 0;
        scroll-margin-top: 24px;
        outline: none;
      }
      .question:target,
      .question.flash {
        background: #f6f8ff;
      }
      .question-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .qno {
        color: var(--accent);
        font-size: 18px;
        font-weight: 750;
        line-height: 1.5;
        min-width: 24px;
        font-variant-numeric: tabular-nums;
      }
      .qbody {
        flex: 1;
        min-width: 0;
      }
      .prompt {
        font-weight: 600;
        line-height: 1.7;
        white-space: pre-line;
      }
      .choices {
        display: grid;
        gap: 8px;
        margin-top: 16px;
        line-height: 1.6;
      }
      .choice {
        display: flex;
        gap: 8px;
      }
      .choice span:first-child {
        color: var(--muted);
      }
      .qmeta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .q-actions {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 16px;
      }
      .q-actions button {
        padding: 8px 12px;
        font-size: 14px;
        min-height: 44px;
      }
      .q-actions button.icon {
        padding: 0;
      }
      .answer {
        margin-top: 16px;
        background: var(--soft);
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
      }
      .passage {
        padding: 20px;
        border: 1px solid var(--control);
        background: #fbfcfe;
        line-height: 1.85;
        margin: 20px 0;
        white-space: pre-line;
      }
      .passage strong {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .space {
        height: 56px;
        border-bottom: 1px dashed var(--line);
        margin-top: 8px;
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }
      .empty h2 {
        color: var(--ink);
        margin-bottom: 8px;
      }
      .empty button {
        margin-top: 16px;
      }
      .footnote {
        font-size: 12px;
        color: var(--muted);
        margin: 24px 0;
        text-align: center;
      }
      .paper {
        background: white;
        border: 1px solid var(--line);
        box-shadow: 0 3px 14px #172b4d08;
        max-width: 794px;
        width: 100%;
        padding: 48px 48px 32px;
        margin: 0 auto;
        min-height: 1000px;
      }
      .paper-header {
        padding-bottom: 24px;
        margin-bottom: 12px;
        border-bottom: 2px solid var(--ink);
        text-align: center;
      }
      .paper-header .eyebrow {
        margin-bottom: 12px;
      }
      .paper-title {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.025em;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .paper-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 20px;
        text-align: left;
        font-size: 12px;
      }
      .paper .question {
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }
      .paper .q-actions {
        justify-content: flex-end;
      }
      .paper-footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 32px;
        font-size: 12px;
        color: var(--muted);
      }
      .paper-stage {
        min-width: 0;
      }
      .paper-stage .paper {
        max-width: none;
      }
      #app .prompt,
      #app .choices,
      #app .passage {
        max-width: 78ch;
      }
      .paper-toolbar {
        margin-bottom: 12px;
      }
      .paper-mode .masthead {
        background: var(--nav);
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .paper-mode .masthead .caption {
        color: #c7d3e4;
      }
      .paper-mode .workspace {
        width: 100%;
        min-width: 0;
        padding: 16px 20px;
      }
      .paper-mode .canvas {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 24px;
        align-items: start;
      }
      .inspector {
        position: sticky;
        top: 20px;
        display: grid;
        gap: 16px;
      }
      .inspector .panel {
        padding: 20px;
      }
      .navigator {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }
      .navigator button {
        padding: 8px 0;
      }
      .navigator button.active {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent);
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        font-size: 12px;
      }
      .inspector .primary,
      .inspector .full {
        width: 100%;
      }
      .title-field {
        margin-top: 16px;
      }
      .inspector h2 {
        font-size: 14px;
      }
      .question-summary {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .blueprint-mode .shell {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        min-height: calc(100vh - 61px);
      }
      .rail {
        background: var(--nav);
        color: #fff;
        padding: 28px 20px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .rail .eyebrow {
        color: #a8bbd4;
      }
      .rail .brand {
        font-size: 18px;
      }
      .rail .rail-link {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 48px;
        color: #d9e3f3;
        padding: 8px 12px;
        border-radius: 8px;
      }
      .rail .rail-link.selected {
        background: #263e61;
        color: white;
      }
      .rail .rail-link small {
        font-size: 12px;
        color: #a8bbd4;
      }
      .rail nav {
        display: grid;
        gap: 8px;
      }
      .rail-note {
        font-size: 12px;
        color: #b4c4da;
        line-height: 1.8;
        margin-top: auto;
        border-top: 1px solid #354660;
        padding-top: 20px;
      }
      .rail-count {
        font-size: 24px;
        font-weight: 750;
        color: #fff;
        margin-top: 8px;
      }
      .blueprint-mode .workspace {
        width: 100%;
        min-width: 0;
        padding: 16px 20px;
      }
      .blueprint-mode .heading {
        margin-bottom: 24px;
      }
      .blueprint-mode .setup {
        padding: 0;
        overflow: hidden;
      }
      .blueprint-mode .setup-head {
        padding: 20px;
        margin: 0;
        border-bottom: 1px solid var(--line);
      }
      .blueprint-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .blueprint-table th {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        background: #fafbfd;
        text-align: left;
        padding: 12px 24px;
      }
      .blueprint-table td {
        padding: 12px 24px;
        border-bottom: 1px solid var(--line);
      }
      .blueprint-table th:nth-child(1) {
        width: 48%;
      }
      .blueprint-table th:nth-child(2) {
        width: 180px;
      }
      .blueprint-table td:last-child,
      .blueprint-table th:last-child {
        text-align: right;
      }
      .unit-index {
        font-size: 12px;
        color: var(--muted);
        margin-right: 12px;
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--control);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }
      .stepper button {
        border: 0;
        border-radius: 0;
        padding: 0;
        width: 44px;
      }
      .stepper output {
        min-width: 28px;
        text-align: center;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .allocation {
        height: 4px;
        background: var(--line);
        max-width: 120px;
        margin-top: 8px;
        border-radius: 3px;
      }
      .allocation span {
        display: block;
        background: var(--accent);
        height: 100%;
        border-radius: 3px;
      }
      .compose-bar {
        background: #fafbfd;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .compose-bar .total {
        font-size: 18px;
        font-weight: 750;
      }
      .blueprint-mode .results-heading {
        margin: 28px 0 16px;
      }
      .unit-group {
        margin-bottom: 24px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .unit-heading {
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .unit-name {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .unit-code {
        display: flex;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--accent);
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      .unit-content {
        padding: 0 24px;
      }
      .unit-content > .passage {
        margin-bottom: 0;
      }
      .blueprint-mode .question {
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
      }
      .blueprint-mode .question:last-child {
        border-bottom: 0;
      }
      .blueprint-mode .q-actions {
        margin: 0;
        max-width: 156px;
        align-content: start;
        justify-content: flex-end;
      }
      .blueprint-mode .qmeta {
        display: none;
      }
      .blueprint-mode .choices {
        grid-template-columns: 1fr 1fr;
        gap: 8px 20px;
      }
      .blueprint-mode .output-panel {
        margin-top: 24px;
      }
      .blueprint-mode .output-fields {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 160px 170px;
        gap: 16px;
        margin-top: 16px;
        align-items: end;
      }
      .no-margin {
        margin: 0;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        background: var(--nav);
        color: white;
        border-radius: 8px;
        padding: 12px 20px;
        box-shadow: 0 5px 20px #172b4d29;
        font-size: 14px;
        z-index: 10;
        pointer-events: none;
      }
      .toast:empty {
        display: none;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 0;
        color: var(--ink);
        width: 640px;
        max-width: calc(100% - 32px);
        max-height: calc(100dvh - 32px);
        box-shadow: 0 25px 100px #10203f33;
      }
      dialog::backdrop {
        background: #14243d70;
        backdrop-filter: blur(3px);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 20px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 1;
      }
      .dialog-content {
        padding: 20px;
      }
      .dialog-intro {
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 20px;
      }
      .candidate {
        padding: 20px 0;
        border-top: 1px solid var(--line);
      }
      .candidate:first-child {
        border-top: 0;
      }
      .candidate .primary {
        margin-top: 16px;
      }
      .candidate .choices {
        font-size: 12px;
      }
      .candidate .passage {
        padding: 12px;
        font-size: 12px;
      }
      .preview-dialog {
        width: 880px;
        background: var(--bg);
      }
      .preview-dialog .dialog-content {
        padding: 24px;
      }
      .preview-dialog .paper {
        min-height: auto;
        padding: 40px;
      }
      .preview-dialog .q-actions,
      .preview-dialog .qmeta {
        display: none;
      }
      .preview-dialog .question {
        display: block;
      }
      .preview-dialog .choices {
        grid-template-columns: 1fr;
      }
      .preview-dialog .paper .question {
        padding: 20px 0;
      }
      .preview-controls {
        padding: 12px 24px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .preview-dialog .paper-footer {
        display: none;
      }
      .print-only {
        display: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .initial-empty {
        display: none;
      }
      .initial-empty h2 {
        margin: 8px 0;
      }
      .uncomposed .initial-empty {
        display: block;
        padding: 20px;
        border-style: dashed;
      }
      .uncomposed .canvas,
      .uncomposed #composition,
      .uncomposed #output,
      .uncomposed .rail-link:not(.selected),
      .uncomposed.blueprint-mode .heading > .primary {
        display: none;
      }
      @media (max-width: 1100px) {
        .paper-mode .canvas {
          grid-template-columns: minmax(0, 1fr) 236px;
          gap: 16px;
        }
        .paper {
          padding: 32px;
        }
        .blueprint-mode .shell {
          grid-template-columns: 180px minmax(0, 1fr);
        }
        .rail {
          padding: 24px 16px;
        }
        .blueprint-mode .question {
          display: block;
        }
        .blueprint-mode .q-actions {
          max-width: none;
          margin-top: 12px;
          justify-content: flex-start;
        }
        .blueprint-table td,
        .blueprint-table th {
          padding: 12px 16px;
        }
        .blueprint-mode .output-fields {
          grid-template-columns: minmax(0, 1fr) 150px;
        }
        .blueprint-mode .output-fields > .primary {
          grid-column: 1/-1;
        }
        .setup-main {
          grid-template-columns: 160px auto;
        }
      }
      @media (max-width: 860px) {
        .top-note {
          padding: 8px 16px;
          align-items: center;
        }
        .top-note span {
          max-width: 210px;
        }
        .paper-mode .masthead {
          padding: 16px;
          gap: 12px;
          flex-wrap: wrap;
        }
        .paper-mode .masthead .caption {
          display: none;
        }
        .paper-mode .workspace,
        .blueprint-mode .workspace {
          padding: 14px 16px;
        }
        .paper-mode:not(.uncomposed) .canvas {
          display: flex;
          flex-direction: column;

          .join(
            "",
          )}</tbody></table><div class="compose-bar"><div><span class="total">합계 ${total}문항</span><p class="caption" id="scope-status" style="margin-top:4px"></p></div><button class="primary" data-action="compose" ${total ? "" : "disabled"}>시험지 구성 <span aria-hidden="true">→</span></button></div></section><div class="initial-empty panel"><span class="eyebrow">다음 · 단원별 문항 검토</span><h2>구성표가 시험지의 뼈대가 됩니다.</h2><p class="muted">단원별 문항 수를 정한 뒤 시험지 구성을 눌러 주세요.</p></div><section id="composition" aria-labelledby="composition-title"><div class="spread results-heading"><div><h2 id="composition-title">구성한 문항 <span class="badge">${state.items.length}</span></h2><p class="caption" style="margin-top:4px">단원 안에서 문항을 바꾸고 순서를 조정하세요.</p></div><div class="row"><button class="text" data-action="undo" ${history.length ? "" : "disabled"}>↶ 되돌리기</button><button data-action="add">＋ 문항 추가</button></div></div>${
          state.items.length
            ? state.order
                .filter((u) => unitItems(u).length)
                .map(
                  (u, idx, arr) =>
                    `<section class="unit-group" id="unit-${u}"><div class="unit-heading"><div class="unit-name"><span class="unit-code">${String(idx + 1).padStart(2, "0")}</span><div><h2>${esc(units()[u].name)}</h2><p class="caption">${esc(units()[u].topic)} · ${unitItems(u).length}문항</p></div></div><div class="row"><button data-action="add" data-unit="${u}">＋ 문항 추가</button><button class="icon" data-action="unit-up" data-unit="${u}" aria-label="${esc(units()[u].name)} 단원 위로" ${idx === 0 ? "disabled" : ""}>↑</button><button class="icon" data-action="unit-down" data-unit="${u}" aria-label="${esc(units()[u].name)} 단원 아래로" ${idx === arr.length - 1 ? "disabled" : ""}>↓</button></div></div><div class="unit-content">${passageHTML(u)}${unitItems(
                      u,
                    )
                      .map((id) => questionHTML(id, state.items.indexOf(id)))
                      .join("")}</div></section>`,
                )
                .join("")
            : '<div class="panel empty"><h2>아직 담은 문항이 없습니다</h2><p>출제 구성표에서 수량을 정하거나 문항을 추가하세요.</p></div>'
        }</section><section class="panel output-panel" id="output"><div class="spread"><h2>출력 설정</h2><span class="caption">A4 · 세로 · 한 단</span></div><div class="output-fields">${titleField()}<div><label class="check"><input id="answers" type="checkbox" ${state.answers ? "checked" : ""}>정답 포함</label><label class="check"><input id="space" type="checkbox" ${state.space ? "checked" : ""}>풀이 공간</label></div>${previewButton()}</div><p class="caption" style="margin-top:12px">실제 쪽 나눔은 브라우저 인쇄에서 확인하세요.</p></section><p class="footnote">이 시안을 위해 작성한 문항입니다. 실제 문제은행·교육과정 검증 자료가 아니며 새로고침하면 편집 내용이 초기화됩니다.</p></main></div>`;
      }
      function scopeStatus() {
        if (VARIANT === "C") {
          const available = state.selected.reduce(
            (n, on, i) => n + (on ? units()[i].questions.length : 0),
            0,
          );
          const invalid = available < state.target;
          $("#scope-status").textContent = invalid
            ? `구성 가능한 예제는 ${available}문항입니다. 예제 범위를 추가하거나 문항 수를 줄이세요.`
            : `연결된 예제 ${available}문항 중 ${state.target}문항을 구성합니다. 구성하면 현재 문항이 바뀝니다.`;
          $("#scope-status").classList.toggle("error", invalid);
          $('[data-action="compose"]').disabled = invalid;
        } else {
          const n = state.counts.reduce((a, b) => a + b, 0);
          $("#scope-status").textContent = n
            ? "시험지 구성을 누르면 현재 문항이 구성표대로 바뀝니다."
            : "연결된 예제 범위를 선택하고 문항 수를 1개 이상 정하세요.";
          $('[data-action="compose"]').disabled = !n;
        }
      }
      function render(focus) {
        document.body.className =
          (VARIANT === "C" ? "paper-mode" : "blueprint-mode") +
          (state.composed ? "" : " uncomposed");
        $("#app").innerHTML = VARIANT === "C" ? renderC() : renderD();
        scopeStatus();
        if (focus) {
          const el = document.getElementById(focus);
          if (el) el.focus({ preventScroll: true });
        }
      }
      function normalize() {
        if (VARIANT === "D")
          state.items = state.order.flatMap((u) => unitItems(u));
      }
      function compose(initial = false) {
        if ($('[data-action="compose"]').disabled) return;
        if (!initial) remember();
        state.composed = true;
        state.items = [];
        if (VARIANT === "D") {
          state.order.forEach((u) =>
            state.items.push(
              ...units()
                [u].questions.slice(0, state.selected[u] ? state.counts[u] : 0)
                .map((q) => q.id),
            ),
          );
        } else {
          let pools = units().map((u, i) =>
            state.selected[i] ? u.questions.slice() : [],
          );
          for (
            let round = 0;
            state.items.length < state.target && round < 4;
            round++
          )
            pools.forEach((p) => {
              if (p[round] && state.items.length < state.target)
                state.items.push(p[round].id);
            });
          state.items.sort((a, b) => getQ(a).unit - getQ(b).unit);
        }
        render();
        if (!initial)
          notify(`${state.items.length}문항으로 시험지를 구성했습니다.`);
      }
      function openCandidates(mode, id = null, unit = null) {
        if (mode === "add" && Number.isInteger(unit) && !state.selected[unit])
          unit = "scope";
        candidateContext = { mode, id, unit };
        dialogOpener = document.activeElement;
        $("#candidate-title").textContent =
          mode === "replace" ? "문항 교체" : "문항 추가";
        renderCandidates();
        $("#candidate-dialog").showModal();
      }
      function renderCandidates() {
        const { mode, id, unit } = candidateContext;
        const filter = mode === "replace" ? getQ(id).unit : unit;
        const pool = units()
          .flatMap((u) => u.questions)
          .filter(
            (q) =>
              !state.items.includes(q.id) &&
              (mode === "replace" || state.selected[q.unit]) &&
              (filter === null ||
                (filter === "scope"
                  ? state.selected[q.unit]
                  : q.unit === filter)),
          );
        $("#candidate-content").innerHTML = `${
          mode === "replace"
            ? `<p class="dialog-intro">${esc(units()[filter].name)} · 현재 문항과 같은 자체 작성 예제 범위입니다.</p>`
            : `<label class="field"><span>추가할 단원</span><select id="candidate-unit"><option value="scope" ${filter === "scope" ? "selected" : ""}>선택한 출제 범위</option>${units()
                .map((unit, i) => ({ unit, i }))
                .filter(({ i }) => state.selected[i])
                .map(
                  ({ unit: u, i }) =>
                    `<option value="${i}" ${filter === i ? "selected" : ""}>${esc(u.name)}</option>`,
                )
                .join(
                  "",
                )}</select></label><p class="dialog-intro">현재 시험지에 없는 예시 ${pool.length}문항</p>`
        }${pool.length ? pool.map((q) => `<article class="candidate"><div class="row" style="margin-bottom:8px"><span class="badge">${esc(units()[q.unit].name)}</span><span class="caption">${q.level} · ${q.choices.length ? "선택형" : "서답형"}</span></div>${units()[q.unit].passage ? `<details><summary class="check">연결 지문 보기</summary>${passageHTML(q.unit)}</details>` : ""}<p class="prompt">${esc(q.text)}</p>${choiceHTML(q)}<button class="primary" data-action="choose" data-id="${esc(q.id)}">${mode === "replace" ? "이 문항으로 교체" : "이 문항 추가"}</button></article>`).join("") : '<div class="empty"><h2>남은 후보가 없습니다</h2><p>선택 범위에 연결된 예제가 없거나, 연결된 예제를 모두 담았습니다. 출제 범위에서 자체 작성 예시를 선택할 수 있습니다.</p></div>'}`;
      }
      function closeCandidate() {
        $("#candidate-dialog").close();
        if (dialogOpener?.isConnected) dialogOpener.focus();
        else $('[data-action="add"]')?.focus({ preventScroll: true });
      }
      function updatePreview() {
        $("#preview-content").innerHTML = paperHTML(true);
        $("#print-root").innerHTML = paperHTML(true);
        $("#preview-answers").checked = state.answers;
        $("#preview-space").checked = state.space;
      }
      function closePreview() {
        $("#preview-dialog").close();
        if (dialogOpener?.isConnected) dialogOpener.focus();
        else $('[data-action="preview"]')?.focus({ preventScroll: true });
      }
      document.addEventListener("click", (e) => {
        if (e.target.closest("[data-scope-open]")) {
          scopeController.open(state.scopeIds);
          return;
        }
        const b = e.target.closest("[data-action]");
        if (!b || b.disabled) return;
        const action = b.dataset.action,
          id = b.dataset.id,
          u = Number(b.dataset.unit);
        if (action === "compose") compose();
        if (action === "undo") {
          if (!history.length) return;
          state = history.pop();
          render();
          notify("직전 변경을 되돌렸습니다.");
        }
        if (action === "replace") openCandidates("replace", id);
        if (action === "add")
          openCandidates(
            "add",
            null,
            b.dataset.unit === undefined ? "scope" : u,
          );
        if (action === "close-candidate") closeCandidate();
        if (action === "choose") {
          remember();
          const ctx = candidateContext;
          if (ctx.mode === "replace")
            state.items[state.items.indexOf(ctx.id)] = id;
          else state.items.push(id);
          normalize();
          $("#candidate-dialog").close();
          render();
          const focus = document.getElementById("q-" + id);
          focus?.focus({ preventScroll: true });
          notify(
            ctx.mode === "replace"
              ? "문항을 교체했습니다."
              : "문항을 추가했습니다.",
          );
        }
        if (action === "delete") {
          remember();
          const index = state.items.indexOf(id);
          state.items.splice(index, 1);
          render();
          const next = state.items[Math.min(index, state.items.length - 1)];
          if (next)
            document
              .getElementById("q-" + next)
              ?.focus({ preventScroll: true });
          else $('[data-action="add"]')?.focus({ preventScroll: true });
          notify("문항을 삭제했습니다. 되돌리기로 복원할 수 있어요.");
        }
        if (action === "up" || action === "down") {
          const candidates =
            VARIANT === "D" ? unitItems(getQ(id).unit) : state.items;
          const i = candidates.indexOf(id),
            to = i + (action === "up" ? -1 : 1);
          if (to < 0 || to >= candidates.length) return;
          remember();
          const a = state.items.indexOf(id),
            c = state.items.indexOf(candidates[to]);
          [state.items[a], state.items[c]] = [state.items[c], state.items[a]];
          render("q-" + id);
          notify("문항 순서를 변경했습니다.");
        }
        if (action === "unit-up" || action === "unit-down") {
          const visible = state.order.filter((x) => unitItems(x).length);
          const i = visible.indexOf(u),
            to = i + (action === "unit-up" ? -1 : 1);
          if (to < 0 || to >= visible.length) return;
          remember();
          const a = state.order.indexOf(u),
            c = state.order.indexOf(visible[to]);
          [state.order[a], state.order[c]] = [state.order[c], state.order[a]];
          normalize();
          render();
          $(`#unit-${u} h2`)?.scrollIntoView({ block: "nearest" });
          notify("단원 순서를 변경했습니다.");
        }
        if (action === "more" || action === "less") {
          remember();
          state.counts[u] = Math.max(
            0,
            Math.min(4, state.counts[u] + (action === "more" ? 1 : -1)),
          );
          render();
          $(`[data-action="${action}"][data-unit="${u}"]`)?.focus({
            preventScroll: true,
          });
        }
        if (action === "jump") {
          document.getElementById("q-" + id)?.focus();
          document
            .querySelectorAll(".navigator button")
            .forEach((el) =>
              el.classList.toggle("active", el.dataset.id === id),
            );
        }
        if (action === "preview") {
          dialogOpener = b;
          updatePreview();
          $("#preview-dialog").showModal();
        }
        if (action === "close-preview") closePreview();
        if (action === "print") {
          updatePreview();
          window.print();
        }
      });
      document.addEventListener("change", (e) => {
        const el = e.target;
        if (el.id === "target") {
          remember();
          state.target = Number(el.value);
          scopeStatus();
          $('[data-action="undo"]').disabled = false;
        }
        if (el.id === "candidate-unit") {
          candidateContext.unit =
            el.value === "scope" ? "scope" : Number(el.value);
          renderCandidates();
          $("#candidate-unit").focus();
        }
        if (el.id === "answers" || el.id === "space") {
          remember();
          state[el.id] = el.checked;
          render();
          $("#" + el.id)?.focus({ preventScroll: true });
        }
        if (el.id === "preview-answers" || el.id === "preview-space") {
          remember();
          state[el.id.replace("preview-", "")] = el.checked;
          render();
          updatePreview();
        }
        if (el.id === "exam-title") {
          remember();
          state.title = el.value.trim() || "제목 없는 시험지";
          el.value = state.title;
          document
            .querySelectorAll("#app .paper-title")
            .forEach((node) => (node.textContent = state.title));
          $('[data-action="undo"]').disabled = false;
        }
      });
      // Keep the paper heading in sync while typing; commit an undoable edit on change.
      document.addEventListener("input", (e) => {
        if (e.target.id === "exam-title")
          document
            .querySelectorAll("#app .paper-title")
            .forEach(
              (el) => (el.textContent = e.target.value || "제목 없는 시험지"),
            );
      });
      $("#candidate-dialog").addEventListener("cancel", (e) => {
        e.preventDefault();
        closeCandidate();
      });
      $("#preview-dialog").addEventListener("cancel", (e) => {
        e.preventDefault();
        closePreview();
      });
      window.addEventListener("beforeprint", () => {
        $("#print-root").innerHTML = paperHTML(true);
      });
      render();
    </script>
  </body>
</html>
