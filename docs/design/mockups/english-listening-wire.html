<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어듣기 · 화면 구조 4안</title>
<style>
@font-face{font-family:Pretendard;src:url('../../../public/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--paper:#fff;--ink:#161616;--muted:#61615e;--line:#b9b9b6;--wash:#f4f4f2;--side:#e9e9e6}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 Pretendard,"Malgun Gothic",sans-serif}button,select{font:inherit;color:inherit}button{background:var(--paper);border:1px solid var(--line);padding:9px 14px;cursor:pointer;min-height:42px}button:hover{background:var(--side)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--ink);color:white;border-color:var(--ink)}button:disabled{cursor:default;color:var(--muted);background:var(--wash)}h1,h2,h3,p{margin:0}h1{font-size:26px}h2{font-size:23px;letter-spacing:-.6px}h3{font-size:16px}small,.muted{color:var(--muted)}.lab{padding:20px 28px;background:white;border-bottom:2px solid var(--ink)}.lab-head{display:flex;justify-content:space-between;gap:20px;align-items:center}.label{font-size:11px;font-weight:700;letter-spacing:1px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.scenes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.explanation{padding-top:12px;color:var(--muted);font-size:14px}.frame{margin:24px auto;max-width:1370px;min-height:660px;border:1px solid var(--line);background:white;display:grid;grid-template-columns:178px minmax(0,1fr)}.brand{padding:24px 18px;background:var(--side);border-right:1px solid var(--line)}.brand strong{display:block;font-size:23px;line-height:1.2;margin-bottom:40px}.brand p{margin:18px 0;color:var(--muted);font-size:13px}.brand .selected{font-weight:900;color:var(--ink);border-left:3px solid var(--ink);padding-left:10px;margin-left:-13px}.workspace{min-width:0;padding:28px 32px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.heading p{font-size:13px;color:var(--muted);margin-top:5px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:12px;font-size:14px}.tabs strong{border-bottom:3px solid var(--ink);padding-bottom:12px}.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}.document{max-width:750px;margin:0 auto}.rows{border-top:2px solid var(--ink)}.row{padding:14px 0;border-bottom:1px solid var(--line)}.row small{display:block;margin-top:4px}.row.chosen{border-left:3px solid var(--ink);padding-left:12px;background:var(--wash)}.pane{border:1px solid var(--line);padding:22px;min-width:0}.pane h3{margin-bottom:12px}.player{padding:20px;background:var(--wash);border:1px solid var(--line);margin:18px 0}.player-main{display:flex;gap:16px;align-items:center}.bar{height:4px;background:var(--line);flex:1}.time{font-variant-numeric:tabular-nums;font-size:12px}.player p{margin-top:9px;font-size:12px;color:var(--muted)}.questions{border-top:1px solid var(--line);margin-top:24px}.question{padding:22px 0;border-bottom:1px solid var(--line)}.question h3{font-size:17px;margin-bottom:14px}.choices{display:grid;gap:8px}.choice{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:11px 14px;min-height:46px;cursor:pointer}.choice:has(input:checked){outline:2px solid var(--ink);outline-offset:-2px;background:var(--wash)}.choice input{accent-color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{background:var(--wash);padding:12px 16px;border-left:3px solid var(--line);font-size:13px;margin:16px 0}.steps{display:flex;gap:24px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:30px;font-size:13px}.steps strong{border-bottom:3px solid var(--ink);padding-bottom:18px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.block{border-top:2px solid var(--ink);padding-top:16px;margin:22px 0}.block p{margin:12px 0}.fields{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:18px 0;font-size:14px}.field{border:1px solid var(--line);min-height:36px;padding:7px 10px;background:var(--wash)}.ledger{width:100%;border-collapse:collapse;font-size:13px}.ledger td,.ledger th{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line)}.outline{display:grid;grid-template-columns:155px minmax(0,1fr);gap:28px}.outline nav{border-right:1px solid var(--line);padding-right:18px}.outline nav p{padding:12px 0;font-size:13px}.dock{border-top:2px solid var(--ink);background:var(--wash);padding:12px 18px;margin-top:28px;display:flex;align-items:center;gap:16px}.dock p{flex:1;font-size:13px}.student.frame{max-width:1040px;grid-template-columns:1fr}.student .workspace{padding:28px 40px}.student .heading{border-bottom:1px solid var(--line);padding-bottom:20px}.student .focus{max-width:560px;margin:auto}.progress{display:flex;gap:8px;margin:18px 0}.progress span{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);font-size:13px}.progress span:first-child{background:var(--ink);color:white}.meta-line{display:flex;justify-content:space-between;gap:15px;font-size:13px;color:var(--muted);margin:15px 0}.review{border-left:3px solid var(--ink);padding:14px;margin-top:15px;background:var(--wash)}.review p{margin-top:8px}.footer{max-width:1370px;margin:0 auto 32px;padding:0 20px;color:var(--muted);font-size:12px}.wide-only{display:block}
@media(max-width:850px){.lab{padding:16px}.lab-head{display:block}.lab-head small{display:block;margin-top:8px}.scenes{margin-left:0}.frame{margin:14px;grid-template-columns:1fr}.brand{display:none}.workspace,.student .workspace{padding:22px 18px}.split,.columns,.outline{grid-template-columns:1fr}.split>.catalog,.outline>nav{display:none}.steps{gap:12px;font-size:12px;flex-wrap:wrap}.heading{align-items:flex-start}.heading h2{font-size:22px}.tabs{gap:18px}.pane{padding:16px}.wide-only{display:none}.dock{flex-wrap:wrap}.fields{grid-template-columns:95px 1fr}.controls button{font-size:13px;padding:8px 10px}.player-main{gap:10px}.ledger td,.ledger th{padding:10px 4px}.lab h1{font-size:23px}}
</style>
<header class="lab">
  <div class="lab-head"><div><p class="label">WIREFRAME · 2026.10.03</p><h1>영어듣기 · 화면 구조 4안</h1></div><small>구조 선택용 시안 · 모든 자료와 기록은 예시</small></div>
  <div class="controls" aria-label="화면 구조 선택">
    <button data-layout="A" aria-pressed="true">A 목록 + 작업대</button><button data-layout="B" aria-pressed="false">B 단계별 한 화면</button><button data-layout="C" aria-pressed="false">C 문서형 한 흐름</button><button data-layout="D" aria-pressed="false">D 목차 + 고정 재생</button>
    <div class="scenes" aria-label="사용 장면 선택"><button data-scene="make" aria-pressed="true">교사 제작</button><button data-scene="classroom" aria-pressed="false">교사 수업</button><button data-scene="practice" aria-pressed="false">학생 자습</button><button data-scene="exam" aria-pressed="false">학생 평가</button></div>
  </div>
  <p class="explanation" id="explanation"></p>
</header>
<main id="app"></main>
<footer class="footer">배치와 작업 흐름을 비교하는 Wire 단계입니다. 음원 재생·저장·제출은 실제 서버에 연결되지 않습니다. 화면 구조 선택 후 세부 모양 4안을 제시합니다.</footer>
<script>
const descriptions={A:'A · 자료 목록을 왼쪽에 유지하고 오른쪽에서 작업합니다. 자료를 바꾸며 수업하는 교사에게 익숙한 구조입니다.',B:'B · 한 번에 한 단계에 집중합니다. 처음 등록하는 교사와 작은 화면의 학생에게 진행 순서가 분명합니다.',C:'C · 음원, 문항, 공개 설정을 위에서 아래로 읽습니다. 전체 자료를 한눈에 검토하고 일괄 수정하기 좋습니다.',D:'D · 왼쪽 목차로 문항을 이동하고 재생 조작을 아래에 모읍니다. 수업 중 재생과 문항 이동을 반복하기 좋습니다.'};
const params=new URLSearchParams(location.search);let layout=['A','B','C','D'].includes(params.get('layout'))?params.get('layout'):'A';let scene=['make','classroom','practice','exam'].includes(params.get('scene'))?params.get('scene'):'make';let review=false;let sound=false;
const questions=[{title:'두 사람이 만나기로 한 시각은?',choices:['At three o’clock.','At four o’clock.','At five o’clock.'],correct:1},{title:'남자가 먼저 하기로 한 일은?',choices:['Buy the tickets.','Call his sister.','Finish his homework.'],correct:0}];
function catalog(){return '<aside class="catalog"><h3>듣기 자료</h3><div class="rows"><div class="row chosen"><b>주말 약속</b><small>중등 · 대화 · 2문항</small></div><div class="row">학교 방송<small>중등 · 안내 · 3문항</small></div><div class="row">도서관 이용<small>고등 · 담화 · 3문항</small></div></div><p class="muted" style="margin-top:18px;font-size:12px">자료 목록 예시</p></aside>'}
function player(teacher=false){return '<div class="player"><div class="player-main"><button data-action="play">'+(sound?'일시정지':'재생')+'</button><div class="bar"></div><span class="time">00:00 / 00:34</span>'+(teacher?'<span class="time wide-only">1.0× · 반복 꺼짐</span>':'')+'</div><p>'+ (sound?'재생 중 화면 예시입니다. 실제 소리는 나지 않습니다.':'짧은 대화 1개 · 두 문항이 같은 음원을 사용합니다.')+'</p></div>'}
function question(i,teacher=false){const q=questions[i];return '<section class="question"><h3>'+(i+1)+'. '+q.title+'</h3><div class="choices">'+q.choices.map((c,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'">'+(j+1)+'　'+c+'</label>').join('')+'</div>'+(teacher?'<p class="muted" style="margin-top:12px">교사용 · 정답 '+(q.correct+1)+'</p>':'')+'</section>'}
function transcript(){return '<div class="review"><h3>대본과 해설</h3><p>W: Let’s meet at four. Can you get the tickets first?<br>M: Sure. I’ll buy them before we meet.</p><p class="muted">예시 대본 · 약속 시각은 4시, 남자는 표를 먼저 구입합니다.</p></div>'}
function teacherBody(){if(scene==='classroom')return '<p class="label">발행본 1 · 수업용</p><h2>주말 약속</h2>'+player(true)+'<div class="meta-line"><span>문항 묶음 1 · 1–2번</span><span>교사 기기에서 재생</span></div>'+question(0,true)+(layout==='C'?question(1,true):'')+'<div class="actions"><button data-action="teacher-review">'+(review?'대본 닫기':'대본과 해설 보기')+'</button></div>'+(review?transcript():'');return '<p class="label">듣기 자료 등록 · 예시</p><h2>주말 약속</h2><div class="fields"><b>수준</b><div class="field">중등 · 짧은 대화</div><b>음원</b><div class="field">주말 약속.mp3 · 34초</div><b>출처</b><div class="field">자체 제작 · 교사가 사용 범위 확인</div></div>'+player(true)+'<section class="block"><h3>대본 확인</h3><p>W: Let’s meet at four. Can you get the tickets first?<br>M: Sure. I’ll buy them before we meet.</p><small>음원과 대본을 함께 확인한 뒤 발행합니다.</small></section><div class="block"><h3>문항 2개</h3><table class="ledger"><thead><tr><th>번호</th><th>질문</th><th>확인</th></tr></thead><tbody><tr><td>1</td><td>두 사람이 만나기로 한 시각은?</td><td>완료</td></tr><tr><td>2</td><td>남자가 먼저 하기로 한 일은?</td><td>완료</td></tr></tbody></table></div><div class="actions"><button disabled>임시 저장</button><button class="primary" disabled>검수 후 발행</button></div>'}
function teacher(){const title=scene==='classroom'?'수업에서 듣기':'듣기 자료 만들기';let body=teacherBody();if(layout==='A')body='<div class="split">'+catalog()+'<section class="pane">'+body+'</section></div>';if(layout==='B')body='<div class="steps"><span>1 자료 선택</span><strong>2 '+(scene==='classroom'?'함께 듣기':'음원·문항 확인')+'</strong><span>3 '+(scene==='classroom'?'풀이·마무리':'발행·배정')+'</span></div><div class="document">'+body+'</div>';if(layout==='C')body='<div class="document"><div class="notice">'+(scene==='classroom'?'자료 전체를 펼쳐 순서대로 진행합니다.':'자료 정보 → 음원과 대본 → 문항 → 발행을 한 흐름으로 확인합니다.')+'</div>'+body+'</div>';if(layout==='D')body='<div class="outline"><nav><b>자료 목차</b><p>음원과 대본</p><p>1번 · 약속 시각</p><p>2번 · 할 일</p><p>검수와 발행</p></nav><section>'+body.replace(player(true),'')+'</section></div><div class="dock"><button data-action="play">'+(sound?'일시정지':'재생')+'</button><p>주말 약속 · 00:00 / 00:34</p><span>1.0×</span></div>';return '<div class="frame"><aside class="brand"><strong>오늘의<br>영어</strong><p>학교별 내신 대비</p><p>문제 만들기</p><p>문제 보관함</p><p class="selected">영어듣기</p></aside><div class="workspace"><div class="heading"><div><h2>'+title+'</h2><p>같은 자료로 수업, 자습 과제, 짧은 평가를 진행합니다.</p></div><span class="label wide-only">교사 화면</span></div><div class="tabs"><strong>듣기 자료</strong><span>만들기</span><span>과제와 결과</span></div>'+body+'</div></div>'}
function student(){const exam=scene==='exam';const audio=exam?'<div class="notice">교실 스피커에서 선생님이 재생합니다. 내 기기에는 재생 버튼이 없습니다.</div>':player();const progress='<div class="progress"><span>1</span><span>2</span></div>';const qs=question(0)+question(1);const release=review?transcript():'<div class="notice">'+(exam?'정답과 대본은 과제 마감 후 공개됩니다.':'이 대화의 두 문제에 모두 답하면 대본과 해설을 확인합니다.')+'</div>';let main=audio+progress+qs+release;if(layout==='A')main='<div class="split"><aside class="catalog"><h3>오늘 배정된 듣기</h3><div class="rows"><div class="row chosen">주말 약속<small>2문항 · 진행 중</small></div><div class="row">학교 방송<small>3문항 · 시작 전</small></div></div></aside><div>'+main+'</div></div>';if(layout==='B')main='<div class="focus"><div class="steps"><span>1 '+(exam?'방송 대기':'소리 확인')+'</span><strong>2 듣고 답하기</strong><span>3 '+(exam?'제출 확인':'복습')+'</span></div>'+audio+progress+'<div id="one-question">'+question(0)+'</div><div class="actions"><button data-action="previous">1번</button><button data-action="next">2번</button></div>'+release+'</div>';if(layout==='C')main='<div class="document">'+main+'</div>';if(layout==='D')main='<div class="outline"><nav><b>문항</b><p>1 · 약속 시각</p><p>2 · 할 일</p><p>'+(exam?'제출 상태':'복습')+'</p></nav><section>'+progress+qs+release+'</section></div>'+(exam?audio:'<div class="dock"><button data-action="play">'+(sound?'일시정지':'재생')+'</button><p>대화 듣기 · 00:00 / 00:34</p><span>1.0×</span></div>');return '<div class="frame student"><div class="workspace"><div class="heading"><div><p class="label">오늘의 영어 · '+(exam?'짧은 평가':'나의 듣기')+'</p><h2>주말 약속</h2><p>같은 대화를 듣고 두 문제에 답하세요.</p></div><span>'+ (exam?'남은 시간 04:28':'학습 1 / 2')+'</span></div>'+main+'<div class="meta-line"><span id="saved">아직 답하지 않았습니다.</span><span>예시 화면</span></div><div class="actions"><button class="primary" data-action="finish">'+(exam?'답안 제출':'답 확인하고 복습')+'</button></div><p id="status" role="status" class="notice" hidden></p></div></div>'}
const answers={};function capture(){document.querySelectorAll('input:checked').forEach(i=>answers[i.name]=i.value)}
function restore(){document.querySelectorAll('input').forEach(i=>i.checked=answers[i.name]===i.value);const saved=document.querySelector('#saved');if(saved)saved.textContent=Object.keys(answers).length+' / 2 답 선택 · 시안에서는 서버에 저장되지 않습니다.'}
function render(){document.querySelector('#explanation').textContent=descriptions[layout];document.querySelector('#app').innerHTML=(scene==='make'||scene==='classroom')?teacher():student();document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));restore();history.replaceState(null,'','?layout='+layout+'&scene='+scene)}
document.addEventListener('change',e=>{if(e.target.matches('input')){capture();restore()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;capture();if(b.dataset.layout){layout=b.dataset.layout;render();return}if(b.dataset.scene){scene=b.dataset.scene;review=false;sound=false;Object.keys(answers).forEach(k=>delete answers[k]);render();return}const a=b.dataset.action;if(a==='play'){sound=!sound;render()}if(a==='teacher-review'){review=!review;render()}if(a==='next'||a==='previous'){document.querySelector('#one-question').innerHTML=question(a==='next'?1:0);restore()}if(a==='finish'){const status=document.querySelector('#status');if(Object.keys(answers).length<2){status.hidden=false;status.textContent='두 문제에 모두 답해 주세요.'}else if(scene==='practice'){review=true;render();const done=document.querySelector('#status');done.hidden=false;done.textContent='두 문항 응답 후 복습이 열린 화면입니다. 실제 저장은 하지 않았습니다.'}else{status.hidden=false;status.textContent='제출 완료 화면 예시입니다. 실제 제출은 하지 않았으며 정답은 아직 공개되지 않습니다.'}}});render();
</script>
</html>
